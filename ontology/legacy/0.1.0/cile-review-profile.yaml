{
  "id": "https://colazeta.github.io/criminal_infiltration_in_legal_economy_review/vocab/cile-review.ttl",
  "name": "cile-review-profile",
  "version": "0.1.0",
  "title": "CILE Review Ontology Profile",
  "description": "Application ontology for the Criminal Infiltration in the Legal Economy living systematic review. It profiles SLR Ontology, PROV-O, FaBiO/BIBO, Web Annotation, SKOS and RIPE-O while defining only the domain and governance concepts that are specific to this review.",
  "prefixes": {
    "linkml": "https://w3id.org/linkml/",
    "cile": "https://colazeta.github.io/criminal_infiltration_in_legal_economy_review/vocab/cile-review.ttl#",
    "slr": "https://w3id.org/slr-ontology/",
    "prov": "http://www.w3.org/ns/prov#",
    "dcterms": "http://purl.org/dc/terms/",
    "fabio": "http://purl.org/spar/fabio/",
    "bibo": "http://purl.org/ontology/bibo/",
    "oa": "http://www.w3.org/ns/oa#",
    "skos": "http://www.w3.org/2004/02/skos/core#",
    "schema": "https://schema.org/",
    "foaf": "http://xmlns.com/foaf/0.1/",
    "ripe": "https://w3id.org/ripe/ripe-o#",
    "doi": "https://doi.org/"
  },
  "imports": ["linkml:types"],
  "default_prefix": "cile",
  "default_range": "string",
  "slots": {
    "review_id": {"identifier": true, "required": true, "slot_uri": "cile:reviewId"},
    "candidate_id": {"identifier": true, "slot_uri": "cile:candidateId"},
    "work_id": {"identifier": true, "slot_uri": "cile:workId"},
    "manifestation_id": {"identifier": true, "slot_uri": "cile:manifestationId"},
    "event_id": {"identifier": true, "slot_uri": "cile:eventId"},
    "decision_id": {"identifier": true, "slot_uri": "cile:decisionId"},
    "title": {"slot_uri": "dcterms:title"},
    "doi": {"slot_uri": "bibo:doi"},
    "authors_text": {"slot_uri": "dcterms:creator"},
    "publication_year": {"range": "integer", "slot_uri": "fabio:hasPublicationYear"},
    "venue": {"slot_uri": "dcterms:isPartOf"},
    "publisher": {"slot_uri": "dcterms:publisher"},
    "work_type": {"range": "WorkTypeEnum", "slot_uri": "cile:workType"},
    "canonical_status": {"slot_uri": "cile:canonicalStatus"},
    "has_identifier": {"range": "Identifier", "multivalued": true, "inlined": true, "slot_uri": "cile:hasIdentifier"},
    "has_manifestation": {"range": "Manifestation", "multivalued": true, "inlined": true, "slot_uri": "cile:hasManifestation"},
    "identifier_scheme": {"slot_uri": "cile:identifierScheme"},
    "identifier_value": {"slot_uri": "schema:value"},
    "identifier_relation": {"slot_uri": "cile:identifierRelation"},
    "source_url": {"range": "uriorcurie", "slot_uri": "dcterms:source"},
    "source_name": {"slot_uri": "cile:sourceName"},
    "query_string": {"slot_uri": "cile:queryString"},
    "retrieved_at": {"range": "datetime", "slot_uri": "prov:generatedAtTime"},
    "review_stage": {"range": "ReviewStageEnum", "slot_uri": "cile:reviewStage"},
    "candidate_status": {"range": "CandidateStatusEnum", "slot_uri": "cile:candidateStatus"},
    "screening_decision": {"range": "ScreeningDecisionEnum", "slot_uri": "cile:screeningDecision"},
    "exclusion_reason": {"slot_uri": "cile:exclusionReason"},
    "confidence": {"range": "ConfidenceEnum", "slot_uri": "cile:confidence"},
    "rationale": {"slot_uri": "cile:rationale"},
    "evidence_locator": {"slot_uri": "cile:evidenceLocator"},
    "access_status": {"range": "AccessStatusEnum", "slot_uri": "cile:accessStatus"},
    "access_kind": {"slot_uri": "cile:accessKind"},
    "access_url": {"range": "uriorcurie", "slot_uri": "cile:accessUrl"},
    "abstract_status": {"range": "AbstractStatusEnum", "slot_uri": "cile:abstractStatus"},
    "evidence_type": {"range": "EvidenceTypeEnum", "slot_uri": "cile:evidenceType"},
    "topic_code": {"slot_uri": "cile:topicCode"},
    "secondary_collection_code": {"slot_uri": "cile:secondaryCollectionCode"},
    "relation_type": {"slot_uri": "cile:relationType"},
    "infiltration_relation": {"range": "InfiltrationRelationEnum", "slot_uri": "cile:infiltrationRelation"},
    "is_current": {"range": "boolean", "slot_uri": "cile:isCurrent"},
    "version": {"slot_uri": "dcterms:hasVersion"},
    "generated_at_time": {"range": "datetime", "slot_uri": "prov:generatedAtTime"},
    "was_generated_by": {"range": "Activity", "slot_uri": "prov:wasGeneratedBy"},
    "was_attributed_to": {"range": "Agent", "slot_uri": "prov:wasAttributedTo"},
    "was_derived_from": {"range": "uriorcurie", "slot_uri": "prov:wasDerivedFrom"},
    "supersedes": {"range": "uriorcurie", "slot_uri": "prov:wasRevisionOf"}
  },
  "enums": {
    "AccessStatusEnum": {"permissible_values": {"open": {}, "restricted": {}, "unknown": {}}},
    "AbstractStatusEnum": {"permissible_values": {"available": {}, "needs_web_search": {}, "unresolved": {}, "unavailable": {}}},
    "CandidateStatusEnum": {"permissible_values": {"pending": {}, "screened_eligible_core": {}, "screened_eligible_contextual": {}, "needs_full_text": {}, "screened_not_eligible": {}, "duplicate_confirmed": {}, "screened_not_academic": {}, "screened_not_retrievable": {}}},
    "ReviewStageEnum": {"permissible_values": {"metadata_fix": {}, "manual_review": {}, "abstract_full_text_review": {}, "legacy_rejection_review": {}, "seed_validation": {}, "title_abstract": {}, "full_text": {}, "data_extraction": {}, "appraisal": {}}},
    "ScreeningDecisionEnum": {"permissible_values": {"eligible_core": {}, "eligible_contextual": {}, "maybe_full_text_needed": {}, "needs_full_text": {}, "not_eligible": {}, "duplicate": {}, "not_academic": {}, "not_retrievable": {}}},
    "ConfidenceEnum": {"permissible_values": {"high": {}, "medium": {}, "low": {}, "unknown": {}}},
    "WorkTypeEnum": {"permissible_values": {"peer_reviewed": {}, "journal_article": {}, "working_paper": {}, "book_chapter": {}, "book": {}, "conference_paper": {}, "preprint": {}, "report": {}, "thesis": {}, "other": {}}},
    "EvidenceTypeEnum": {"permissible_values": {"metadata": {}, "abstract": {}, "full_text": {}, "evidence_span": {}, "repository_record": {}, "search_result": {}, "access_observation": {}, "curator_rationale": {}}},
    "InfiltrationRelationEnum": {"permissible_values": {"access": {"description": "Sustained access by a criminal actor or interest to a legal-economy entity or market."}, "participation": {"description": "Sustained participation in a legal-economy entity or market."}, "influence": {"description": "Capacity to shape decisions or behaviour without requiring formal control."}, "control": {"description": "De facto or de jure control over a legal-economy entity or activity."}, "ownership": {"description": "Direct, indirect or beneficial ownership relation."}, "embeddedness": {"description": "Durable integration into legal economic relationships, networks or institutions."}}}
  },
  "classes": {
    "Entity": {"class_uri": "prov:Entity"},
    "Agent": {"class_uri": "prov:Agent"},
    "HumanAgent": {"is_a": "Agent", "class_uri": "foaf:Person"},
    "SoftwareAgent": {"is_a": "Agent", "class_uri": "prov:SoftwareAgent"},
    "Activity": {"class_uri": "prov:Activity", "slots": ["generated_at_time", "was_attributed_to"]},
    "SystematicReview": {"is_a": "Activity", "class_uri": "slr:SystematicReview", "slots": ["review_id", "title", "version"]},
    "ReviewProtocol": {"is_a": "Entity", "class_uri": "slr:ReviewProtocol", "slots": ["version", "was_derived_from"]},
    "ResearchQuestion": {"is_a": "Entity", "class_uri": "cile:ResearchQuestion", "slots": ["title"]},
    "CandidateRecord": {"is_a": "Entity", "class_uri": "cile:CandidateRecord", "slots": ["candidate_id", "title", "doi", "authors_text", "publication_year", "venue", "work_type", "review_stage", "candidate_status", "was_derived_from"]},
    "ScholarlyWork": {"is_a": "Entity", "class_uri": "cile:ScholarlyWork", "exact_mappings": ["slr:IncludedSource"], "related_mappings": ["fabio:Expression"], "slots": ["work_id", "title", "doi", "authors_text", "publication_year", "venue", "publisher", "work_type", "canonical_status", "has_identifier", "has_manifestation"]},
    "CriminalInfiltrationStudy": {"is_a": "ScholarlyWork", "class_uri": "cile:CriminalInfiltrationStudy", "slots": ["infiltration_relation"]},
    "Manifestation": {"is_a": "Entity", "class_uri": "cile:Manifestation", "related_mappings": ["fabio:Manifestation"], "slots": ["manifestation_id", "source_url", "access_status", "access_kind", "doi", "was_derived_from"]},
    "Identifier": {"is_a": "Entity", "class_uri": "cile:Identifier", "slots": ["identifier_scheme", "identifier_value", "identifier_relation"]},
    "SearchActivity": {"is_a": "Activity", "class_uri": "cile:SearchActivity", "slots": ["event_id", "source_name", "query_string", "retrieved_at"]},
    "RetrievalActivity": {"is_a": "Activity", "class_uri": "cile:RetrievalActivity", "slots": ["event_id", "source_name", "source_url"]},
    "ScreeningActivity": {"is_a": "Activity", "class_uri": "cile:ScreeningActivity", "slots": ["review_stage"]},
    "ScreeningDecision": {"is_a": "Entity", "class_uri": "cile:ScreeningDecision", "related_mappings": ["ripe:Answer"], "slots": ["decision_id", "screening_decision", "exclusion_reason", "confidence", "rationale", "evidence_locator", "is_current", "was_attributed_to", "generated_at_time"]},
    "Evidence": {"is_a": "Entity", "class_uri": "cile:Evidence", "related_mappings": ["ripe:Evidence"], "slots": ["evidence_type", "source_url", "was_derived_from"]},
    "EvidenceSpan": {"is_a": "Evidence", "class_uri": "oa:Annotation", "slots": ["evidence_locator"]},
    "AbstractCoverageAssessment": {"is_a": "Evidence", "class_uri": "cile:AbstractCoverageAssessment", "slots": ["abstract_status", "source_url"]},
    "AccessAssessment": {"is_a": "Evidence", "class_uri": "cile:AccessAssessment", "slots": ["access_status", "access_kind", "access_url", "generated_at_time"]},
    "CodingAssertion": {"is_a": "Entity", "class_uri": "cile:CodingAssertion", "slots": ["topic_code", "evidence_locator", "confidence", "is_current", "supersedes"]},
    "PublicationState": {"is_a": "Entity", "class_uri": "cile:PublicationState", "slots": ["version", "is_current", "supersedes"]},
    "SecondaryCollection": {"is_a": "Entity", "class_uri": "skos:ConceptScheme", "slots": ["secondary_collection_code", "title"]},
    "WorkRelation": {"is_a": "Entity", "class_uri": "cile:WorkRelation", "slots": ["relation_type", "rationale", "evidence_locator"]},
    "ReviewEvent": {"is_a": "Activity", "class_uri": "slr:ReviewEvent", "slots": ["event_id", "screening_decision", "rationale", "evidence_locator", "was_attributed_to", "generated_at_time"]},
    "ModelInvocation": {"is_a": "Activity", "class_uri": "slr:ModelInvocation", "slots": ["source_name", "generated_at_time"]}
  }
}
