name: Candidate literature intake
description: Stage scholarly candidates for human metadata and eligibility review
title: "[INTAKE][ACADEMIC] "
body:
  - type: markdown
    attributes:
      value: |
        Intake is not an eligibility or publication decision. Do not assign canonical paper IDs or paste full text.
  - type: input
    id: batch_id
    attributes:
      label: Batch ID
      placeholder: ACADEMIC-YYYY-MM-DD
    validations:
      required: true
  - type: textarea
    id: search_log
    attributes:
      label: Search and provenance log
      description: Sources/connectors, exact queries, dates, counts, repository ref and failures.
    validations:
      required: true
  - type: textarea
    id: candidates
    attributes:
      label: Candidate records
      description: One JSON manifest with schema_version 1, the exact batch_id and a candidates array. Each candidate needs a batch-scoped candidate_id, title, authors, year, venue, work_type, identifiers (doi and other), source_links, sources, query_ids, verification_status, possible_duplicate, metadata_conflict, intake_assessment, relevance_reason and required_human_action.
      placeholder: '{"schema_version":1,"batch_id":"ACADEMIC-YYYY-MM-DD","candidates":[]}'
      render: json
    validations:
      required: true
  - type: checkboxes
    id: safeguards
    attributes:
      label: Safeguards
      options:
        - label: No candidate was marked eligible or published.
          required: true
        - label: Canonical records and existing intake issues were checked for duplicates.
          required: true
        - label: No copyrighted full text or long abstract is included.
          required: true
