name: Validate enrichment job priority correction
on:
  push:
    branches: [maintenance/enrichment-executable-priority]
    paths: [.github/workflows/patch-enrichment-priority.yml]
permissions:
  contents: write
jobs:
  patch:
    if: github.ref == 'refs/heads/maintenance/enrichment-executable-priority'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout isolated source branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Node for source regression tests
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
      - name: Apply the one reviewed source-line replacement
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('curator-app/src/paper-enrichment.js')
          raw=p.read_bytes()
          blob=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          if blob!='5dccfa6b8f2b8684fe2fd4446f68492bf9da2058': raise SystemExit('Source changed: inspect before patching')
          source=raw.decode()
          before='ORDER BY j.due_at,j.target_id,CASE j.kind'
          after="ORDER BY CASE WHEN json_extract(t.record_json,'$.doi')<>'' THEN 0 ELSE 1 END,j.due_at,j.target_id,CASE j.kind"
          if source.count(before)!=1: raise SystemExit('Unexpected selection statement')
          p.write_text(source.replace(before,after))
          PY
      - name: Run complete source regression checks
        run: |
          python3 scripts/validation/validate_repository.py
          python3 scripts/ontology/validate_ontology.py
          python3 -m unittest discover -s tests -p 'test_*.py'
          node --test curator-app/test/*.test.js
          python3 scripts/build_archive.py
          python3 scripts/build_secondary_collections.py
          python3 scripts/curation/build_curator_stats.py
          python3 scripts/curation/build_curator_options.py
          python3 scripts/validation/validate_archive.py
          python3 scripts/validation/validate_site.py
      - name: Commit only the validated source correction to the isolated branch
        run: |
          git add curator-app/src/paper-enrichment.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Prioritise due DOI-bearing work while preserving unresolved candidates'
          git push origin HEAD:maintenance/enrichment-executable-priority
