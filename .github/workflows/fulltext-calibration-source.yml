          probe={'protocol':'CILE-FULLTEXT-DEV-CHUNK-1','candidate_id':'CAND-ACADEMIC-2026-09-08-EXTRA-a6caf5d7567b-002','extractor_fingerprint':'0'*64,'request_sha256':'0'*64,'chunk_id':'chunk-9999'}
