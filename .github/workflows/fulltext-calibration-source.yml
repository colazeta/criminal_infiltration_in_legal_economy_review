name: Full-text calibration development

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/fulltext-calibration-source.yml
      - config/fulltext-calibration-recipient.json
      - scripts/calibration/full_text_source_case.py
      - scripts/calibration/full_text_development.py
      - scripts/calibration/full_text_development_run.py
      - scripts/calibration/full_text_development_resume.py
      - scripts/enrichment/service_client.py
      - curator-app/src/calibration-development-checkpoint.js
      - curator-app/src/enrichment-store.js
      - tests/test_full_text_source_case.py
      - tests/test_full_text_development.py
      - tests/test_full_text_development_run.py
      - tests/test_full_text_development_resume.py
      - curator-app/test/calibration-development-checkpoint.test.js

permissions:
  contents: read

concurrency:
  group: fulltext-calibration-development
  cancel-in-progress: false

jobs:
  source-only:
    if: github.repository == 'colazeta/criminal_infiltration_in_legal_economy_review' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout reviewed code without retained credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Node for recipient encryption
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
      - name: Install bounded PDF text dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
          command -v pdftotext >/dev/null
          pdftotext -v 2>&1 | head -n 1
      - name: Validate bounded source-capture contracts
        run: |
          python3 scripts/validation/validate_repository.py
          python3 -m unittest tests.test_full_text_source_case tests.test_full_text_development tests.test_full_text_development_run tests.test_full_text_development_resume
          python3 -m unittest discover -s tests -p 'test_extraordinary_runs.py'
          node --test curator-app/test/sealed-audit.test.js curator-app/test/calibration-development-checkpoint.test.js
          command -v pdftotext >/dev/null
      - name: Capture existing candidate full text into source-only ciphertext
        run: |
          python3 -m scripts.calibration.full_text_source_case \
            --candidate-id CAND-ACADEMIC-2026-09-08-EXTRA-a6caf5d7567b-002 \
            --url https://docs.iza.org/dp13028.pdf \
            --retention-basis 'Owner-authorised private research analysis of an anonymously downloadable IZA Discussion Paper; no redistribution; source copyright remains with the rights holder.' \
            --licence-status 'IZA copyright; publicly downloadable discussion paper; no redistribution' \
            --output "$RUNNER_TEMP/fulltext-source.sealed.json"
      - name: Retain only recipient-encrypted source checkpoint
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fulltext-calibration-source-cand-002
          path: ${{ runner.temp }}/fulltext-source.sealed.json
          if-no-files-found: ignore
          retention-days: 1
      - name: Remove scratch material even after failure
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/fulltext-source.sealed.json"

  development:
    if: github.repository == 'colazeta/criminal_infiltration_in_legal_economy_review' && github.ref == 'refs/heads/main'
    needs: source-only
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Checkout the same reviewed code without retained credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Node for native validation and checkpoint encryption
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
      - name: Set up Python for isolated local inference
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install bounded PDF text dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
          command -v pdftotext >/dev/null
      - name: Revalidate full-text development contracts
        run: |
          python3 scripts/validation/validate_repository.py
          python3 scripts/ontology/validate_ontology.py
          python3 -m unittest tests.test_full_text_source_case tests.test_full_text_development tests.test_full_text_development_run tests.test_full_text_development_resume
          node --test curator-app/test/sealed-audit.test.js curator-app/test/calibration-development-checkpoint.test.js
      - name: Wait for exact private checkpoint service deployment
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os,time
          from scripts.enrichment.service_client import current_commit
          expected=os.environ['EXPECTED_COMMIT']
          last=None
          for attempt in range(1,37):
              try:
                  last=current_commit()
                  if last==expected:
                      print(f'Exact private service commit verified on attempt {attempt}.')
                      break
              except Exception as error:
                  last=type(error).__name__
              if attempt==36: raise SystemExit(f'exact_private_checkpoint_service_not_deployed:{last}')
              time.sleep(10)
          PY
      - name: Run one exact-source full-text development case with private chunk resume
        env:
          CURATOR_SESSION_SECRET: ${{ secrets.CURATOR_SESSION_SECRET }}
        run: |
          python3 -m scripts.calibration.full_text_development_resume \
            --candidate-id CAND-ACADEMIC-2026-09-08-EXTRA-a6caf5d7567b-002 \
            --url https://docs.iza.org/dp13028.pdf \
            --expected-pdf-sha256 2e69ba5344af0c85cbe9d3a14e6e3dcc1c9ba907934cbc7937e2674c6efc42b2 \
            --expected-text-sha256 d79a8f1caa0621af4916eed119cb39db1af5819f903efe22726e1432105d5924 \
            --output "$RUNNER_TEMP/fulltext-development.sealed.json"
      - name: Retain only recipient-encrypted model checkpoint
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fulltext-calibration-development-cand-002
          path: ${{ runner.temp }}/fulltext-development.sealed.json
          if-no-files-found: ignore
          retention-days: 1
      - name: Remove encrypted scratch after artifact handling
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/fulltext-development.sealed.json"