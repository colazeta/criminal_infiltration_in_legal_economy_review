          sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Resolve authenticated private checkpoint deployment
        env:
          CURATOR_SESSION_SECRET: ${{ secrets.CURATOR_SESSION_SECRET }}
        run: |
          python3 - <<'PY'
