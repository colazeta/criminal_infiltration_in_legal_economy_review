        run: rm -f "$RUNNER_TEMP/fulltext-development.sealed.json" "$RUNNER_TEMP/fulltext-pass-status.txt"

  development-5:
    if: github.repository == 'colazeta/criminal_infiltration_in_legal_economy_review' && github.ref == 'refs/heads/main' && needs.development-4.result == 'success' && needs.development-4.outputs.complete != 'true'
    needs: development-4
    runs-on: ubuntu-24.04
    environment: curator-production
    timeout-minutes: 70
    outputs:
      complete: ${{ steps.run-development.outputs.complete }}
    steps:
