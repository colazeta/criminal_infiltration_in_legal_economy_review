          probe={'protocol':'CILE-FULLTEXT-DEV-CHUNK-1','candidate_id':'CAND-ACADEMIC-2026-09-08-EXTRA-a6caf5d7567b-002','extractor_fingerprint':'0'*64,'request_sha256':'0'*64,'chunk_id':'chunk-9999'}
          deployed=current_commit(); result=call('development-checkpoint-get',expected_commit=deployed,checkpoint=probe)
          if result.get('status') not in {'missing','found'}: raise SystemExit('compatible_private_checkpoint_service_unavailable')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as handle: handle.write('CALIBRATION_CHECKPOINT_SERVICE_COMMIT='+deployed+'\n')
          PY
      - name: Run bounded exact-source development pass 4
        id: run-development
        env:
          CURATOR_SESSION_SECRET: ${{ secrets.CURATOR_SESSION_SECRET }}
          FULLTEXT_MAX_NEW_CHUNKS: '3'
          FULLTEXT_REQUIRE_COMPLETE: '0'
          FULLTEXT_PASS_STATUS_FILE: ${{ runner.temp }}/fulltext-pass-status.txt
        run: |
          rm -f "$FULLTEXT_PASS_STATUS_FILE"
          python3 -m scripts.calibration.full_text_development_resume --candidate-id CAND-ACADEMIC-2026-09-08-EXTRA-a6caf5d7567b-002 --url https://docs.iza.org/dp13028.pdf --expected-pdf-sha256 2e69ba5344af0c85cbe9d3a14e6e3dcc1c9ba907934cbc7937e2674c6efc42b2 --expected-text-sha256 d79a8f1caa0621af4916eed119cb39db1af5819f903efe22726e1432105d5924 --output "$RUNNER_TEMP/fulltext-development.sealed.json"
          status="$(tr -d '\r\n' < "$FULLTEXT_PASS_STATUS_FILE")"
          case "$status" in complete) echo 'complete=true' >> "$GITHUB_OUTPUT" ;; partial) echo 'complete=false' >> "$GITHUB_OUTPUT" ;; *) exit 1 ;; esac
