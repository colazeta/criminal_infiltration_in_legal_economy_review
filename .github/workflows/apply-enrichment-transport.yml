name: Apply tested enrichment transport correction
on:
  push:
    branches: [fix/enrichment-live-readback]
    paths: [.github/workflows/apply-enrichment-transport.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
      - name: Apply integrity-checked source correction
        run: |
          python3 - <<'PY'
          import base64,lzma,hashlib,subprocess,os
          from pathlib import Path
          encoded=''
          patch=lzma.decompress(base64.b64decode(encoded,validate=True))
          if hashlib.sha256(patch).hexdigest()!='c162b1260ca034f45c371fad8c32bff5bd567df307ca27aad9b5b80f87896a36': raise SystemExit('Integrity failure')
          p=Path(os.environ['RUNNER_TEMP'])/'transport.patch';p.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(p)],check=True)
          subprocess.run(['git','apply',str(p)],check=True)
          PY
      - name: Validate regression suite
        run: |
          python3 scripts/validation/validate_repository.py
          python3 scripts/ontology/validate_ontology.py
          python3 -m unittest discover -s tests -p 'test_*.py'
          node --test curator-app/test/*.test.js
      - name: Commit only the two validated source files
        run: |
          git add curator-app/src/paper-enrichment.js curator-app/test/paper-enrichment.test.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refuse provider redirects explicitly in the native edge runtime'
          git push origin HEAD:fix/enrichment-live-readback
