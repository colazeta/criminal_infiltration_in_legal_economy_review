name: Temporary batch 13 deterministic projection refresh

on:
  push:
    branches:
      - maintenance/parallel-search-reading-batch-13-reconciled

permissions:
  contents: write

concurrency:
  group: temporary-batch13-projection-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout successor branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Regenerate deterministic committed projections
        shell: bash
        run: |
          expected="$RUNNER_TEMP/archive"
          rm -rf "$expected"
          mkdir -p "$expected"
          python scripts/build_archive.py --output-dir "$expected"
          python scripts/build_secondary_collections.py --output-dir "$expected"
          python scripts/metrics/build_research_stats.py --output "$expected/research-stats.json"
          python scripts/curation/build_curator_stats.py --output "$expected/curator-stats.json"
          python scripts/curation/build_curator_options.py --output "$expected/curator-options.json"
          rsync -a --delete "$expected/" site/data/

      - name: Run full mandatory validation
        shell: bash
        run: |
          python3 scripts/validation/validate_repository.py
          python3 scripts/ontology/validate_ontology.py
          python3 scripts/ontology/build_model_browser.py
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 scripts/build_archive.py
          python3 scripts/build_secondary_collections.py
          python3 scripts/curation/build_curator_stats.py
          python3 scripts/curation/build_curator_options.py
          python3 scripts/validation/validate_archive.py
          python3 scripts/validation/validate_site.py
          node --check site/app.js
          node --check site/aml.js
          node --check site/stats.js
          node --check site/curator.js
          node --check site/curator-config.js
          node --check site/curator-guided.js
          node --check site/model.js
          node --check site/review-v2.js
          node --check curator-app/src/index.js
          node --check curator-app/src/worker.js
          node --test curator-app/test/*.test.js
          python3 scripts/report_saturation.py

      - name: Verify exact deterministic export
        shell: bash
        run: |
          verify="$RUNNER_TEMP/archive-verify"
          rm -rf "$verify"
          mkdir -p "$verify"
          python scripts/build_archive.py --output-dir "$verify"
          python scripts/build_secondary_collections.py --output-dir "$verify"
          python scripts/metrics/build_research_stats.py --output "$verify/research-stats.json"
          python scripts/curation/build_curator_stats.py --output "$verify/curator-stats.json"
          python scripts/curation/build_curator_options.py --output "$verify/curator-options.json"
          diff -ru "$verify" site/data

      - name: Persist deterministic projections and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-batch13-projection-refresh.yml
          git add site/data
          git commit -m "Refresh deterministic archive projections"
          git push origin HEAD:${GITHUB_REF_NAME}
