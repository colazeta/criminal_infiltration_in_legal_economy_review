name: Jev stage-1 shadow benchmark

on:
  pull_request:
    paths:
      - "config/jev-validation.json"
      - "config/jev-stage1-benchmark.json"
      - "curator-app/src/jev-*.js"
      - "curator-app/test/jev-*.test.js"
      - "scripts/jev/**"
      - ".github/workflows/jev-stage1-benchmark.yml"
  push:
    branches: [main]
    paths:
      - "config/jev-validation.json"
      - "config/jev-stage1-benchmark.json"
      - "curator-app/src/jev-*.js"
      - "curator-app/test/jev-*.test.js"
      - "scripts/jev/**"
      - ".github/workflows/jev-stage1-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jev-stage1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
      - name: Validate repository and Jev harness without provider calls
        run: |
          python3 scripts/validation/validate_repository.py
          python3 scripts/ontology/validate_ontology.py
          python3 scripts/ontology/build_model_browser.py
          git diff --exit-code -- site/vocab/review-v2-model.json
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 scripts/build_archive.py
          python3 scripts/build_secondary_collections.py
          python3 scripts/curation/build_curator_stats.py
          python3 scripts/curation/build_curator_options.py
          python3 scripts/validation/validate_archive.py
          python3 scripts/validation/validate_site.py
          node --check site/app.js
          node --check site/aml.js
          node --check site/stats.js
          node --check site/curator.js
          node --check site/curator-config.js
          node --check site/curator-guided.js
          node --check site/model.js
          node --check site/review-v2.js
          node --check curator-app/src/index.js
          node --check curator-app/src/worker.js
          node --test curator-app/test/*.test.js
          python3 scripts/report_saturation.py
          node --check curator-app/src/jev-client.js
          node --check curator-app/src/jev-policy.js
          node --check curator-app/src/jev-question-sets.js
          node --check scripts/jev/run-shadow.mjs
          node --check scripts/jev/run-stage1-benchmark.mjs
          node --test curator-app/test/jev-client.test.js curator-app/test/jev-policy.test.js
          node scripts/jev/run-stage1-benchmark.mjs --dry-run --output "$RUNNER_TEMP/jev-stage1-dry-run.json"

  live-shadow:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
      - name: Require configured TypeSafe secret
        shell: bash
        run: |
          if [ -z "$TYPESAFE_API_KEY" ]; then
            echo "::error::TYPESAFE_API_KEY is not configured"
            exit 1
          fi
      - name: Run non-authoritative Jev shadow benchmark
        run: node scripts/jev/run-stage1-benchmark.mjs --output "$RUNNER_TEMP/jev-stage1-benchmark.json"
      - name: Retain shadow judgments
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jev-stage1-shadow-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/jev-stage1-benchmark.json
          if-no-files-found: error
          retention-days: 14
