name: Deploy curator Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "curator-app/**"
      - "site/curate.html"
      - "site/curator.js"
      - "site/curator-config.js"
      - "site/curator-reading.js"
      - "site/curator-reading.css"
      - "site/curator-queue.js"
      - "site/curator-queue.css"
      - "site/curator-resolved-link.js"
      - "site/styles.css"
      - "site/data/curator-options.json"
      - "site/data/curator-stats.json"
      - "site/data/research-stats.json"
      - ".github/workflows/deploy-curator-worker.yml"

permissions:
  contents: read

concurrency:
  group: curator-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    environment: curator-production
    defaults:
      run:
        working-directory: curator-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Prepare production configuration
        env:
          CURATOR_CLIENT_ID: ${{ secrets.CURATOR_CLIENT_ID }}
          CURATOR_WORKER_HOST: criminal-infiltration-curator.colazeta-research.workers.dev
          SERPER_DEDICATED_FREE_ACCOUNT: ${{ vars.SERPER_DEDICATED_FREE_ACCOUNT }}
          EXA_DEDICATED_STARTER_ACCOUNT: ${{ vars.EXA_DEDICATED_STARTER_ACCOUNT }}
        run: |
          if [ -z "$CURATOR_CLIENT_ID" ]; then
            echo "::error::Missing environment secret CURATOR_CLIENT_ID"
            exit 1
          fi
          python - <<'PY'
          import os
          from pathlib import Path

          source = Path("wrangler.example.jsonc").read_text()
          source = source.replace("REPLACE_WITH_WORKER_HOST", os.environ["CURATOR_WORKER_HOST"])
          source = source.replace("REPLACE_AFTER_GITHUB_APP_REGISTRATION", os.environ["CURATOR_CLIENT_ID"])
          serper_confirmed = "true" if os.environ.get("SERPER_DEDICATED_FREE_ACCOUNT", "").lower() == "true" else "false"
          exa_confirmed = "true" if os.environ.get("EXA_DEDICATED_STARTER_ACCOUNT", "").lower() == "true" else "false"
          source = source.replace("REPLACE_SERPER_DEDICATED_FREE_ACCOUNT", serper_confirmed)
          source = source.replace("REPLACE_EXA_DEDICATED_STARTER_ACCOUNT", exa_confirmed)
          Path("wrangler.generated.jsonc").write_text(source)
          PY

      - name: Deploy Worker and public assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.128.0 deploy --config wrangler.generated.jsonc

      - name: Configure Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CURATOR_CLIENT_SECRET: ${{ secrets.CURATOR_CLIENT_SECRET }}
          CURATOR_SESSION_SECRET: ${{ secrets.CURATOR_SESSION_SECRET }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          CORE_API_KEY: ${{ secrets.CORE_API_KEY }}
          UNPAYWALL_EMAIL: ${{ secrets.UNPAYWALL_EMAIL }}
          SERPER_DEDICATED_FREE_ACCOUNT: ${{ vars.SERPER_DEDICATED_FREE_ACCOUNT }}
          EXA_DEDICATED_STARTER_ACCOUNT: ${{ vars.EXA_DEDICATED_STARTER_ACCOUNT }}
        run: |
          if [ -z "$CURATOR_CLIENT_SECRET" ]; then
            echo "::error::Missing environment secret CURATOR_CLIENT_SECRET"
            exit 1
          fi
          if [ -z "$CURATOR_SESSION_SECRET" ]; then
            echo "::error::Missing environment secret CURATOR_SESSION_SECRET"
            exit 1
          fi
          printf '%s' "$CURATOR_CLIENT_SECRET" | npx --yes wrangler@4.128.0 secret put GITHUB_CLIENT_SECRET --config wrangler.generated.jsonc
          printf '%s' "$CURATOR_SESSION_SECRET" | npx --yes wrangler@4.128.0 secret put SESSION_SECRET --config wrangler.generated.jsonc

          if [ -n "$SERPER_API_KEY" ]; then
            printf '%s' "$SERPER_API_KEY" | npx --yes wrangler@4.128.0 secret put SERPER_API_KEY --config wrangler.generated.jsonc
            if [ "${SERPER_DEDICATED_FREE_ACCOUNT,,}" = "true" ]; then
              echo "Serper discovery enabled under the persistent 1,000-request project cap and dedicated-free-account guard." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "SERPER_API_KEY is present but the dedicated free account variable is not true: Serper remains guarded and cannot run." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "SERPER_API_KEY not configured: Serper discovery remains disabled." >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -n "$EXA_API_KEY" ]; then
            printf '%s' "$EXA_API_KEY" | npx --yes wrangler@4.128.0 secret put EXA_API_KEY --config wrangler.generated.jsonc
            if [ "${EXA_DEDICATED_STARTER_ACCOUNT,,}" = "true" ]; then
              echo "Exa Search enabled under the persistent 500-request Search-only project cap and dedicated Starter Free guard." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "EXA_API_KEY is present but the dedicated Starter account variable is not true: Exa remains guarded and cannot run." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "EXA_API_KEY not configured: Exa Search remains disabled." >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -n "$TAVILY_API_KEY" ]; then
            printf '%s' "$TAVILY_API_KEY" | npx --yes wrangler@4.128.0 secret put TAVILY_API_KEY --config wrangler.generated.jsonc
            echo "Tavily Basic free-tier fallback enabled; runtime hard guard is TAVILY_FREE_ONLY=true." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "TAVILY_API_KEY not configured: Tavily cannot consume credits." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$SEMANTIC_SCHOLAR_API_KEY" ]; then
            printf '%s' "$SEMANTIC_SCHOLAR_API_KEY" | npx --yes wrangler@4.128.0 secret put SEMANTIC_SCHOLAR_API_KEY --config wrangler.generated.jsonc
            echo "Semantic Scholar free API key enabled." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Semantic Scholar runs through its public unauthenticated endpoints." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$CORE_API_KEY" ]; then
            printf '%s' "$CORE_API_KEY" | npx --yes wrangler@4.128.0 secret put CORE_API_KEY --config wrangler.generated.jsonc
            echo "CORE free API key enabled for a higher free rate limit." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "CORE runs keyless at the public free rate limit." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$UNPAYWALL_EMAIL" ]; then
            printf '%s' "$UNPAYWALL_EMAIL" | npx --yes wrangler@4.128.0 secret put UNPAYWALL_EMAIL --config wrangler.generated.jsonc
            echo "Unpaywall free API enabled." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "UNPAYWALL_EMAIL not configured: Unpaywall is skipped without affecting the other free providers." >> "$GITHUB_STEP_SUMMARY"
          fi
          rm -f wrangler.generated.jsonc

      - name: Verify production health
        env:
          CURATOR_ORIGIN: https://criminal-infiltration-curator.colazeta-research.workers.dev
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          origin = os.environ["CURATOR_ORIGIN"].rstrip("/")
          headers = {"User-Agent": "curator-production-smoke-test"}

          def retry_json(url, expected, label, attempts=6, delay=5):
              last_error = None
              for attempt in range(1, attempts + 1):
                  try:
                      request = urllib.request.Request(url, headers={**headers, "Accept": "application/json"})
                      with urllib.request.urlopen(request, timeout=15) as response:
                          payload = json.load(response)
                          if response.status == 200 and payload == expected:
                              print(f"{label} verified on attempt {attempt}.")
                              return
                          last_error = f"HTTP {response.status}: {payload!r}"
                  except (urllib.error.URLError, urllib.error.HTTPError, TimeoutError, ValueError) as error:
                      last_error = str(error)
                  if attempt < attempts:
                      time.sleep(delay)
              raise SystemExit(f"{label} failed after {attempts} attempts: {last_error}")

          def retry_asset(path, required_markers, label, attempts=6, delay=3):
              url = f"{origin}/{path.lstrip('/')}"
              last_error = None
              for attempt in range(1, attempts + 1):
                  try:
                      request = urllib.request.Request(url, headers=headers)
                      with urllib.request.urlopen(request, timeout=15) as response:
                          source = response.read().decode("utf-8")
                          missing = [marker for marker in required_markers if marker not in source]
                          if response.status == 200 and not missing:
                              print(f"{label} verified on attempt {attempt}.")
                              return
                          last_error = f"HTTP {response.status}; missing markers: {missing}"
                  except (urllib.error.URLError, urllib.error.HTTPError, TimeoutError, UnicodeDecodeError) as error:
                      last_error = str(error)
                  if attempt < attempts:
                      time.sleep(delay)
              raise SystemExit(f"{label} failed after {attempts} attempts: {last_error}")

          def retry_unauthenticated_401(url, label, attempts=6, delay=3):
              last_error = None
              for attempt in range(1, attempts + 1):
                  request = urllib.request.Request(url, headers={**headers, "Accept": "application/json"})
                  try:
                      with urllib.request.urlopen(request, timeout=15) as response:
                          last_error = f"unexpected HTTP {response.status}"
                  except urllib.error.HTTPError as error:
                      if error.code == 401:
                          print(f"{label} authentication boundary verified on attempt {attempt}.")
                          return
                      last_error = f"HTTP {error.code}"
                  except (urllib.error.URLError, TimeoutError) as error:
                      last_error = str(error)
                  if attempt < attempts:
                      time.sleep(delay)
              raise SystemExit(f"{label} failed after {attempts} attempts: {last_error}")

          retry_json(f"{origin}/health", {"status": "ok"}, "Curator production health")
          retry_asset(
              "curator-reading.js",
              ["candidate-abstract-panel", "/api/resolved-abstract", "/api/free-web-search", "CORE", "Jina Reader", "Tavily Basic"],
              "Curator reading surface",
          )
          retry_asset(
              "curator-queue.js",
              ["candidate-queue-pager", "MAX_ENRICHMENT_CONCURRENCY", "/api/resolved-abstract"],
              "Curator queue enhancement",
          )
          retry_asset(
              "curator-resolved-link.js",
              ["/api/retrieval", "resolvedUrl", "Apri full text"],
              "Curator persisted retrieval link",
          )

          enrichment_query = urllib.parse.urlencode({"title": "Authentication smoke test"})
          retry_unauthenticated_401(f"{origin}/api/enrichment?{enrichment_query}", "Curator enrichment endpoint")
          retrieval_query = urllib.parse.urlencode({"candidate": "CAND-SMOKE-001", "issue": "1"})
          retry_unauthenticated_401(f"{origin}/api/retrieval?{retrieval_query}", "Curator retrieval endpoint")
          resolved_abstract_query = urllib.parse.urlencode({"candidate": "CAND-SMOKE-001", "issue": "1", "title": "Authentication smoke test"})
          retry_unauthenticated_401(f"{origin}/api/resolved-abstract?{resolved_abstract_query}", "Curator resolved abstract endpoint")
          free_web_query = urllib.parse.urlencode({"candidate": "CAND-SMOKE-001", "issue": "1", "title": "Authentication smoke test"})
          retry_unauthenticated_401(f"{origin}/api/free-web-search?{free_web_query}", "Curator free web-search endpoint")
          PY
