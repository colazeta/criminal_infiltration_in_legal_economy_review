name: Deploy curator Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "curator-app/**"
      - "site/curate.html"
      - "site/curator.js"
      - "site/curator-config.js"
      - "site/curator-reading.js"
      - "site/curator-reading.css"
      - "site/curator-queue.js"
      - "site/curator-queue.css"
      - "site/styles.css"
      - "site/data/curator-options.json"
      - "site/data/curator-stats.json"
      - "site/data/research-stats.json"
      - ".github/workflows/deploy-curator-worker.yml"

permissions:
  contents: read

concurrency:
  group: curator-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    environment: curator-production
    defaults:
      run:
        working-directory: curator-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Prepare production configuration
        env:
          CURATOR_CLIENT_ID: ${{ secrets.CURATOR_CLIENT_ID }}
          CURATOR_WORKER_HOST: criminal-infiltration-curator.colazeta-research.workers.dev
        run: |
          if [ -z "$CURATOR_CLIENT_ID" ]; then
            echo "::error::Missing environment secret CURATOR_CLIENT_ID"
            exit 1
          fi
          python - <<'PY'
          import os
          from pathlib import Path

          source = Path("wrangler.example.jsonc").read_text()
          source = source.replace("REPLACE_WITH_WORKER_HOST", os.environ["CURATOR_WORKER_HOST"])
          source = source.replace("REPLACE_AFTER_GITHUB_APP_REGISTRATION", os.environ["CURATOR_CLIENT_ID"])
          Path("wrangler.generated.jsonc").write_text(source)
          PY

      - name: Deploy Worker and public assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.128.0 deploy --config wrangler.generated.jsonc

      - name: Configure Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CURATOR_CLIENT_SECRET: ${{ secrets.CURATOR_CLIENT_SECRET }}
          CURATOR_SESSION_SECRET: ${{ secrets.CURATOR_SESSION_SECRET }}
        run: |
          if [ -z "$CURATOR_CLIENT_SECRET" ]; then
            echo "::error::Missing environment secret CURATOR_CLIENT_SECRET"
            exit 1
          fi
          if [ -z "$CURATOR_SESSION_SECRET" ]; then
            echo "::error::Missing environment secret CURATOR_SESSION_SECRET"
            exit 1
          fi
          printf '%s' "$CURATOR_CLIENT_SECRET" | npx --yes wrangler@4.128.0 secret put GITHUB_CLIENT_SECRET --config wrangler.generated.jsonc
          printf '%s' "$CURATOR_SESSION_SECRET" | npx --yes wrangler@4.128.0 secret put SESSION_SECRET --config wrangler.generated.jsonc
          rm -f wrangler.generated.jsonc

      - name: Verify production health
        env:
          CURATOR_ORIGIN: https://criminal-infiltration-curator.colazeta-research.workers.dev
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          origin = os.environ["CURATOR_ORIGIN"].rstrip("/")
          health_url = f"{origin}/health"
          last_error = None
          for attempt in range(1, 7):
              try:
                  request = urllib.request.Request(
                      health_url,
                      headers={"Accept": "application/json", "User-Agent": "curator-production-smoke-test"},
                  )
                  with urllib.request.urlopen(request, timeout=15) as response:
                      payload = json.load(response)
                      if response.status == 200 and payload == {"status": "ok"}:
                          print(f"Curator production health verified on attempt {attempt}.")
                          break
                      last_error = f"HTTP {response.status}: {payload!r}"
              except (urllib.error.URLError, urllib.error.HTTPError, TimeoutError, ValueError) as error:
                  last_error = str(error)
              if attempt < 6:
                  time.sleep(5)
          else:
              raise SystemExit(f"Curator production health check failed: {last_error}")

          reading_request = urllib.request.Request(
              f"{origin}/curator-reading.js",
              headers={"User-Agent": "curator-production-smoke-test"},
          )
          with urllib.request.urlopen(reading_request, timeout=15) as response:
              source = response.read().decode("utf-8")
              if response.status != 200 or "candidate-abstract-panel" not in source:
                  raise SystemExit("Curator reading surface was not served correctly")

          queue_request = urllib.request.Request(
              f"{origin}/curator-queue.js",
              headers={"User-Agent": "curator-production-smoke-test"},
          )
          with urllib.request.urlopen(queue_request, timeout=15) as response:
              source = response.read().decode("utf-8")
              if response.status != 200 or "candidate-queue-pager" not in source or "MAX_ENRICHMENT_CONCURRENCY" not in source:
                  raise SystemExit("Curator queue enhancement was not served correctly")

          query = urllib.parse.urlencode({"title": "Authentication smoke test"})
          protected_request = urllib.request.Request(
              f"{origin}/api/enrichment?{query}",
              headers={"Accept": "application/json", "User-Agent": "curator-production-smoke-test"},
          )
          try:
              urllib.request.urlopen(protected_request, timeout=15)
          except urllib.error.HTTPError as error:
              if error.code != 401:
                  raise
          else:
              raise SystemExit("Curator enrichment endpoint must reject unauthenticated requests")
          PY
