name: Diagnose paper enrichment dependencies
on:
  push:
    branches: [implementation/public-research-sheets-597]
    paths: [.github/workflows/enrichment-diagnostics.yml]
permissions:
  contents: write
jobs:
  diagnose:
    if: github.repository == 'colazeta/criminal_infiltration_in_legal_economy_review' && github.ref == 'refs/heads/implementation/public-research-sheets-597'
    runs-on: ubuntu-latest
    environment: curator-production
    timeout-minutes: 15
    steps:
      - name: Checkout exact reviewed transfer branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: implementation/public-research-sheets-597
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
      - name: Verify, materialise and remove exact transfer payload
        env:
          EXPECTED_TRIGGER: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_TRIGGER"
          python3 - <<'PY'
          import base64, hashlib, lzma, os, subprocess
          from pathlib import Path
          base='ace6bfc71500c7b9a4583c797f9b895e154545cf'
          diagnostic='.github/workflows/enrichment-diagnostics.yml'
          chunks=[f'.cile-transfer/597-{i}.b64' for i in range(4)]
          actual=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          if actual != {diagnostic,*chunks}: raise SystemExit('Unexpected concurrent branch changes; no materialisation')
          encoded=''.join(Path(p).read_text().strip() for p in chunks)
          if len(encoded)!=35056: raise SystemExit('Transfer length mismatch')
          patch=lzma.decompress(base64.b64decode(encoded,validate=True),memlimit=256000000)
          if len(patch)!=105462 or hashlib.sha256(patch).hexdigest()!='d79a34a711c835fb0f8b9ebe1e6cff2663377da7318389d049ee4f66063a1372':
              raise SystemExit('Transfer checksum mismatch')
          path=Path(os.environ['RUNNER_TEMP'])/'research-597.patch';path.write_bytes(patch)
          subprocess.run(['git','checkout',base,'--',diagnostic],check=True)
          subprocess.run(['git','apply','--index','--check',str(path)],check=True)
          subprocess.run(['git','apply','--index',str(path)],check=True)
          subprocess.run(['git','rm',*chunks],check=True)
          allowed=set('''.github/workflows/deploy-curator-worker.yml
          .github/workflows/enrichment-diagnostics.yml
          .github/workflows/enrichment-observer.yml
          AGENTS.md
          CHANGELOG.md
          curator-app/src/enrichment-store.js
          curator-app/src/paper-enrichment.js
          curator-app/src/public-paper-research.js
          curator-app/src/worker.js
          curator-app/test/enrichment-store.test.js
          curator-app/test/public-paper-research.test.js
          curator-app/test/public-research-sheet.test.js
          curator-app/test/worker-serving.test.js
          docs/operations/paper-enrichment.md
          docs/operations/public-research-sheets.md
          ontology/modules/paper-enrichment.json
          ontology/modules/public-paper-research.json
          schema/public-paper-research.schema.json
          scripts/curation/verify_published_register.py
          scripts/enrichment/public_research_check.py
          scripts/enrichment/service_client.py
          scripts/ontology/validate_ontology.py
          site/index.html
          site/paper-register.js
          site/paper-sheet-research.js
          site/styles.css
          tests/test_public_research_check.py'''.splitlines()) | set(chunks)
          changed=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          if changed != allowed: raise SystemExit('Materialisation path allowlist mismatch')
          print('Exact locally tested patch verified; no private data or source retrieval.')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement public research sheets and six-class context (#597)'
          git fetch origin main
          git merge --no-edit origin/main
      - name: Validate complete materialised head before branch push
        run: |
          set -euo pipefail
          python3 scripts/retrieval/selected_paper_delivery.py --prepare --validate
          python3 scripts/retrieval/apply_verified_reading_locators.py --check
          node --check site/paper-sheet-research.js
          node --check curator-app/src/public-paper-research.js
          git diff --exit-code
          test -z "$(git status --porcelain)"
          test ! -e .cile-transfer
          test "$(git rev-parse HEAD:.github/workflows/enrichment-diagnostics.yml)" = b317bc1fbdea25b3f152352ae4fbde58085529a7
      - name: Persist only the validated review branch
        run: |
          set -euo pipefail
          git push origin HEAD:refs/heads/implementation/public-research-sheets-597
          git rev-parse HEAD
          git show --stat --oneline HEAD
      - name: Package tracked public source only
        run: git archive HEAD -o "$RUNNER_TEMP/enrichment-source.tar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: enrichment-diagnostic-source
          path: ${{ runner.temp }}/enrichment-source.tar
          retention-days: 1
