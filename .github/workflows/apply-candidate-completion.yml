name: Apply reviewed candidate completion repair
on:
  push:
    branches: [maintenance/single-candidate-writer-20260913]
    paths: [.github/workflows/apply-candidate-completion.yml]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: maintenance/single-candidate-writer-20260913
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
      - name: Integrate current main without overwriting concurrent work
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
          python scripts/maintenance/apply_candidate_completion.py
          python scripts/maintenance/finish_candidate_completion.py
          rm scripts/maintenance/apply_candidate_completion.py scripts/maintenance/finish_candidate_completion.py
          rm .github/workflows/candidate-audit-snapshot.yml .github/workflows/apply-candidate-completion.yml
      - name: Full validation and independent failure-path check
        run: |
          set -euo pipefail
          python scripts/build_archive.py
          python scripts/build_secondary_collections.py
          python scripts/metrics/build_research_stats.py
          python scripts/curation/build_curator_stats.py
          python scripts/curation/build_curator_options.py
          python scripts/curation/build_legacy_queue.py --check
          python scripts/validation/validate_intake_history.py --base origin/main
          python scripts/validation/validate_repository.py
          python scripts/ontology/validate_ontology.py
          python scripts/ontology/build_model_browser.py
          python -m unittest discover -s tests -p 'test_*.py'
          python scripts/validation/validate_archive.py
          python scripts/validation/validate_site.py
          for script in site/*.js curator-app/src/*.js scripts/abstracts/*.mjs scripts/expansion/*.mjs; do node --check "$script"; done
          node --test curator-app/test/*.test.js
          python scripts/report_saturation.py
          cp site/stats.html "$RUNNER_TEMP/stats-original.html"
          python scripts/metrics/mark_statistics_unavailable.py
          python scripts/validation/validate_site.py
          cp "$RUNNER_TEMP/stats-original.html" site/stats.html
          git diff --exit-code origin/main -- data/registry data/curation site ontology
      - name: Commit only the tested repair to the existing review branch
        run: |
          git add -A
          git commit -m 'Complete candidate preservation and verify served publication'
          git push origin HEAD:maintenance/single-candidate-writer-20260913
          git rev-parse HEAD > "$RUNNER_TEMP/completion-head.txt"
          git diff --stat origin/main HEAD > "$RUNNER_TEMP/completion-diff-stat.txt"
          git archive HEAD -o "$RUNNER_TEMP/completion-source.tar"
          echo 'The repair branch passed full checks. This does not claim main merge or served publication.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-completion-tested-source
          path: |
            ${{ runner.temp }}/completion-head.txt
            ${{ runner.temp }}/completion-diff-stat.txt
            ${{ runner.temp }}/completion-source.tar
          retention-days: 1
