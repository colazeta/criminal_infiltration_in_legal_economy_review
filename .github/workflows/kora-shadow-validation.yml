name: Kora shadow validation

on:
  pull_request:
    paths:
      - "integrations/kora/control-plane/**"
      - ".github/workflows/kora-shadow-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kora-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout pilot branch
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Kora CLI
        run: |
          npm install -g @kora-platform/cli
          node --version
          kora --help >/dev/null

      - name: Authenticate to Kora
        run: |
          echo "::notice::Approve the Kora device login shown below. The job will continue automatically after approval."
          kora auth login
          kora auth whoami

      - name: Inspect environment
        run: |
          kora status
          kora environment list --json

      - name: Run Kora source tests
        working-directory: integrations/kora/control-plane
        run: |
          kora test suite --workspace . --environment production --json | tee /tmp/kora-tests.json

      - name: Create immutable Kora release
        id: release
        working-directory: integrations/kora/control-plane
        run: |
          kora release create . --json | tee /tmp/kora-release.json
          node - <<'NODE'
          const fs = require('fs');
          const raw = JSON.parse(fs.readFileSync('/tmp/kora-release.json','utf8'));
          const candidates = [
            raw?.data?.release?.id,
            raw?.data?.release?.key,
            raw?.data?.id,
            raw?.release?.id,
            raw?.releaseId,
            raw?.id
          ].filter(Boolean);
          if (!candidates.length) {
            console.error('Could not extract release id from Kora response');
            process.exit(1);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `release_id=${candidates[0]}\n`);
          NODE

      - name: Validate release for production environment
        working-directory: integrations/kora/control-plane
        run: |
          kora release validate "${{ steps.release.outputs.release_id }}" --environment production --json | tee /tmp/kora-validation.json

      - name: Confirm no deployment was made
        run: |
          kora deployment list --environment production --json

      - name: Summary
        if: always()
        run: |
          {
            echo "## Kora shadow validation"
            echo
            echo "- Target environment: production"
            echo "- Deployment requested: no"
            echo "- Pilot mode: observe-only"
            echo "- Release id: ${{ steps.release.outputs.release_id }}"
          } >> "$GITHUB_STEP_SUMMARY"
