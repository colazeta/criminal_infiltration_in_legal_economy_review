name: Monitor daily surveillance heartbeat

on:
  schedule:
    - cron: "15 12 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: surveillance-heartbeat
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Check daily surveillance ledger heartbeat
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/metrics/monitor_surveillance_heartbeat.py \
            --repository "$GITHUB_REPOSITORY" \
            --ledger-issue 30
