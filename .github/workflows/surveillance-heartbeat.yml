name: Monitor daily surveillance heartbeat

on:
  schedule:
    - cron: "15 12 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: surveillance-heartbeat
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Check daily surveillance ledger heartbeat
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/metrics/monitor_surveillance_heartbeat.py \
            --repository "$GITHUB_REPOSITORY" \
            --ledger-issue 30
