name: Observe hour-40 enrichment
on:
  workflow_dispatch:
  schedule:
    - cron: '45 * * * *'
  workflow_run:
    workflows: [Deploy curator Worker]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: enrichment-readonly-observer
  cancel-in-progress: false
jobs:
  observe:
    if: >-
      github.repository == 'colazeta/criminal_infiltration_in_legal_economy_review' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    environment: curator-production
    timeout-minutes: 5
    steps:
      - name: Checkout public observer without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Inspect deployed private storage and real scheduling receipts
        env:
          CURATOR_SESSION_SECRET: ${{ secrets.CURATOR_SESSION_SECRET }}
        run: |
          python3 - <<'PY'
          import json, time
          from scripts.enrichment.service_client import current_commit
          from scripts.enrichment.deployment_check import check
          state = check(current_commit(), activate=False)
          print(json.dumps(state, indent=2))
          if not state.get('enabled'):
              raise SystemExit('enrichment_runtime_inactive')
          schedule = state['scheduling'].get('schedule')
          if not isinstance(schedule, dict):
              raise SystemExit('enrichment_schedule_missing')
          now = int(time.time() * 1000)
          if schedule['next_slot'] < now - 300000:
              raise SystemExit('enrichment_schedule_watermark_stalled')
          print('Observer only: no paper job, model inference, activation or scientific approval performed.')
          PY
