name: Apply Parallel Search fallback amendment

on:
  push:
    branches:
      - method/exa-parallel-search-fallback

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: method/exa-parallel-search-fallback
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Apply governed amendment
        run: python3 scripts/maintenance/apply_parallel_fallback_amendment.py
      - name: Commit amendment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Authorize Parallel Search fallback for Exa limits"
          git push origin HEAD:method/exa-parallel-search-fallback
