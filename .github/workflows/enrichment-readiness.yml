name: Check paper enrichment readiness
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-storage:
    runs-on: ubuntu-latest
    environment: curator-production
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Prepare private storage independently of discovery
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/review_v2/prepare_cloudflare.py --storage-only --output "$RUNNER_TEMP/enrichment-bindings.json"
      - name: Check bounded public-provider access without retaining source text
        run: python3 scripts/enrichment/provider_smoke.py
      - name: Record activation boundary
        run: echo "Storage preparation passed. This check does not enable hourly work or scientific extraction. Inspect provider outcomes and the separate calibration gate." >> "$GITHUB_STEP_SUMMARY"
