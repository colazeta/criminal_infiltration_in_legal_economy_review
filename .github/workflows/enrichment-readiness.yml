name: Check paper enrichment readiness
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-storage:
    runs-on: ubuntu-latest
    environment: curator-production
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify exact deployed private storage
        env:
          CURATOR_SESSION_SECRET: ${{ secrets.CURATOR_SESSION_SECRET }}
        run: |
          python3 scripts/enrichment/service_client.py verify
          python3 scripts/enrichment/service_client.py status
      - name: Check bounded public-provider access without retaining source text
        run: python3 scripts/enrichment/provider_smoke.py
      - name: Record activation boundary
        run: |
          echo "Readiness check only: it does not approve scientific labels or activate a model. Provider outcomes, persisted work and scientific calibration remain distinct." >> "$GITHUB_STEP_SUMMARY"
