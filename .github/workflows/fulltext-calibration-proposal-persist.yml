name: Persist full-text calibration proposal

on:
  pull_request:
    paths:
      - .github/workflows/fulltext-calibration-proposal-persist.yml
      - scripts/calibration/full_text_proposal_persist.py
      - tests/test_full_text_proposal_persist.py
  push:
    branches: [main]
    paths:
      - .github/workflows/fulltext-calibration-proposal-persist.yml
      - scripts/calibration/full_text_proposal_persist.py
      - tests/test_full_text_proposal_persist.py

permissions:
  contents: read

concurrency:
  group: fulltext-calibration-proposal-persist
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout reviewed code without retained credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Validate persistence bridge and governing contracts
        run: |
          python3 scripts/validation/validate_repository.py
          python3 scripts/ontology/validate_ontology.py
          python3 -m unittest \
            tests.test_full_text_proposal_persist \
            tests.test_full_text_relation_phase_v5 \
            tests.test_full_text_development_resume
          node --test curator-app/test/calibration-development-checkpoint.test.js

  persist:
    if: github.event_name == 'push' && github.repository == 'colazeta/criminal_infiltration_in_legal_economy_review' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    environment: curator-production
    timeout-minutes: 70
    steps:
      - name: Checkout the exact merged code without retained credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Node for native validation
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
      - name: Set up Python for isolated local synthesis
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Resolve compatible authenticated private service
        env:
          CURATOR_SESSION_SECRET: ${{ secrets.CURATOR_SESSION_SECRET }}
        run: |
          python3 - <<'PY'
          import os,time
          from scripts.enrichment.service_client import call,current_commit
          probe={
              'protocol':'CILE-FULLTEXT-DEV-CHUNK-1',
              'candidate_id':'CAND-ACADEMIC-2026-09-08-EXTRA-a6caf5d7567b-002',
              'extractor_fingerprint':'0'*64,
              'request_sha256':'0'*64,
              'chunk_id':'chunk-9999',
          }
          last='unobserved'
          for attempt in range(1,19):
              try:
                  deployed=current_commit()
                  result=call('development-checkpoint-get',expected_commit=deployed,checkpoint=probe)
                  if result.get('status') in {'missing','found'}:
                      with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as handle:
                          handle.write('CALIBRATION_CHECKPOINT_SERVICE_COMMIT='+deployed+'\n')
                      print(f'Compatible private service verified on attempt {attempt}.')
                      break
                  last='unexpected_checkpoint_probe_status'
              except Exception as error:
                  last=type(error).__name__
              if attempt==18:
                  raise SystemExit(f'compatible_private_service_unavailable:{last}')
              time.sleep(10)
          PY
      - name: Persist one reuse-only structurally valid proposal
        env:
          CURATOR_SESSION_SECRET: ${{ secrets.CURATOR_SESSION_SECRET }}
          FULLTEXT_PASS_STATUS_FILE: ${{ runner.temp }}/fulltext-persist-status.txt
          PYTHONUNBUFFERED: '1'
        run: |
          rm -f "$FULLTEXT_PASS_STATUS_FILE" "$RUNNER_TEMP/fulltext-production-proposal.noartifact"
          python3 -m scripts.calibration.full_text_proposal_persist \
            --candidate-id CAND-ACADEMIC-2026-09-08-EXTRA-a6caf5d7567b-002 \
            --url https://docs.iza.org/dp13028.pdf \
            --expected-pdf-sha256 2e69ba5344af0c85cbe9d3a14e6e3dcc1c9ba907934cbc7937e2674c6efc42b2 \
            --expected-text-sha256 d79a8f1caa0621af4916eed119cb39db1af5819f903efe22726e1432105d5924 \
            --expected-visibility private
          test "$(tr -d '\r\n' < "$FULLTEXT_PASS_STATUS_FILE")" = complete
          test ! -e "$RUNNER_TEMP/fulltext-production-proposal.noartifact"
      - name: Remove transient status even after failure
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/fulltext-persist-status.txt" "$RUNNER_TEMP/fulltext-production-proposal.noartifact"
