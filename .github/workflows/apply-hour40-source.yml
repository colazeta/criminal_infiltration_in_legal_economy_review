name: Apply verified hour-40 implementation
on:
  push:
    branches: [implementation/enrichment-hour40-catchup]
    paths: [.github/workflows/apply-hour40-source.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/implementation/enrichment-hour40-catchup'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout isolated implementation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply integrity-bound source changes only
        run: |
          python3 - <<'PY'
          import base64,hashlib,lzma,os,subprocess
          from pathlib import Path
          encoded=''.join(Path(f'.implementation-transfer/hour40-{i}.b64').read_text().strip() for i in range(3))
          patch=lzma.decompress(base64.b64decode(encoded,validate=True))
          if len(patch)!=92224 or hashlib.sha256(patch).hexdigest()!='eb8a54fd91be74d68984dd4a97f9259de002036cd9e1989d5dd1ce3d1a6c7082':
              raise SystemExit('Source patch integrity failure')
          if b'diff --git a/.github/' in patch:
              raise SystemExit('Workflow changes prohibited in source transfer')
          path=Path(os.environ['RUNNER_TEMP'])/'hour40.patch';path.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(path)],check=True)
          subprocess.run(['git','apply',str(path)],check=True)
          PY
          git rm .implementation-transfer/hour40-*.b64
          git add -A
      - name: Full regression and semantic validation
        run: |
          python3 scripts/validation/validate_repository.py
          python3 scripts/ontology/validate_ontology.py
          python3 scripts/ontology/build_model_browser.py
          git diff --exit-code -- site/vocab/review-v2-model.json
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 scripts/build_archive.py
          python3 scripts/build_secondary_collections.py
          python3 scripts/curation/build_curator_stats.py
          python3 scripts/curation/build_curator_options.py
          python3 scripts/validation/validate_archive.py
          python3 scripts/validation/validate_site.py
          node --test curator-app/test/*.test.js
          for file in site/app.js site/aml.js site/stats.js site/curator.js site/curator-config.js site/curator-guided.js site/model.js site/review-v2.js site/enrichment.js curator-app/src/index.js curator-app/src/worker.js; do node --check "$file"; done
          python3 scripts/report_saturation.py
          git diff --exit-code
      - name: Commit validated source without touching production
        run: |
          python3 - <<'PY'
          import subprocess
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          if any(path.startswith('.github/') for path in paths):
              raise SystemExit('Unexpected workflow write')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement persistent hour-40 catch-up, fenced attempts and ontology 0.4.1'
          git push origin HEAD:implementation/enrichment-hour40-catchup
