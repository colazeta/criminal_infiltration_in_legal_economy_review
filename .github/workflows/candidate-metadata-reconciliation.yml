name: Reconcile candidate metadata

on:
  push:
    branches: [main]
    paths:
      - data/curation/review_queue.csv
      - data/curation/retrieval_coverage.csv
      - data/curation/verified_source_link_repairs.json
      - data/curation/verified_candidate_metadata_repairs.json
      - scripts/curation/reconcile_candidate_metadata.py
      - scripts/curation/apply_verified_candidate_metadata_repairs.py
      - tests/test_candidate_metadata_reconciliation.py
      - tests/test_verified_candidate_metadata_repairs.py
      - .github/workflows/candidate-metadata-reconciliation.yml
  schedule:
    - cron: "10 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-metadata-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.event_name != 'workflow_dispatch' || github.actor == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f5838078e36cf38b85af677262 # v4

      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Apply reviewed explicit candidate metadata repairs
        run: |
          action_date="$(date -u +%F)"
          python scripts/curation/apply_verified_candidate_metadata_repairs.py \
            --date "$action_date" \
            --output "$RUNNER_TEMP/verified-metadata-repair-summary.json"
          python scripts/curation/apply_verified_candidate_metadata_repairs.py \
            --date "$action_date" \
            --check

      - name: Reconcile only verified candidate metadata/provenance
        run: |
          action_date="$(date -u +%F)"
          python scripts/curation/reconcile_candidate_metadata.py \
            --date "$action_date" \
            --output "$RUNNER_TEMP/metadata-repair-summary.json"
          python scripts/curation/reconcile_candidate_metadata.py \
            --date "$action_date" \
            --check

      - name: Refresh deterministic curator exports
        run: |
          python scripts/curation/build_curator_stats.py
          python scripts/curation/build_curator_options.py

      - name: Validate governed repository
        run: |
          python scripts/curation/build_legacy_queue.py --check
          python scripts/validation/validate_repository.py
          python scripts/ontology/validate_ontology.py
          python -m unittest discover -s tests -p 'test_*.py'
          python scripts/build_archive.py --output-dir "$RUNNER_TEMP/archive"
          python scripts/build_secondary_collections.py --output-dir "$RUNNER_TEMP/archive"
          python scripts/metrics/build_research_stats.py --output "$RUNNER_TEMP/archive/research-stats.json"
          python scripts/curation/build_curator_stats.py --output "$RUNNER_TEMP/archive/curator-stats.json"
          python scripts/curation/build_curator_options.py --output "$RUNNER_TEMP/archive/curator-options.json"
          diff -ru "$RUNNER_TEMP/archive" site/data
          python scripts/validation/validate_archive.py
          python scripts/validation/validate_site.py
          node --check site/stats.js
          node --check site/curator.js
          node --check site/curator-queue.js
          node --check site/curator-resolved-link.js
          node --test curator-app/test/*.test.js

      - name: Detect candidate metadata changes
        id: changes
        run: |
          if git diff --quiet -- \
            data/curation/review_queue.csv \
            site/data/curator-stats.json site/data/paper-register.json \
            site/data/curator-options.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open reviewed metadata repair PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="automation/candidate-metadata-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add \
            data/curation/review_queue.csv \
            site/data/curator-stats.json site/data/paper-register.json \
            site/data/curator-options.json
          git commit -m "Verify candidate metadata and source provenance"
          git push origin "$branch"
          head_sha="$(git rev-parse HEAD)"

          python3 - <<'PY' > "$RUNNER_TEMP/metadata-repair-body.md"
          import json
          import os

          reviewed = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "verified-metadata-repair-summary.json"), encoding="utf-8"))
          summary = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "metadata-repair-summary.json"), encoding="utf-8"))
          print("## Candidate metadata verification")
          print()
          print(f"Reviewed explicit bibliographic repairs: **{reviewed['safe_verified_metadata_repairs']}**")
          print()
          for repair in reviewed["repairs"]:
              print(f"- `{repair['candidate_id']}`")
              for field, value in repair["replacement"].items():
                  print(f"  - {field}: `{value}`")
              print(f"  - evidence: {', '.join(repair['evidence_urls'])}")
              print(f"  - verified: {repair['checked_at']}")
          print()
          print(f"Safe dual-source DOI repairs: **{summary['safe_repairs']}**")
          print()
          for repair in summary["repairs"]:
              print(f"- `{repair['candidate_id']}` → DOI `{repair['doi']}`")
              print(f"  - evidence: {repair['resolution_sources']} / {repair['match_method']} / {repair['match_confidence']}")
              print(f"  - persisted retrieval check: {repair['checked_at']}")
          print()
          print(f"Safe verified HTTPS source-link repairs: **{summary['safe_source_link_repairs']}**")
          print()
          for repair in summary["source_link_repairs"]:
              print(f"- `{repair['candidate_id']}`")
              print(f"  - from: `{repair['from_url']}`")
              print(f"  - to: `{repair['to_url']}`")
              print(f"  - evidence: {repair['source']} / {repair['checked_at']}")
          print()
          print("This PR changes candidate bibliography/provenance plus deterministic curator exports only. It makes **zero** eligibility, exclusion, canonicalisation or publication decisions.")
          print("It is intentionally not auto-merged: candidate metadata repair remains a reviewed metadata-verifier action.")
          PY

          set +e
          pr_url="$(gh pr create \
            --base main \
            --head "$branch" \
            --title "Verify candidate metadata and source provenance" \
            --body-file "$RUNNER_TEMP/metadata-repair-body.md" 2>"$RUNNER_TEMP/pr-error.log")"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::warning::Validated metadata repair branch was created, but repository policy blocked PR creation."
            echo "Validated branch retained: $branch" >> "$GITHUB_STEP_SUMMARY"
            sed -n '1,20p' "$RUNNER_TEMP/pr-error.log" >> "$GITHUB_STEP_SUMMARY"
            cat > "$RUNNER_TEMP/recovery-ticket.md" <<EOF
          <!-- cile-validated-branch-recovery:1 -->
          CILE validated branch recovery ticket.

          - kind: candidate-metadata-reconciliation
          - branch: \`$branch\`
          - head_sha: \`$head_sha\`
          - base: \`main\`
          - workflow_run_id: \`$GITHUB_RUN_ID\`
          - workflow_attempt: \`$GITHUB_RUN_ATTEMPT\`
          - state: \`validated_branch_without_pr\`

          The workflow completed validation and pushed the branch but repository policy blocked PR creation. The next authorised automation activation must first check whether a PR already exists for this exact branch/head. If not, create the PR through the authenticated GitHub connector. Do not rerun reconciliation merely to obtain another branch.
          EOF
            gh issue comment 696 --body-file "$RUNNER_TEMP/recovery-ticket.md"
            exit 0
          fi
          echo "Metadata repair PR opened for review: $pr_url" >> "$GITHUB_STEP_SUMMARY"
          echo "No automatic merge was attempted." >> "$GITHUB_STEP_SUMMARY"

      - name: Report no safe repair
        if: steps.changes.outputs.changed != 'true'
        run: |
          echo "No verified candidate metadata/provenance repair is currently safe to propose." >> "$GITHUB_STEP_SUMMARY"
