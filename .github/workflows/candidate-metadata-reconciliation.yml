name: Reconcile candidate metadata

on:
  push:
    branches: [main]
    paths:
      - data/curation/review_queue.csv
      - data/curation/retrieval_coverage.csv
      - scripts/curation/reconcile_candidate_metadata.py
      - tests/test_candidate_metadata_reconciliation.py
      - .github/workflows/candidate-metadata-reconciliation.yml
  schedule:
    - cron: "10 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-metadata-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.event_name != 'workflow_dispatch' || github.actor == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Reconcile only dual-source candidate identifiers
        run: |
          action_date="$(date -u +%F)"
          python scripts/curation/reconcile_candidate_metadata.py \
            --date "$action_date" \
            --output "$RUNNER_TEMP/metadata-repair-summary.json"
          python scripts/curation/reconcile_candidate_metadata.py \
            --date "$action_date" \
            --check

      - name: Refresh deterministic curator exports
        run: |
          python scripts/curation/build_curator_stats.py
          python scripts/curation/build_curator_options.py

      - name: Validate governed repository
        run: |
          python scripts/curation/build_legacy_queue.py --check
          python scripts/validation/validate_repository.py
          python scripts/ontology/validate_ontology.py
          python -m unittest discover -s tests -p 'test_*.py'
          python scripts/build_archive.py --output-dir "$RUNNER_TEMP/archive"
          python scripts/build_secondary_collections.py --output-dir "$RUNNER_TEMP/archive"
          python scripts/metrics/build_research_stats.py --output "$RUNNER_TEMP/archive/research-stats.json"
          python scripts/curation/build_curator_stats.py --output "$RUNNER_TEMP/archive/curator-stats.json"
          python scripts/curation/build_curator_options.py --output "$RUNNER_TEMP/archive/curator-options.json"
          diff -ru "$RUNNER_TEMP/archive" site/data
          python scripts/validation/validate_archive.py
          python scripts/validation/validate_site.py
          node --check site/stats.js
          node --check site/curator.js
          node --check site/curator-queue.js
          node --check site/curator-resolved-link.js
          node --test curator-app/test/*.test.js

      - name: Detect candidate metadata changes
        id: changes
        run: |
          if git diff --quiet -- \
            data/curation/review_queue.csv \
            site/data/curator-stats.json \
            site/data/curator-options.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open reviewed metadata repair PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="automation/candidate-metadata-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add \
            data/curation/review_queue.csv \
            site/data/curator-stats.json \
            site/data/curator-options.json
          git commit -m "Verify candidate identifiers from dual-source retrieval"
          git push origin "$branch"

          python3 - <<'PY' > "$RUNNER_TEMP/metadata-repair-body.md"
          import json
          import os

          summary = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "metadata-repair-summary.json"), encoding="utf-8"))
          print("## Candidate metadata verification")
          print()
          print(f"Safe dual-source repairs: **{summary['safe_repairs']}**")
          print()
          for repair in summary["repairs"]:
              print(f"- `{repair['candidate_id']}` → DOI `{repair['doi']}`")
              print(f"  - evidence: {repair['resolution_sources']} / {repair['match_method']} / {repair['match_confidence']}")
              print(f"  - persisted retrieval check: {repair['checked_at']}")
          print()
          print("This PR changes candidate bibliography/workflow stage plus deterministic curator exports only. It makes **zero** eligibility, exclusion, canonicalisation or publication decisions.")
          print("It is intentionally not auto-merged: candidate metadata repair remains a reviewed metadata-verifier action.")
          PY

          set +e
          pr_url="$(gh pr create \
            --base main \
            --head "$branch" \
            --title "Verify candidate identifiers from dual-source retrieval" \
            --body-file "$RUNNER_TEMP/metadata-repair-body.md" 2>"$RUNNER_TEMP/pr-error.log")"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::warning::Validated metadata repair branch was created, but repository policy blocked PR creation."
            echo "Validated branch retained: $branch" >> "$GITHUB_STEP_SUMMARY"
            sed -n '1,20p' "$RUNNER_TEMP/pr-error.log" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Metadata repair PR opened for review: $pr_url" >> "$GITHUB_STEP_SUMMARY"
          echo "No automatic merge was attempted." >> "$GITHUB_STEP_SUMMARY"

      - name: Report no safe repair
        if: steps.changes.outputs.changed != 'true'
        run: |
          echo "No dual-source candidate metadata repair is currently safe to propose." >> "$GITHUB_STEP_SUMMARY"
