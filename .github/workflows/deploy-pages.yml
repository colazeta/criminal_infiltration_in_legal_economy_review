name: Deploy Literature Archive

on:
  push:
    branches: [main]
    paths:
      - "data/registry/**"
      - "data/raw/e0_seed_promotion_staging_audited.csv"
      - "data/raw/e0_verified_seed_candidates_reviewed.csv"
      - "data/raw/e0_seed_verification_matrix.csv"
      - "scripts/build_archive.py"
      - "scripts/validation/**"
      - "site/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build and validate public archive
        run: |
          python scripts/validation/validate_repo_governance.py
          python scripts/01_seed_registry.py
          python scripts/02_deduplicate_papers.py
          python scripts/build_archive.py
          python scripts/validation/validate_archive.py
          python scripts/validation/validate_site.py
          node --check site/app.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
