name: Import reviewed actual bibliography

on:
  push:
    branches: [main]
    paths:
      - config/verified-bibliography-seed.json
      - scripts/enrichment/import_verified_bibliography.py
      - tests/test_verified_bibliography_import.py
      - .github/workflows/import-verified-bibliography.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verified-actual-bibliography-import
  cancel-in-progress: false

jobs:
  import-bibliography:
    if: github.repository == 'colazeta/criminal_infiltration_in_legal_economy_review' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: curator-production
    steps:
      - name: Checkout reviewed main without retained credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Validate bibliography import contract
        run: |
          python3 scripts/validation/validate_repository.py
          python3 -m unittest tests.test_verified_bibliography_import tests.test_delivery_contracts

      - name: Wait for the exact reviewed Worker deployment
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          expected = os.environ['EXPECTED_COMMIT']
          url = 'https://criminal-infiltration-curator.colazeta-research.workers.dev/version'
          last = None
          for attempt in range(1, 31):
              try:
                  request = urllib.request.Request(url, headers={'Accept': 'application/json', 'User-Agent': 'cile-bibliography-deploy-fence/1.0'})
                  with urllib.request.urlopen(request, timeout=15) as response:
                      data = json.load(response)
                  last = data.get('commit')
                  if response.status == 200 and last == expected:
                      print(f'Exact Worker commit verified on attempt {attempt}.')
                      break
              except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError, ValueError) as error:
                  last = type(error).__name__
              if attempt == 30:
                  raise SystemExit(f'exact_worker_commit_not_deployed:{last}')
              time.sleep(10)
          PY

      - name: Import source-complete actual-paper bibliography and verify public readback
        env:
          CURATOR_SESSION_SECRET: ${{ secrets.CURATOR_SESSION_SECRET }}
        run: python3 -m scripts.enrichment.import_verified_bibliography --expected-commit "$GITHUB_SHA"
