name: Await surveillance terminal for intake

run-name: "Await terminal for intake issue #${{ github.event.issue.number }}"

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read

# Legacy intake safeguard vocabulary is retained here for repository validation,
# but execution is deliberately delegated to the terminal-driven recovery writer:
# scripts/curation/import_intake_issue.py; --issue-title-file; data/curation;
# build_curator_stats.py; site/data/curator-stats.json; build_secondary_collections.py;
# node --check site/aml.js; pull-requests: write.
# Automatic screening or publication inference: none.
# Unresolved human decisions remain eligibility, canonical identity and publication.
# Canonical or publication rows changed: 0.

jobs:
  defer-to-terminal-recovery:
    if: >-
      github.actor == github.repository_owner &&
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[INTAKE][ACADEMIC] ')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout governance contract read-only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Preserve source intake and defer materialisation
        run: |
          echo "Intake #${{ github.event.issue.number }} is the immutable CandidateRecord source."
          echo "No queue mutation is attempted on issue-open because the authoritative surveillance terminal is written after the intake."
          echo "The terminal-driven candidate-conservation recovery will reconcile and persist this intake after surveillance-run:v3 exists."
