name: Await surveillance terminal for intake

run-name: "Await terminal for intake issue #${{ github.event.issue.number }}"

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read

jobs:
  defer-to-terminal-recovery:
    if: >-
      github.actor == github.repository_owner &&
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[INTAKE][ACADEMIC] ')
    runs-on: ubuntu-latest
    steps:
      - name: Preserve source intake and defer materialisation
        run: |
          echo "Intake #${{ github.event.issue.number }} is the immutable CandidateRecord source."
          echo "No queue mutation is attempted on issue-open because the authoritative surveillance terminal is written after the intake."
          echo "The terminal-driven candidate-conservation recovery will reconcile and persist this intake after surveillance-run:v3 exists."
