name: Stage daily intake in curator queue

run-name: "Stage intake issue #${{ github.event.issue.number }}"

on:
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: intake-to-curation-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  prepare-change:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[INTAKE][ACADEMIC] ')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Read authenticated intake issue
        run: |
          python3 -c 'import json, os, pathlib; event=json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8")); root=pathlib.Path(os.environ["RUNNER_TEMP"]); root.joinpath("intake-body.md").write_text(event["issue"].get("body") or "", encoding="utf-8"); root.joinpath("intake-title.txt").write_text(event["issue"].get("title") or "", encoding="utf-8")'

      - name: Stage validated candidates without screening
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          action_date="$(date -u +%F)"
          python scripts/curation/import_intake_issue.py \
            --issue-body-file "$RUNNER_TEMP/intake-body.md" \
            --issue-title-file "$RUNNER_TEMP/intake-title.txt" \
            --issue-number "$ISSUE_NUMBER" \
            --date "$action_date" \
            --output "$RUNNER_TEMP/intake-import.json"

      - name: Validate the complete archive
        run: |
          python scripts/curation/build_legacy_queue.py --check
          python scripts/validation/validate_repository.py
          python -m unittest discover -s tests -p 'test_*.py'
          python scripts/build_archive.py
          python scripts/curation/build_curator_stats.py
          python scripts/curation/build_curator_options.py
          python scripts/validation/validate_archive.py
          python scripts/validation/validate_site.py
          node --check site/app.js
          node --check site/stats.js
          node --check site/curator.js
          node --check site/curator-config.js
          node --check curator-app/src/index.js
          node --test curator-app/test/*.test.js
          python scripts/report_saturation.py

      - name: Create a review branch
        id: branch
        run: |
          batch_id="$(python3 -c 'import json, os; print(json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "intake-import.json"), encoding="utf-8"))["batch_id"])')"
          added_count="$(python3 -c 'import json, os; print(len(json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "intake-import.json"), encoding="utf-8"))["added"]))')"
          queue_total="$(python3 -c 'import json, os; print(json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "intake-import.json"), encoding="utf-8"))["queue_total"])')"
          branch="curation/intake-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add data/curation site/data/curator-stats.json
          git commit -m "Stage ${batch_id} for curator review"
          git push origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "batch_id=$batch_id" >> "$GITHUB_OUTPUT"
          echo "added_count=$added_count" >> "$GITHUB_OUTPUT"
          echo "queue_total=$queue_total" >> "$GITHUB_OUTPUT"

      - name: Open a visible pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          BATCH_ID: ${{ steps.branch.outputs.batch_id }}
          ADDED_COUNT: ${{ steps.branch.outputs.added_count }}
          QUEUE_TOTAL: ${{ steps.branch.outputs.queue_total }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          issue_url="https://github.com/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}"
          body_file="$RUNNER_TEMP/intake-curation-pr.md"
          candidates="$(python3 -c 'import json, os; data=json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "intake-import.json"), encoding="utf-8")); print("\n".join(f"- `{value}`" for value in data["added"]))')"
          {
            echo "## Authorised intake source"
            echo
            echo "- Batch: \`${BATCH_ID}\`"
            echo "- Source issue: ${issue_url}"
            echo "- GitHub actor: \`${GITHUB_ACTOR}\`"
            echo "- Validated workflow run: ${run_url}"
            echo
            echo "## Candidates staged"
            echo
            echo "${candidates}"
            echo
            echo "## Changed files"
            echo
            git diff --name-only main...HEAD | sed 's/^/- `/' | sed 's/$/`/'
            echo
            echo "## Validation commands and results"
            echo
            echo '```text'
            echo "PASS python scripts/curation/build_legacy_queue.py --check"
            echo "PASS python scripts/validation/validate_repository.py"
            echo "PASS python -m unittest discover -s tests -p 'test_*.py'"
            echo "PASS python scripts/build_archive.py"
            echo "PASS python scripts/curation/build_curator_stats.py"
            echo "PASS python scripts/curation/build_curator_options.py"
            echo "PASS python scripts/validation/validate_archive.py"
            echo "PASS python scripts/validation/validate_site.py"
            echo "PASS node --check site/app.js"
            echo "PASS node --check site/stats.js"
            echo "PASS node --check site/curator.js"
            echo "PASS node --check site/curator-config.js"
            echo "PASS node --check curator-app/src/index.js"
            echo "PASS node --test curator-app/test/*.test.js"
            echo "PASS python scripts/report_saturation.py"
            echo '```'
            echo
            echo "## Record counts after the change"
            echo
            echo "- Candidates added: ${ADDED_COUNT}"
            echo "- Materialised queue rows: ${QUEUE_TOTAL}"
            echo "- Canonical or publication rows changed: 0"
            echo
            echo "## Retrieval and human decisions"
            echo
            echo "- External retrieval in this workflow: none; it stages the persisted intake issue only."
            echo "- Automatic screening or publication inference: none."
            echo "- Unresolved human decisions: an authorised person must inspect and merge this PR, then review each candidate issue; metadata verification, screening, canonical promotion and publication remain separate."
            echo
            echo "Closes #${ISSUE_NUMBER}"
          } > "$body_file"
          encoded_title="$(python3 -c 'import sys; from urllib.parse import quote; print(quote(sys.argv[1], safe=""))' "Stage ${BATCH_ID} for curator review")"
          encoded_body="$(python3 -c 'import sys; from urllib.parse import quote; print(quote(sys.stdin.read(), safe=""))' < "$body_file")"
          compare_url="https://github.com/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1&title=${encoded_title}&body=${encoded_body}"
          set +e
          pr_url="$(gh pr create --base main --head "$BRANCH" --title "Stage ${BATCH_ID} for curator review" --body-file "$body_file" 2>pr-error.log)"
          pr_status=$?
          set -e
          if [ "$pr_status" -eq 0 ]; then
            gh issue comment "$ISSUE_NUMBER" --body "Candidates validated and staged for review: ${pr_url}"
          else
            gh issue comment "$ISSUE_NUMBER" --body "The intake passed validation, but GitHub did not allow the workflow token to open the pull request. [Create the prefilled pull request](${compare_url})."
          fi
          {
            echo "## Intake change prepared"
            echo
            if [ "$pr_status" -eq 0 ]; then
              echo "Pull request: ${pr_url}"
            else
              echo "[Create the prefilled pull request](${compare_url})"
              echo
              echo '```text'
              sed -n '1,20p' pr-error.log
              echo '```'
            fi
            echo
            cat "$body_file"
          } >> "$GITHUB_STEP_SUMMARY"
