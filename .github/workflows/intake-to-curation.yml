name: Stage daily intake in curator queue

run-name: "Stage intake issue #${{ github.event.issue.number }}"

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read

concurrency:
  group: intake-to-curation-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  prepare-change:
    if: >-
      github.actor == github.repository_owner &&
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[INTAKE][ACADEMIC] ')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Read authenticated intake issue
        run: |
          python3 -c 'import json, os, pathlib; event=json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8")); root=pathlib.Path(os.environ["RUNNER_TEMP"]); root.joinpath("intake-body.md").write_text(event["issue"].get("body") or "", encoding="utf-8"); root.joinpath("intake-title.txt").write_text(event["issue"].get("title") or "", encoding="utf-8")'

      - name: Require authenticated completed ledger
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/curation/fetch_intake_run.py

      - name: Stage validated candidates without screening
        env:
          ISSUE_CREATED_AT: ${{ github.event.issue.created_at }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          action_date="$(date -u +%F)"
          python scripts/curation/import_intake_issue.py \
            --issue-body-file "$RUNNER_TEMP/intake-body.md" \
            --issue-title-file "$RUNNER_TEMP/intake-title.txt" \
            --issue-number "$ISSUE_NUMBER" \
            --issue-created-at "$ISSUE_CREATED_AT" \
            --run-file "$RUNNER_TEMP/intake-run.json" \
            --date "$action_date" \
            --output "$RUNNER_TEMP/intake-import.json"

      - name: Resolve paper access for the complete queue
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          UNPAYWALL_EMAIL: ${{ secrets.UNPAYWALL_EMAIL }}
        run: |
          action_date="$(date -u +%F)"
          python scripts/retrieval/resolve_queue.py \
            --date "$action_date" \
            --max-age-days 30 \
            --output "$RUNNER_TEMP/retrieval-summary.json"
          python scripts/retrieval/resolve_queue.py --check

      - name: Backfill abstract coverage for the expanded queue
        env:
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          CORE_API_KEY: ${{ secrets.CORE_API_KEY }}
          UNPAYWALL_EMAIL: ${{ secrets.UNPAYWALL_EMAIL }}
        run: |
          if ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends poppler-utils
          fi
          export ABSTRACT_COVERAGE_DATE="$(date -u +%F)"
          node scripts/abstracts/backfill_coverage.mjs \
            --summary "$RUNNER_TEMP/abstract-coverage-summary.json"
          node scripts/abstracts/backfill_coverage.mjs --check

      - name: Reconcile reading aids for unresolved abstracts
        run: |
          action_date="$(date -u +%F)"
          python scripts/curation/reconcile_reading_aids.py --date "$action_date" \
            > "$RUNNER_TEMP/reading-aid-summary.json"
          python scripts/curation/reconcile_reading_aids.py --check

      - name: Classify access for the expanded queue
        env:
          UNPAYWALL_EMAIL: ${{ secrets.UNPAYWALL_EMAIL }}
        run: |
          action_date="$(date -u +%F)"
          python scripts/access/classify_access.py --date "$action_date"
          python scripts/access/reconcile_access_evidence.py
          python scripts/access/classify_access.py --check
          python scripts/access/reconcile_access_evidence.py --check
          python3 - <<'PY' > "$RUNNER_TEMP/access-coverage-summary.json"
          import csv, json
          from collections import Counter
          with open("data/curation/access_coverage.csv", newline="", encoding="utf-8-sig") as handle:
              rows = list(csv.DictReader(handle))
          counts = Counter(row["access_status"] for row in rows)
          print(json.dumps({"total": len(rows), "open": counts.get("open", 0), "restricted": counts.get("restricted", 0), "unknown": counts.get("unknown", 0)}, sort_keys=True))
          PY

      - name: Validate the complete archive
        run: |
          python scripts/curation/build_legacy_queue.py --check
          python scripts/validation/validate_repository.py
          python scripts/ontology/validate_ontology.py
          python scripts/validation/validate_intake_history.py --base HEAD
          python -m unittest discover -s tests -p 'test_*.py'
          python scripts/build_archive.py
          python scripts/build_secondary_collections.py
          python scripts/curation/build_curator_stats.py
          python scripts/curation/build_curator_options.py
          python scripts/validation/validate_archive.py
          python scripts/validation/validate_site.py
          python -m py_compile \
            scripts/curation/reconcile_reading_aids.py \
            scripts/access/classify_access.py \
            scripts/access/reconcile_access_evidence.py
          node --check site/app.js
          node --check site/aml.js
          node --check site/stats.js
          node --check site/curator.js
          node --check site/curator-config.js
          node --check site/curator-reading.js
          node --check site/curator-queue.js
          node --check curator-app/src/index.js
          node --check curator-app/src/enrichment.js
          node --check curator-app/src/worker.js
          node --test curator-app/test/*.test.js
          python scripts/report_saturation.py

      - name: Create a validated review branch
        id: branch
        run: |
          batch_id="$(python3 -c 'import json, os; print(json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "intake-import.json"), encoding="utf-8"))["batch_id"])')"
          added_count="$(python3 -c 'import json, os; print(len(json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "intake-import.json"), encoding="utf-8"))["added"]))')"
          queue_total="$(python3 -c 'import json, os; print(json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "intake-import.json"), encoding="utf-8"))["queue_total"])')"
          base_sha="$(git rev-parse HEAD)"
          branch="curation/intake-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add data/curation site/data/curator-stats.json site/data/paper-register.json
          git commit -m "Stage ${batch_id} for curator review"
          git push origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "batch_id=$batch_id" >> "$GITHUB_OUTPUT"
          echo "added_count=$added_count" >> "$GITHUB_OUTPUT"
          echo "queue_total=$queue_total" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"

      - name: Persist validated intake change
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          BASE_SHA: ${{ steps.branch.outputs.base_sha }}
          BATCH_ID: ${{ steps.branch.outputs.batch_id }}
          ADDED_COUNT: ${{ steps.branch.outputs.added_count }}
          QUEUE_TOTAL: ${{ steps.branch.outputs.queue_total }}
          ISSUE_CREATED_AT: ${{ github.event.issue.created_at }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          issue_url="https://github.com/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}"
          body_file="$RUNNER_TEMP/intake-curation-pr.md"
          candidates="$(python3 -c 'import json, os; data=json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "intake-import.json"), encoding="utf-8")); print("\n".join(f"- `{value}`" for value in data["added"]))')"
          retrieval="$(python3 -c 'import json, os; data=json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "retrieval-summary.json"), encoding="utf-8")); print(f"{data.get('"'"'total'"'"',0)} covered; {data.get('"'"'full_text'"'"',0)} direct full text; {data.get('"'"'open_access_landing'"'"',0)} OA landing; {data.get('"'"'unresolved'"'"',0)} unresolved")')"
          abstract_coverage="$(cat "$RUNNER_TEMP/abstract-coverage-summary.json")"
          reading_aids="$(cat "$RUNNER_TEMP/reading-aid-summary.json")"
          access_coverage="$(cat "$RUNNER_TEMP/access-coverage-summary.json")"
          {
            echo "## Authorised intake source"
            echo
            echo "- Batch: \`${BATCH_ID}\`"
            echo "- Source issue: ${issue_url}"
            echo "- GitHub actor: \`${GITHUB_ACTOR}\`"
            echo "- Validated workflow run: ${run_url}"
            echo
            echo "## Candidates staged"
            echo
            echo "${candidates}"
            echo
            echo "## Reviewability coverage"
            echo
            echo "- Retrieval: ${retrieval}."
            echo "- Abstract coverage: \`${abstract_coverage}\`."
            echo "- Reading-aid reconciliation: \`${reading_aids}\`."
            echo "- Access coverage: \`${access_coverage}\`."
            echo "- Resolver order: full text / OA location / publisher or repository landing / DOI / discovery source link / explicit unresolved."
            echo "- Retrieval, abstract, reading-aid and access metadata are preparatory and cannot determine eligibility or publication."
            echo
            echo "## Changed files"
            echo
            git diff --name-only main...HEAD | sed 's/^/- `/' | sed 's/$/`/'
            echo
            echo "## Record counts after the change"
            echo
            echo "- Candidates added: ${ADDED_COUNT}"
            echo "- Materialised queue rows: ${QUEUE_TOTAL}"
            echo "- Canonical or publication rows changed: 0"
            echo
            echo "## Human decisions"
            echo
            echo "- Automatic screening or publication inference: none."
            echo "- Unresolved human decisions: an authorised person still decides eligibility; the preceding steps only make each paper reviewable and auditable."
            echo
            echo "Closes #${ISSUE_NUMBER}"
          } > "$body_file"

          pr_url=""
          set +e
          pr_url="$(gh pr create --base main --head "$BRANCH" --title "Stage ${BATCH_ID} for curator review" --body-file "$body_file" 2>"$RUNNER_TEMP/pr-create-error.log")"
          pr_status=$?
          set -e

          if [ "$pr_status" -eq 0 ]; then
            set +e
            merge_output="$(gh pr merge "$pr_url" --squash --delete-branch 2>&1)"
            merge_status=$?
            set -e
            if [ "$merge_status" -eq 0 ]; then
              gh issue comment "$ISSUE_NUMBER" --body "Validated intake merged automatically: ${pr_url}"
              {
                echo "## Intake merged"
                echo
                echo "Pull request: ${pr_url}"
                echo
                cat "$body_file"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            printf '%s\n' "$merge_output" > "$RUNNER_TEMP/pr-merge-error.log"
          fi

          # Repository policy may prohibit GitHub Actions from creating/merging PRs.
          # The change is already fully validated. Fast-forward main only when it has
          # not moved since the validated branch was cut; otherwise retain the branch
          # and fail loudly rather than rebasing or overwriting concurrent work.
          git fetch origin main
          current_main="$(git rev-parse origin/main)"
          if [ "$current_main" = "$BASE_SHA" ]; then
            set +e
            git push origin HEAD:main 2>"$RUNNER_TEMP/main-push-error.log"
            push_status=$?
            set -e
            if [ "$push_status" -eq 0 ]; then
              gh issue comment "$ISSUE_NUMBER" --body "Validated intake fast-forwarded to main because repository policy blocked the preferred PR/automerge path. Audit branch: \`${BRANCH}\`. Run: ${run_url}"
              {
                echo "## Intake fast-forwarded to main"
                echo
                echo "Repository policy blocked PR/automerge; main was unchanged from the validated base and was fast-forwarded safely."
                echo
                echo "Audit branch: \`${BRANCH}\`"
                echo
                cat "$body_file"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi

          echo "::error::Validated intake could not be persisted automatically; the audit branch is retained."
          {
            echo "## Persistence blocker"
            echo
            echo "Validated branch retained: \`${BRANCH}\`"
            echo "Expected main SHA: \`${BASE_SHA}\`"
            echo "Current main SHA: \`${current_main}\`"
            if [ -s "$RUNNER_TEMP/pr-create-error.log" ]; then
              echo
              echo "PR creation error:"
              sed -n '1,20p' "$RUNNER_TEMP/pr-create-error.log"
            fi
            if [ -s "$RUNNER_TEMP/pr-merge-error.log" ]; then
              echo
              echo "PR merge error:"
              sed -n '1,20p' "$RUNNER_TEMP/pr-merge-error.log"
            fi
            if [ -s "$RUNNER_TEMP/main-push-error.log" ]; then
              echo
              echo "Fast-forward error:"
              sed -n '1,20p' "$RUNNER_TEMP/main-push-error.log"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
