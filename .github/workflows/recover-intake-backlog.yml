name: Recover intake backlog

run-name: "Recover intake backlog (${{ github.event_name }})"

on:
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created]
  schedule:
    - cron: "55 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# Recovery is idempotent and rescans the immutable intake source of truth. A newer
# global recovery may therefore supersede an older recovery that has not crossed
# its CandidateRecord persistence barrier. This avoids optional enrichment in an
# obsolete run blocking candidate preservation indefinitely. This cancellation
# policy is recovery-only; it does not change surveillance-run semantics.
concurrency:
  group: intake-to-curation-main
  cancel-in-progress: true

jobs:
  recover:
    if: >-
      (github.event_name == 'issues' &&
       github.actor == github.repository_owner &&
       github.event.issue.user.login == github.repository_owner &&
       github.event.issue.title == '[MAINTENANCE][INTAKE-RECOVERY]') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 30 &&
       github.event.comment.user.login == github.repository_owner &&
       contains(github.event.comment.body, 'surveillance-run:v3')) ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Reconcile and stage all outstanding intake issues
        id: recovery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          action_date="$(date -u +%F)"
          python scripts/curation/recover_intake_backlog.py \
            --repository "$GITHUB_REPOSITORY" \
            --owner "$GITHUB_REPOSITORY_OWNER" \
            --ledger-issue 30 \
            --date "$action_date" \
            --output "$RUNNER_TEMP/intake-recovery.json"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          data=json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "intake-recovery.json"), encoding="utf-8"))
          print(f"added_count={data['added_candidates']}")
          print(f"processed_batches={data['processed_batches']}")
          print(f"rediscovery_count={data['rediscovery_occurrences']}")
          print(f"failure_count={len(data['failures'])}")
          print(f"quarantine_count={len(data['quarantined'])}")
          PY

      # Candidate preservation is the commit barrier. Do not make it wait for
      # abstracts, OA enrichment or other useful-but-optional downstream work.
      - name: Validate candidate preservation state
        if: steps.recovery.outputs.added_count != '0'
        run: |
          python scripts/curation/build_legacy_queue.py --check
          python scripts/validation/validate_intake_history.py --base HEAD
          python -m unittest discover -s tests -p 'test_intake_backlog_recovery.py'
          python -m unittest discover -s tests -p 'test_candidate_conservation.py'

      - name: Persist recovered CandidateRecords first
        id: core_persist
        if: steps.recovery.outputs.added_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          ADDED_COUNT: ${{ steps.recovery.outputs.added_count }}
          PROCESSED_BATCHES: ${{ steps.recovery.outputs.processed_batches }}
          REDISCOVERY_COUNT: ${{ steps.recovery.outputs.rediscovery_count }}
        run: |
          base_sha="$(git rev-parse HEAD)"
          branch="curation/intake-core-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add data/curation/review_queue.csv data/curation/intake_access
          git commit -m "Preserve recovered intake candidates"
          git push origin "$branch"

          body_file="$RUNNER_TEMP/core-recovery-pr.md"
          {
            echo "## Candidate-preservation barrier"
            echo
            echo "- Governed batches processed: ${PROCESSED_BATCHES}"
            echo "- New operational CandidateRecords added: ${ADDED_COUNT}"
            echo "- Exact rediscovery occurrences reconciled without duplicate queue rows: ${REDISCOVERY_COUNT}"
            echo "- Eligibility, canonical identity and scientific publication decisions changed: 0"
            echo
            echo "This commit intentionally persists CandidateRecords before optional abstract/access enrichment."
          } > "$body_file"

          pr_url=""
          set +e
          pr_url="$(gh pr create --base main --head "$branch" --title "Preserve recovered intake candidates" --body-file "$body_file" 2>"$RUNNER_TEMP/core-pr-create-error.log")"
          pr_status=$?
          set -e
          if [ "$pr_status" -eq 0 ]; then
            set +e
            merge_output="$(gh pr merge "$pr_url" --squash --delete-branch 2>&1)"
            merge_status=$?
            set -e
            if [ "$merge_status" -eq 0 ]; then
              echo "persisted=true" >> "$GITHUB_OUTPUT"
              echo "persistence=pr:${pr_url}" >> "$GITHUB_OUTPUT"
              git fetch origin main
              git checkout -B recovery-enrichment origin/main
              exit 0
            fi
            printf '%s\n' "$merge_output" > "$RUNNER_TEMP/core-pr-merge-error.log"
          fi

          git fetch origin main
          current_main="$(git rev-parse origin/main)"
          if [ "$current_main" = "$base_sha" ]; then
            set +e
            git push origin HEAD:main 2>"$RUNNER_TEMP/core-main-push-error.log"
            push_status=$?
            set -e
            if [ "$push_status" -eq 0 ]; then
              echo "persisted=true" >> "$GITHUB_OUTPUT"
              echo "persistence=fast-forward:${branch}" >> "$GITHUB_OUTPUT"
              git fetch origin main
              git checkout -B recovery-enrichment origin/main
              exit 0
            fi
          fi

          echo "::error::CandidateRecords were staged but the preservation barrier could not persist them; source intake issues remain open."
          exit 1

      - name: Mark no-data recovery as preserved
        id: nochange
        if: steps.recovery.outputs.added_count == '0'
        run: |
          echo "persisted=true" >> "$GITHUB_OUTPUT"
          echo "persistence=no-data-change" >> "$GITHUB_OUTPUT"

      - name: Finalise intake issues after preservation barrier
        if: >-
          (steps.core_persist.outputs.persisted == 'true' || steps.nochange.outputs.persisted == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          PERSISTENCE: ${{ steps.core_persist.outputs.persistence || steps.nochange.outputs.persistence }}
        run: |
          report="$RUNNER_TEMP/intake-recovery.json"
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          jq -c '.processed[]' "$report" | while IFS= read -r row; do
            issue="$(jq -r '.issue_number' <<<"$row")"
            batch="$(jq -r '.batch_id' <<<"$row")"
            added="$(jq '.added | length' <<<"$row")"
            skipped="$(jq '.skipped_existing | length' <<<"$row")"
            gh issue comment "$issue" --body "Candidate-preservation barrier completed for \`${batch}\`: ${added} new operational candidate(s) materialised and ${skipped} exact rediscovery occurrence(s) reconciled. Optional enrichment may continue independently. No scientific eligibility or canonical duplicate decision was inferred. Persistence: ${PERSISTENCE}. Run: ${run_url}"
            gh issue close "$issue" --reason completed || true
          done

          jq -c '.quarantined[]' "$report" | while IFS= read -r row; do
            issue="$(jq -r '.issue_number' <<<"$row")"
            batch="$(jq -r '.batch_id' <<<"$row")"
            reason="$(jq -r '.reason' <<<"$row")"
            gh issue comment "$issue" --body "Backlog recovery did not materialise \`${batch}\`: ${reason}. The source issue remains the audit record; no candidate or scientific decision was created. Run: ${run_url}"
            gh issue close "$issue" --reason "not planned" || true
          done

          jq -c '.failures[]' "$report" | while IFS= read -r row; do
            issue="$(jq -r '.issue_number' <<<"$row")"
            batch="$(jq -r '.batch_id' <<<"$row")"
            error="$(jq -r '.error' <<<"$row")"
            gh issue comment "$issue" --body "Candidate preservation is still blocked for \`${batch}\`: \`${error}\`. This issue remains open and is not counted as materialised. Run: ${run_url}"
          done

      - name: Refresh operational archive after CandidateRecord persistence
        if: >-
          steps.recovery.outputs.added_count != '0' &&
          steps.core_persist.outputs.persisted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run archive.yml --ref main

      # Everything below this point is enrichment. It must never be capable of
      # undoing or withholding a CandidateRecord that crossed the barrier above.
      - name: Resolve paper access for preserved candidates
        id: resolve_access
        if: steps.core_persist.outputs.persisted == 'true'
        continue-on-error: true
        timeout-minutes: 12
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          UNPAYWALL_EMAIL: ${{ secrets.UNPAYWALL_EMAIL }}
        run: |
          action_date="$(date -u +%F)"
          python scripts/retrieval/resolve_queue.py \
            --date "$action_date" \
            --max-age-days 30 \
            --output "$RUNNER_TEMP/retrieval-summary.json"
          python scripts/retrieval/resolve_queue.py --check

      - name: Backfill abstract coverage for preserved candidates
        id: abstract_enrichment
        if: steps.core_persist.outputs.persisted == 'true'
        continue-on-error: true
        timeout-minutes: 15
        env:
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          CORE_API_KEY: ${{ secrets.CORE_API_KEY }}
          UNPAYWALL_EMAIL: ${{ secrets.UNPAYWALL_EMAIL }}
        run: |
          if ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends poppler-utils
          fi
          export ABSTRACT_COVERAGE_DATE="$(date -u +%F)"
          node scripts/abstracts/backfill_coverage.mjs \
            --summary "$RUNNER_TEMP/abstract-coverage-summary.json"
          node scripts/abstracts/backfill_coverage.mjs --check

      - name: Reconcile reading aids for preserved candidates
        id: reading_aids
        if: steps.core_persist.outputs.persisted == 'true'
        continue-on-error: true
        timeout-minutes: 8
        run: |
          action_date="$(date -u +%F)"
          python scripts/curation/reconcile_reading_aids.py --date "$action_date" \
            > "$RUNNER_TEMP/reading-aid-summary.json"
          python scripts/curation/reconcile_reading_aids.py --check

      - name: Classify access for preserved candidates
        id: classify_access
        if: steps.core_persist.outputs.persisted == 'true'
        continue-on-error: true
        timeout-minutes: 10
        env:
          UNPAYWALL_EMAIL: ${{ secrets.UNPAYWALL_EMAIL }}
        run: |
          action_date="$(date -u +%F)"
          python scripts/access/classify_access.py --date "$action_date"
          python scripts/access/reconcile_access_evidence.py
          python scripts/access/classify_access.py --check
          python scripts/access/reconcile_access_evidence.py --check

      - name: Validate enriched recovered state
        id: validate_enriched
        if: >-
          steps.core_persist.outputs.persisted == 'true' &&
          steps.resolve_access.outcome == 'success' &&
          steps.abstract_enrichment.outcome == 'success' &&
          steps.reading_aids.outcome == 'success' &&
          steps.classify_access.outcome == 'success'
        run: |
          python scripts/curation/build_legacy_queue.py --check
          python scripts/validation/validate_repository.py
          python scripts/ontology/validate_ontology.py
          python scripts/validation/validate_intake_history.py --base HEAD
          python -m unittest discover -s tests -p 'test_*.py'
          python scripts/build_archive.py
          python scripts/build_secondary_collections.py
          python scripts/curation/build_curator_stats.py
          python scripts/curation/build_curator_options.py
          python scripts/validation/validate_archive.py
          python scripts/validation/validate_site.py
          node --test curator-app/test/*.test.js
          python scripts/report_saturation.py

      - name: Persist successful enrichment
        id: enrichment_persist
        if: steps.validate_enriched.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "persisted=true" >> "$GITHUB_OUTPUT"
            echo "persistence=no-enrichment-change" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          branch="curation/intake-enrichment-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add data/curation site/data/curator-stats.json site/data/paper-register.json
          git commit -m "Enrich recovered intake candidates"
          git push origin "$branch"
          pr_url="$(gh pr create --base main --head "$branch" --title "Enrich recovered intake candidates" --body "Optional enrichment after the CandidateRecord preservation barrier. No scientific eligibility or canonical-identity decision is changed.")"
          gh pr merge "$pr_url" --squash --delete-branch
          echo "persisted=true" >> "$GITHUB_OUTPUT"
          echo "persistence=pr:${pr_url}" >> "$GITHUB_OUTPUT"

      - name: Report recovery outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
          ADDED: ${{ steps.recovery.outputs.added_count }}
          PROCESSED: ${{ steps.recovery.outputs.processed_batches }}
          REDISCOVERIES: ${{ steps.recovery.outputs.rediscovery_count }}
          FAILURES: ${{ steps.recovery.outputs.failure_count }}
          QUARANTINED: ${{ steps.recovery.outputs.quarantine_count }}
          CORE_PERSISTENCE: ${{ steps.core_persist.outputs.persistence || steps.nochange.outputs.persistence }}
          RESOLVE_OUTCOME: ${{ steps.resolve_access.outcome }}
          ABSTRACT_OUTCOME: ${{ steps.abstract_enrichment.outcome }}
          READING_OUTCOME: ${{ steps.reading_aids.outcome }}
          ACCESS_OUTCOME: ${{ steps.classify_access.outcome }}
        run: |
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          summary="Candidate conservation: ${PROCESSED:-0} governed batch(es) processed, ${ADDED:-0} CandidateRecord(s) materialised, ${REDISCOVERIES:-0} exact rediscovery occurrence(s) reconciled, ${QUARANTINED:-0} audited batch(es) quarantined, ${FAILURES:-0} unresolved batch(es). Core persistence: ${CORE_PERSISTENCE:-not-persisted}. Optional enrichment outcomes: retrieval=${RESOLVE_OUTCOME:-n/a}, abstracts=${ABSTRACT_OUTCOME:-n/a}, reading-aids=${READING_OUTCOME:-n/a}, access=${ACCESS_OUTCOME:-n/a}. Run: ${run_url}"

          if [ "$EVENT_NAME" = "issues" ] && [ -n "$TRIGGER_ISSUE" ]; then
            if [ "${FAILURES:-0}" != "0" ] || [ -z "${CORE_PERSISTENCE:-}" ]; then
              gh issue comment "$TRIGGER_ISSUE" --body "Candidate-conservation recovery did not clear its preservation barrier. ${summary}"
              exit 0
            fi
            gh issue comment "$TRIGGER_ISSUE" --body "$summary"
            gh issue close "$TRIGGER_ISSUE" --reason completed || true
          else
            {
              echo "### Candidate-conservation recovery"
              echo
              echo "$summary"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Enforce candidate-conservation invariant
        if: >-
          always() &&
          steps.recovery.outcome == 'success' &&
          ((steps.recovery.outputs.failure_count != '' && steps.recovery.outputs.failure_count != '0') ||
           (steps.recovery.outputs.added_count != '0' && steps.core_persist.outputs.persisted != 'true'))
        run: |
          echo "::error::Candidate conservation failed: one or more governed CandidateRecords did not cross the persistence barrier."
          exit 1
