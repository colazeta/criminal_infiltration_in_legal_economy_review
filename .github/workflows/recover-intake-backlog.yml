name: Recover intake backlog

run-name: "Recover intake backlog (${{ github.event_name }})"

on:
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created]
  schedule:
    - cron: "55 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# This is the sole automatic CandidateRecord writer. It is intentionally short:
# preservation must complete before any optional retrieval or enrichment work.

jobs:
  recover:
    if: >-
      (github.event_name == 'issues' &&
       github.actor == github.repository_owner &&
       github.event.issue.user.login == github.repository_owner &&
       github.event.issue.title == '[MAINTENANCE][INTAKE-RECOVERY]') ||
      (github.event_name == 'issue_comment' &&
       github.actor == github.repository_owner &&
       github.event.comment.user.login == github.repository_owner &&
       github.event.issue.user.login == github.repository_owner &&
       github.event.issue.number == 362 &&
       github.event.issue.title == '[MAINTENANCE][INTAKE-RECOVERY]' &&
       github.event.comment.body == '/recover-intake') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 30 &&
       github.event.comment.user.login == github.repository_owner &&
       contains(github.event.comment.body, 'surveillance-run:v3')) ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    concurrency:
      group: candidate-conservation-main
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Reconcile every outstanding governed intake
        id: recovery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          action_date="$(TZ=Europe/Rome date +%F)"
          python scripts/curation/recover_intake_backlog.py \
            --repository "$GITHUB_REPOSITORY" \
            --owner "$GITHUB_REPOSITORY_OWNER" \
            --ledger-issue 30 \
            --date "$action_date" \
            --output "$RUNNER_TEMP/intake-recovery.json"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          data=json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "intake-recovery.json"), encoding="utf-8"))
          print(f"added_count={data['added_candidates']}")
          print(f"processed_batches={data['processed_batches']}")
          print(f"rediscovery_count={data['rediscovery_occurrences']}")
          print(f"failure_count={len(data['failures'])}")
          print(f"quarantine_count={len(data['quarantined'])}")
          PY

      - name: Build and validate the complete preservation transaction
        id: projection
        run: |
          python scripts/build_archive.py
          python scripts/build_secondary_collections.py
          python scripts/metrics/build_research_stats.py
          python scripts/curation/build_curator_stats.py
          python scripts/curation/build_curator_options.py
          python scripts/curation/build_legacy_queue.py --check
          python scripts/validation/validate_intake_history.py --base HEAD
          python scripts/validation/validate_repository.py
          python scripts/ontology/validate_ontology.py
          python scripts/ontology/build_model_browser.py
          git diff --exit-code -- site/vocab/review-v2-model.json
          python -m unittest discover -s tests -p 'test_*.py'
          python scripts/validation/validate_archive.py
          python scripts/validation/validate_site.py
          for script in site/*.js curator-app/src/*.js; do node --check "$script"; done
          node --test curator-app/test/*.test.js
          python scripts/report_saturation.py
          if git diff --quiet HEAD -- data/curation site/data; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Persist recovered CandidateRecords
        id: persist
        if: steps.projection.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ADDED_COUNT: ${{ steps.recovery.outputs.added_count }}
          PROCESSED_BATCHES: ${{ steps.recovery.outputs.processed_batches }}
          REDISCOVERY_COUNT: ${{ steps.recovery.outputs.rediscovery_count }}
        run: |
          base_sha="$(git rev-parse HEAD)"
          branch="curation/intake-core-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add data/curation/review_queue.csv data/curation/intake_access \
            data/curation/retrieval_coverage.csv data/curation/abstract_coverage.csv \
            data/curation/access_coverage.csv site/data
          git commit -m "Preserve recovered intake candidates"
          git push origin "$branch"

          body_file="$RUNNER_TEMP/candidate-preservation-pr.md"
          {
            echo "## Candidate-preservation barrier"
            echo
            echo "- Governed batches processed: ${PROCESSED_BATCHES}"
            echo "- New operational CandidateRecords added: ${ADDED_COUNT}"
            echo "- Exact rediscovery occurrences reconciled: ${REDISCOVERY_COUNT}"
            echo "- Eligibility, canonical identity and scientific publication decisions changed: 0"
          } > "$body_file"

          pr_url=""
          set +e
          pr_url="$(gh pr create --base main --head "$branch" --title "Preserve recovered intake candidates" --body-file "$body_file" 2>"$RUNNER_TEMP/pr-create-error.log")"
          pr_status=$?
          set -e
          if [ "$pr_status" -eq 0 ]; then
            set +e
            merge_output="$(gh pr merge "$pr_url" --squash --delete-branch 2>&1)"
            merge_status=$?
            set -e
            if [ "$merge_status" -eq 0 ]; then
              echo "persisted=true" >> "$GITHUB_OUTPUT"
              echo "persistence=pr:${pr_url}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            printf '%s\n' "$merge_output" > "$RUNNER_TEMP/pr-merge-error.log"
          fi

          git fetch origin main
          current_main="$(git rev-parse origin/main)"
          if [ "$current_main" = "$base_sha" ]; then
            git push origin HEAD:main
            echo "persisted=true" >> "$GITHUB_OUTPUT"
            echo "persistence=fast-forward:${branch}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::error::CandidateRecords were staged but could not cross the persistence barrier; source intake issues remain open."
          exit 1

      - name: Mark no-data recovery as preserved
        id: nochange
        if: steps.projection.outputs.changed == 'false'
        run: |
          echo "persisted=true" >> "$GITHUB_OUTPUT"
          echo "persistence=no-data-change" >> "$GITHUB_OUTPUT"

      - name: Read back persisted candidate identities from main
        id: readback
        if: steps.persist.outputs.persisted == 'true' || steps.nochange.outputs.persisted == 'true'
        run: |
          git fetch origin main
          git show origin/main:data/curation/review_queue.csv > "$RUNNER_TEMP/persisted-queue.csv"
          git show origin/main:site/data/paper-register.json > "$RUNNER_TEMP/persisted-register.json"
          python3 - <<'PY_READBACK'
          import csv, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          report = json.loads((root/'intake-recovery.json').read_text())
          queue = {r['candidate_id'] for r in csv.DictReader((root/'persisted-queue.csv').open())}
          public = {r['id'] for r in json.loads((root/'persisted-register.json').read_text())['records']}
          added = {cid for row in report['processed'] for cid in row['added']}
          if queue != public or not added <= queue:
              raise SystemExit('Persisted queue/public projection mismatch; no intake may be finalised')
          print(f'Persisted identity read-back: {len(queue)} candidates; {len(added)} additions verified')
          PY_READBACK
          echo "verified=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"

      - name: Finalise source intake issues after persistence
        if: >-
          steps.readback.outputs.verified == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PERSISTENCE: ${{ steps.persist.outputs.persistence || steps.nochange.outputs.persistence }}
        run: |
          report="$RUNNER_TEMP/intake-recovery.json"
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          jq -c '.processed[]' "$report" | while IFS= read -r row; do
            issue="$(jq -r '.issue_number' <<<"$row")"
            batch="$(jq -r '.batch_id' <<<"$row")"
            added="$(jq '.added | length' <<<"$row")"
            skipped="$(jq '.skipped_existing | length' <<<"$row")"
            gh issue comment "$issue" --body "Candidate-preservation barrier completed for \`${batch}\`: ${added} new operational candidate(s) materialised and ${skipped} exact rediscovery occurrence(s) reconciled. Public deployment is tracked separately and is not yet claimed. No scientific eligibility or canonical duplicate decision was inferred. Persistence: ${PERSISTENCE}. Run: ${run_url}"
            gh issue close "$issue" --reason completed || true
          done

          jq -c '.quarantined[]' "$report" | while IFS= read -r row; do
            issue="$(jq -r '.issue_number' <<<"$row")"
            batch="$(jq -r '.batch_id' <<<"$row")"
            reason="$(jq -r '.reason' <<<"$row")"
            gh issue comment "$issue" --body "Candidate recovery quarantined \`${batch}\`: ${reason}. No CandidateRecord or scientific decision was created. Run: ${run_url}"
            gh issue close "$issue" --reason "not planned" || true
          done

          jq -c '.failures[]' "$report" | while IFS= read -r row; do
            issue="$(jq -r '.issue_number' <<<"$row")"
            batch="$(jq -r '.batch_id' <<<"$row")"
            error="$(jq -r '.error' <<<"$row")"
            gh issue comment "$issue" --body "Candidate preservation remains blocked for \`${batch}\`: \`${error}\`. This intake remains open and is not counted as materialised. Run: ${run_url}"
          done

      - name: Refresh operational archive
        if: steps.readback.outputs.verified == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run archive.yml --ref main

      - name: Report recovery outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
          TRIGGER_TITLE: ${{ github.event.issue.title }}
          VERIFIED: ${{ steps.readback.outputs.verified }}
          ADDED: ${{ steps.recovery.outputs.added_count }}
          PROCESSED: ${{ steps.recovery.outputs.processed_batches }}
          REDISCOVERIES: ${{ steps.recovery.outputs.rediscovery_count }}
          FAILURES: ${{ steps.recovery.outputs.failure_count }}
          QUARANTINED: ${{ steps.recovery.outputs.quarantine_count }}
          PERSISTENCE: ${{ steps.persist.outputs.persistence || steps.nochange.outputs.persistence }}
        run: |
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          materialised=0
          if [ "$VERIFIED" = "true" ]; then materialised="${ADDED:-0}"; fi
          summary="Candidate conservation: ${PROCESSED:-0} governed batch(es) processed, ${ADDED:-0} candidate(s) staged, ${materialised} CandidateRecord(s) verified on main, ${REDISCOVERIES:-0} exact rediscovery occurrence(s) reconciled, ${QUARANTINED:-0} batch(es) quarantined, ${FAILURES:-0} unresolved batch(es). Persistence: ${PERSISTENCE:-not-persisted}. Run: ${run_url}"
          if { [ "$EVENT_NAME" = "issues" ] || [ "$EVENT_NAME" = "issue_comment" ]; } && [ "$TRIGGER_TITLE" = "[MAINTENANCE][INTAKE-RECOVERY]" ] && [ -n "$TRIGGER_ISSUE" ]; then
            gh issue comment "$TRIGGER_ISSUE" --body "$summary"
            if [ "${FAILURES:-0}" = "0" ] && [ "$VERIFIED" = "true" ]; then
              gh issue close "$TRIGGER_ISSUE" --reason completed || true
            fi
          else
            echo "$summary" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Retain candidate-conservation receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-conservation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/intake-recovery.json
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce candidate-conservation invariant
        if: >-
          always() && steps.recovery.outcome == 'success' &&
          ((steps.recovery.outputs.failure_count != '' && steps.recovery.outputs.failure_count != '0') ||
           (steps.recovery.outputs.added_count != '0' && steps.readback.outputs.verified != 'true'))
        run: |
          echo "::error::Candidate conservation failed: one or more governed CandidateRecords did not cross the persistence barrier."
          exit 1
