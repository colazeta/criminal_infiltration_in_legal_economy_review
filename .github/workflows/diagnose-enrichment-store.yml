name: Diagnose enrichment store initialisation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/diagnose-enrichment-store.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: curator-production
    steps:
      # Resolve the same unique account as deployment; never activate, migrate or publish.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Read storage maxima and invocation counters with schema-discovered aggregates
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 -m scripts.architecture.storage_quota

      - name: Read closed service status without raw Worker logs
        if: always()
        env:
          CURATOR_SESSION_SECRET: ${{ secrets.CURATOR_SESSION_SECRET }}
        run: |
          python3 - <<'PYCODE'
          import json
          from scripts.enrichment.service_client import call, current_commit
          try:
              result = call('status', expected_commit=current_commit())
              print(json.dumps({key: result.get(key) for key in ['enabled', 'commit', 'storage_backend', 'counts']}))
          except RuntimeError as error:
              raise SystemExit(str(error)) from None
          PYCODE
