name: Diagnose enrichment store initialisation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/diagnose-enrichment-store.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: curator-production
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22

      - name: Capture only the failing Worker exception during one authenticated verify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CURATOR_SESSION_SECRET: ${{ secrets.CURATOR_SESSION_SECRET }}
        run: |
          set -euo pipefail
          tail_file="$RUNNER_TEMP/enrichment-tail.jsonl"
          : > "$tail_file"

          timeout 30s npx --yes wrangler@4.128.0 tail criminal-infiltration-curator \
            --format=json --status=error > "$tail_file" 2>&1 &
          tail_pid=$!
          sleep 7

          set +e
          deployed_commit="$(python3 - <<'PY'
          from scripts.enrichment.service_client import current_commit
          print(current_commit())
          PY
          )"
          python3 scripts/enrichment/service_client.py verify --expected-commit "$deployed_commit"
          probe_status=$?
          set -e

          sleep 7
          kill "$tail_pid" 2>/dev/null || true
          wait "$tail_pid" 2>/dev/null || true

          python3 - "$tail_file" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          seen = 0

          def redact(value):
              text = str(value or '')
              text = re.sub(r'https?://\S+', '<url>', text)
              text = re.sub(r'(?i)\b(?:bearer\s+)?[a-z0-9_-]*(?:token|secret|signature|session|api[_-]?key)[a-z0-9_-]*\s*[:=]\s*\S+', '<credential-redacted>', text)
              text = re.sub(r'\b[a-f0-9]{24,}\b', '<long-hex-redacted>', text, flags=re.I)
              text = re.sub(r'\b[A-Za-z0-9_-]{48,}\b', '<long-token-redacted>', text)
              return text[:1200]

          for raw in path.read_text(encoding='utf-8', errors='replace').splitlines():
              try:
                  event = json.loads(raw)
              except json.JSONDecodeError:
                  continue
              for exc in event.get('exceptions') or []:
                  print('worker_exception_name=' + redact(exc.get('name')))
                  print('worker_exception_message=' + redact(exc.get('message')))
                  seen += 1
              for log in event.get('logs') or []:
                  if str(log.get('level', '')).lower() != 'error':
                      continue
                  message = log.get('message')
                  if isinstance(message, list):
                      message = ' '.join(map(str, message))
                  print('worker_error_log=' + redact(message))
                  seen += 1
          print(f'sanitised_error_events={seen}')
          PY

          if [ "$probe_status" -eq 0 ]; then
            echo "Unexpectedly, the private verify recovered while tailing." >&2
            exit 0
          fi
          if [ ! -s "$tail_file" ]; then
            echo "No Worker tail output was captured." >&2
            exit 1
          fi
