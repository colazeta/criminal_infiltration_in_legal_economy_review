name: Resolve reviewed candidate identity blockers

on:
  push:
    branches: [main]
    paths:
      - data/curation/review_queue.csv
      - data/curation/retrieval_coverage.csv
      - data/curation/verified_identity_resolutions.json
      - scripts/curation/resolve_candidate_identity.py
      - tests/test_candidate_identity_resolution.py
      - .github/workflows/candidate-identity-resolution.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-identity-resolution
  cancel-in-progress: false

jobs:
  resolve:
    if: github.event_name != 'workflow_dispatch' || github.actor == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Apply only reviewed identity resolutions
        run: |
          action_date="$(date -u +%F)"
          python scripts/curation/resolve_candidate_identity.py \
            --date "$action_date" \
            --output "$RUNNER_TEMP/identity-resolution-summary.json"
          python scripts/curation/resolve_candidate_identity.py \
            --date "$action_date" \
            --check

      - name: Refresh deterministic curator exports
        run: |
          python scripts/curation/build_curator_stats.py
          python scripts/curation/build_curator_options.py

      - name: Validate governed repository
        run: |
          python scripts/curation/build_legacy_queue.py --check
          python scripts/validation/validate_repository.py
          python scripts/ontology/validate_ontology.py
          python -m unittest discover -s tests -p 'test_*.py'
          python scripts/build_archive.py --output-dir "$RUNNER_TEMP/archive"
          python scripts/build_secondary_collections.py --output-dir "$RUNNER_TEMP/archive"
          python scripts/metrics/build_research_stats.py --output "$RUNNER_TEMP/archive/research-stats.json"
          python scripts/curation/build_curator_stats.py --output "$RUNNER_TEMP/archive/curator-stats.json"
          python scripts/curation/build_curator_options.py --output "$RUNNER_TEMP/archive/curator-options.json"
          diff -ru "$RUNNER_TEMP/archive" site/data
          python scripts/validation/validate_archive.py
          python scripts/validation/validate_site.py
          node --check site/stats.js
          node --check site/curator.js
          node --check site/curator-queue.js
          node --check site/curator-resolved-link.js
          node --test curator-app/test/*.test.js

      - name: Detect candidate identity changes
        id: changes
        run: |
          if git diff --quiet -- \
            data/curation/review_queue.csv \
            site/data/curator-stats.json site/data/paper-register.json \
            site/data/curator-options.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open reviewed identity-resolution PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="automation/candidate-identity-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add \
            data/curation/review_queue.csv \
            site/data/curator-stats.json site/data/paper-register.json \
            site/data/curator-options.json
          git commit -m "Resolve reviewed candidate identity blocker"
          git push origin "$branch"
          head_sha="$(git rev-parse HEAD)"

          python3 - <<'PY' > "$RUNNER_TEMP/identity-resolution-body.md"
          import json
          import os

          summary = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "identity-resolution-summary.json"), encoding="utf-8"))
          print("## Reviewed candidate identity resolution")
          print()
          print(f"Safe reviewed resolutions applied: **{summary['safe_identity_resolutions']}**")
          print()
          for item in summary["resolutions"]:
              print(f"- `{item['candidate_id']}` — `{item['resolution']}`")
              if item.get("doi"):
                  print(f"  - persisted DOI: `{item['doi']}`")
              print(f"  - reviewed evidence date: `{item['checked_at']}`")
          print()
          print("This PR clears only reviewed stale operational identity blockers and advances mechanical metadata state. It makes **zero** scientific eligibility, exclusion, canonical-work merge, framework-class or publication decisions.")
          PY

          set +e
          pr_url="$(gh pr create \
            --base main \
            --head "$branch" \
            --title "Resolve reviewed candidate identity blocker" \
            --body-file "$RUNNER_TEMP/identity-resolution-body.md" 2>"$RUNNER_TEMP/pr-error.log")"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::warning::Validated identity-resolution branch was created, but PR creation was blocked."
            echo "Validated branch retained: $branch" >> "$GITHUB_STEP_SUMMARY"
            sed -n '1,20p' "$RUNNER_TEMP/pr-error.log" >> "$GITHUB_STEP_SUMMARY"
            cat > "$RUNNER_TEMP/recovery-ticket.md" <<EOF
          <!-- cile-validated-branch-recovery:1 -->
          CILE validated branch recovery ticket.

          - kind: candidate-identity-resolution
          - branch: \`$branch\`
          - head_sha: \`$head_sha\`
          - base: \`main\`
          - workflow_run_id: \`$GITHUB_RUN_ID\`
          - workflow_attempt: \`$GITHUB_RUN_ATTEMPT\`
          - state: \`validated_branch_without_pr\`

          The workflow completed validation and pushed the branch but repository policy blocked PR creation. The next authorised automation activation must first check whether a PR already exists for this exact branch/head. If not, create the PR through the authenticated GitHub connector. Do not rerun the metadata/identity work merely to obtain another branch.
          EOF
            gh issue comment 696 --body-file "$RUNNER_TEMP/recovery-ticket.md"
            exit 0
          fi
          echo "Identity-resolution PR opened for review: $pr_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Report no safe resolution
        if: steps.changes.outputs.changed != 'true'
        run: |
          echo "No reviewed candidate identity blocker is currently safe to resolve." >> "$GITHUB_STEP_SUMMARY"
