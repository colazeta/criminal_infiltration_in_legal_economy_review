name: Validate and apply private enrichment storage
on:
  push:
    branches: [implementation/paper-enrichment-20260911]
    paths: [.github/workflows/apply-private-enrichment-store.yml]
permissions:
  contents: write
jobs:
  validate:
    if: github.ref == 'refs/heads/implementation/paper-enrichment-20260911'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Apply hash-bound source patch
        run: |
          python3 - <<'PY'
          import base64,hashlib,lzma,os,subprocess
          from pathlib import Path
          patch=lzma.decompress(base64.b64decode(Path('.implementation-transfer/private-store.b64').read_text(),validate=True))
          if hashlib.sha256(patch).hexdigest()!='5bf34aad9ce1e9e1297b67e645de32ecb9a7f2c43391f7c3b688a2d676886bde': raise SystemExit('Patch integrity failure')
          if b'diff --git a/.github/' in patch: raise SystemExit('Workflow transfer prohibited')
          path=Path(os.environ['RUNNER_TEMP'])/'source.patch';path.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(path)],check=True)
          subprocess.run(['git','apply',str(path)],check=True)
          PY
          git rm .implementation-transfer/private-store.b64
          git add -A
      - name: Full regression validation
        run: |
          python3 scripts/validation/validate_repository.py
          python3 scripts/ontology/validate_ontology.py
          python3 scripts/ontology/build_model_browser.py
          git diff --exit-code -- site/vocab/review-v2-model.json
          python3 -m unittest discover -s tests -p 'test_*.py'
          node --test curator-app/test/*.test.js
          python3 scripts/build_archive.py
          python3 scripts/build_secondary_collections.py
          python3 scripts/curation/build_curator_stats.py
          python3 scripts/curation/build_curator_options.py
          python3 scripts/validation/validate_archive.py
          python3 scripts/validation/validate_site.py
          git diff --exit-code
      - name: Commit validated source only
        run: |
          python3 - <<'PY'
          import subprocess
          if any(x.startswith('.github/') for x in subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()): raise SystemExit('Unexpected workflow write')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Support isolated SQLite Workers storage with signed activation and private readback'
          git push origin HEAD:implementation/paper-enrichment-20260911
