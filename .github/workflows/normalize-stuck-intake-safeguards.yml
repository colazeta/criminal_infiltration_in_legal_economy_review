name: Normalize stuck intake safeguards

on:
  push:
    branches: [main]
    paths:
      - scripts/maintenance/normalize_stuck_intake_safeguards.py
      - .github/workflows/normalize-stuck-intake-safeguards.yml

permissions:
  contents: read
  issues: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize allow-listed intake safeguards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/maintenance/normalize_stuck_intake_safeguards.py
