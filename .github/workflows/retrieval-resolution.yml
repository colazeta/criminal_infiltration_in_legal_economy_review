name: Resolve curator paper access

on:
  push:
    branches: [main]
    paths:
      - data/curation/review_queue.csv
      - data/curation/reading_aid_overrides.json
      - scripts/curation/materialize_queue_issues.py
      - scripts/retrieval/resolve_queue.py
      - scripts/retrieval/apply_verified_reading_locators.py
      - scripts/retrieval/selected_paper_delivery.py
      - scripts/retrieval/persist_selected_support.sh
      - .github/workflows/retrieval-resolution.yml
  pull_request:
    branches: [main]
    paths:
      - data/curation/reading_aid_overrides.json
      - scripts/curation/materialize_queue_issues.py
      - scripts/retrieval/selected_paper_delivery.py
      - scripts/retrieval/persist_selected_support.sh
      - .github/workflows/retrieval-resolution.yml
  schedule:
    - cron: "20 5 * * 0"
  workflow_dispatch:

permissions:
  contents: read

# Main/scheduled/manual persistence and curator issue mutation share one repository-wide
# lane. PR preparation is branch-local and must not be stalled by an independent main
# backfill; give each reviewed PR its own bounded lane instead.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('selected-support-pr-{0}', github.event.pull_request.number) || 'curator-support-persistence' }}
  cancel-in-progress: false
  queue: max

jobs:
  resolve:
    if: >-
      (github.event_name != 'workflow_dispatch' || github.actor == github.repository_owner) &&
      (github.event_name != 'pull_request' ||
       (github.actor == github.repository_owner &&
        github.event.pull_request.user.login == github.repository_owner &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        (startsWith(github.head_ref, 'maintenance/selected-paper-') ||
         startsWith(github.head_ref, 'maintenance/parallel-search-'))))
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
      checks: read
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Checkout exact owned PR head or current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Distinguish local source support from full queue refresh
        id: refresh
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            echo "mode=local" >> "$GITHUB_OUTPUT"
          else
            echo "mode=$(python3 scripts/retrieval/selected_paper_delivery.py --refresh-mode)" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve every queue candidate and sync verified reading locators
        if: steps.refresh.outputs.mode == 'full'
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          UNPAYWALL_EMAIL: ${{ secrets.UNPAYWALL_EMAIL }}
        run: |
          action_date="$(date -u +%F)"
          python scripts/retrieval/resolve_queue.py \
            --date "$action_date" \
            --max-age-days 30 \
            --output "$RUNNER_TEMP/retrieval-summary.json"

      - name: Validate governed repository
        run: |
          python3 scripts/retrieval/selected_paper_delivery.py --prepare --validate \
            --summary "$RUNNER_TEMP/selected-support-summary.json"
          python scripts/curation/build_legacy_queue.py --check
          python scripts/retrieval/resolve_queue.py --check
          python scripts/retrieval/apply_verified_reading_locators.py --check
          node --check site/curator.js
          node --check site/curator-config.js
          node --check site/curator-reading.js
          node --check site/curator-queue.js
          node --check site/curator-resolved-link.js
          node --check curator-app/src/index.js
          node --check curator-app/src/enrichment.js
          node --check curator-app/src/worker.js
          bash -n scripts/retrieval/persist_selected_support.sh

      - name: Retain validated preparation on its owning PR branch
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$GITHUB_HEAD_REF" in
            maintenance/selected-paper-*|maintenance/parallel-search-*) ;;
            *) echo "::error::Not an owned selected-paper branch"; exit 1 ;;
          esac
          paths=(data/curation/retrieval_coverage.csv data/curation/abstract_coverage.csv site/data)
          if git diff --quiet -- "${paths[@]}"; then
            echo "Verified support already prepared on the reviewed branch." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          while IFS= read -r path; do
            case "$path" in
              data/curation/retrieval_coverage.csv|data/curation/abstract_coverage.csv|site/data/*) ;;
              *) echo "::error::Unexpected preparation path: $path"; exit 1 ;;
            esac
          done < <(git diff --name-only)
          base_sha="$(git rev-parse HEAD)"
          remote_sha="$(git ls-remote origin "refs/heads/$GITHUB_HEAD_REF" | cut -f1)"
          [ "$remote_sha" = "$base_sha" ] || { echo "::error::PR head moved; reuse and reconcile this PR"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${paths[@]}"
          git commit -m "Prepare verified reading-support projections for review"
          git push origin "HEAD:refs/heads/$GITHUB_HEAD_REF"
          prepared_head="$(git rev-parse HEAD)"
          # GITHUB_TOKEN pushes do not recursively trigger pull_request workflows.
          # workflow_dispatch is the supported exception and validates the exact new head.
          gh workflow run archive.yml --ref "$GITHUB_HEAD_REF" || {
            echo "::error::Prepared branch retained but final-head quality dispatch failed"
            exit 1
          }
          {
            echo "## Preparation retained; dispatched final-head CI"
            echo "Branch: $GITHUB_HEAD_REF"
            echo "Prepared head: $prepared_head"
            echo "Validated input: $base_sha"
            echo "Next: ordinary archive quality must finish green on the prepared head before merge."
            echo "No main write, publication, private ingestion or scientific approval occurred."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Persist validated retrieval update
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/retrieval/persist_selected_support.sh

      - name: Refresh and validate current main before issue reconciliation
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          current_main="$(git rev-parse origin/main)"
          git checkout --detach "$current_main"
          python3 scripts/validation/validate_repository.py
          python scripts/curation/build_legacy_queue.py --check
          python scripts/retrieval/resolve_queue.py --check
          python scripts/retrieval/apply_verified_reading_locators.py --check
          echo "Issue reconciliation pinned to current main: $current_main" >> "$GITHUB_STEP_SUMMARY"

      - name: Reconcile issue support after confirmed persistence or unchanged coverage
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/curation/materialize_queue_issues.py --repository "$GITHUB_REPOSITORY"
          python scripts/retrieval/sync_issue_retrieval.py --repository "$GITHUB_REPOSITORY"
          python scripts/abstracts/sync_issue_coverage.py --repository "$GITHUB_REPOSITORY"
          cat "$RUNNER_TEMP/selected-support-summary.json" >> "$GITHUB_STEP_SUMMARY"
