name: Resolve curator paper access

on:
  push:
    branches: [main]
    paths:
      - data/curation/review_queue.csv
      - data/curation/reading_aid_overrides.json
      - scripts/retrieval/resolve_queue.py
      - scripts/retrieval/apply_verified_reading_locators.py
      - scripts/retrieval/selected_paper_delivery.py
      - scripts/retrieval/persist_selected_support.sh
      - .github/workflows/retrieval-resolution.yml
  schedule:
    - cron: "20 5 * * 0"
  workflow_dispatch:

permissions:
  contents: read

# Both coverage workflows can touch the same governed support projections.
# This is not a replacement for the persistent Cloudflare minute-40 queue.
concurrency:
  group: curator-support-persistence
  cancel-in-progress: false
  queue: max

jobs:
  resolve:
    if: github.event_name != 'workflow_dispatch' || github.actor == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      checks: read
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Distinguish local source support from full queue refresh
        id: refresh
        run: echo "mode=$(python3 scripts/retrieval/selected_paper_delivery.py --refresh-mode)" >> "$GITHUB_OUTPUT"

      - name: Resolve every queue candidate and sync verified reading locators
        if: steps.refresh.outputs.mode == 'full'
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          UNPAYWALL_EMAIL: ${{ secrets.UNPAYWALL_EMAIL }}
        run: |
          action_date="$(date -u +%F)"
          python scripts/retrieval/resolve_queue.py \
            --date "$action_date" \
            --max-age-days 30 \
            --output "$RUNNER_TEMP/retrieval-summary.json"

      - name: Validate governed repository
        run: |
          python3 scripts/retrieval/selected_paper_delivery.py --prepare --validate \
            --summary "$RUNNER_TEMP/selected-support-summary.json"
          python scripts/curation/build_legacy_queue.py --check
          python scripts/retrieval/resolve_queue.py --check
          python scripts/retrieval/apply_verified_reading_locators.py --check
          node --check site/curator.js
          node --check site/curator-config.js
          node --check site/curator-reading.js
          node --check site/curator-queue.js
          node --check site/curator-resolved-link.js
          node --check curator-app/src/index.js
          node --check curator-app/src/enrichment.js
          node --check curator-app/src/worker.js
          bash -n scripts/retrieval/persist_selected_support.sh

      - name: Persist validated retrieval update
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/retrieval/persist_selected_support.sh

      - name: Reconcile issue support after confirmed persistence or unchanged coverage
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/retrieval/sync_issue_retrieval.py --repository "$GITHUB_REPOSITORY"
          python scripts/abstracts/sync_issue_coverage.py --repository "$GITHUB_REPOSITORY"
          cat "$RUNNER_TEMP/selected-support-summary.json" >> "$GITHUB_STEP_SUMMARY"
