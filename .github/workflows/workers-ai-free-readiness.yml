name: Inspect Workers AI free readiness
on:
  push:
    branches: [verification/workers-ai-free-readiness]
    paths: [.github/workflows/workers-ai-free-readiness.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: curator-production
    timeout-minutes: 5
    steps:
      - name: Read-only Cloudflare readiness with redacted aggregate output
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from urllib.request import Request, build_opener, HTTPRedirectHandler
          from urllib.error import HTTPError, URLError
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self,*args): raise RuntimeError('redirect_refused')
          http=build_opener(NoRedirect())
          token=os.environ.get('CLOUDFLARE_API_TOKEN','')
          report={'mode':'read_only','inference_calls':0,'account_changes':0,'checks':[]}
          def get(path, label):
              if not token:
                  report['checks'].append({'service':label,'status':'credential_absent'});return None
              try:
                  request=Request('https://api.cloudflare.com/client/v4/'+path,headers={'Authorization':'Bearer '+token,'Accept':'application/json','User-Agent':'cile-capability-readiness/1.0'})
                  with http.open(request,timeout=20) as response: raw=response.read(1000001)
                  if len(raw)>1000000: raise RuntimeError('response_limit')
                  data=json.loads(raw)
                  if data.get('success') is not True: raise RuntimeError('api_refusal')
                  report['checks'].append({'service':label,'status':'ok'})
                  return data.get('result')
              except HTTPError as error:
                  report['checks'].append({'service':label,'status':'http_error','code':error.code})
              except Exception:
                  report['checks'].append({'service':label,'status':'unverified'})
              return None
          account=os.environ.get('CLOUDFLARE_ACCOUNT_ID','').strip()
          if not account:
              accounts=get('accounts?per_page=50&page=1','account_discovery')
              if isinstance(accounts,list) and len(accounts)==1: account=accounts[0].get('id','')
          if re.fullmatch(r'[a-f0-9]{32}',account):
              prefix='accounts/'+account+'/'
              subscriptions=get(prefix+'subscriptions','account_subscriptions')
              if isinstance(subscriptions,list):
                  workers=[]
                  for item in subscriptions:
                      plan=item.get('rate_plan',{}) if isinstance(item,dict) else {}
                      name=' '.join(str(plan.get(key,'')) for key in ['id','public_name']).lower()
                      if 'worker' in name:
                          workers.append({'workers_plan_present':True,'explicitly_free':('free' in name),'explicitly_paid':('paid' in name or 'standard' in name),'state_active':item.get('state')=='active'})
                  report['workers_subscription_summary']=workers
                  report['subscription_count']=len(subscriptions)
                  report['free_plan_inference_permitted']=False
              catalogue=get(prefix+'ai/models/search?per_page=1','workers_ai_catalogue')
          print(json.dumps(report,indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('Read-only capability inspection. No model request, billing change, secret export or production-paper operation.\n\n```json\n'+json.dumps(report,indent=2)+'\n```\n')
          PY
