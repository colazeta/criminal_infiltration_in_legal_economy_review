name: Temporary batch 13 reconciliation

on:
  push:
    branches:
      - maintenance/parallel-search-reading-batch-13-reconciled

permissions:
  contents: write

concurrency:
  group: temporary-batch13-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout successor branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Apply bounded batch 13 reading support
        shell: bash
        run: |
          python3 - <<'PY'
          import csv
          import json
          from pathlib import Path

          root = Path('.')
          queue_path = root / 'data/curation/review_queue.csv'
          override_path = root / 'data/curation/reading_aid_overrides.json'

          with queue_path.open(encoding='utf-8', newline='') as handle:
              queue_ids = {row['candidate_id'] for row in csv.DictReader(handle)}

          additions = [
              {
                  'candidateId': 'CAND-ACADEMIC-2026-09-10-EXTRA-65282d1dbeff-003',
                  'kind': 'full_text_intro',
                  'sourceLabel': 'ANAC Working Paper 10 full-text PDF located with Parallel Search',
                  'sourceUrl': 'https://www.anticorruzione.it/documents/91439/126610/LA+PREVENZIONE+COLLABORATIVA_art_+94bis+Codice+Antimafia.pdf/464cb231-9c8f-8600-7f5c-1b8f7178a2f9?t=1694780817920',
                  'synopsis': 'The working paper analyses collaborative prevention under Article 94-bis of the Anti-Mafia Code as a business-remediation instrument, situating it alongside judicial administration and judicial control and examining its potential use for firms exposed to mafia-related conditioning while preserving business continuity.',
                  'checkedAt': '2026-09-13',
                  'note': 'Parallel Search fetched the exact ANAC Working Paper 10 PDF and matched Fabio De Tullio and the registered title. Evidence basis: full_text. The public synopsis is a concise non-verbatim summary; no private full-text ingestion, eligibility decision, canonical-identity decision or framework classification is claimed.'
              },
              {
                  'candidateId': 'CAND-ACADEMIC-2026-09-10-EXTRA-65282d1dbeff-004',
                  'kind': 'full_text_intro',
                  'sourceLabel': 'Munich Personal RePEc Archive full-text paper located with Parallel Search',
                  'sourceUrl': 'https://mpra.ub.uni-muenchen.de/9138/1/MPRA_paper_9138.pdf',
                  'synopsis': 'The paper treats mafia activity as an economic enterprise and discusses the scale and economic performance of organised crime together with the role of public policies designed to alter the incentives and conditions sustaining mafia business activity.',
                  'checkedAt': '2026-09-13',
                  'note': 'Parallel Search fetched the exact MPRA Paper 9138 full text, matching Alberto Suppa, the registered Italian title and the 2008 publication identity; the PDF also identifies the original notizie di POLITEIA article. Evidence basis: full_text. No version is silently canonicalised and no private full-text ingestion or scientific decision is claimed.'
              },
              {
                  'candidateId': 'CAND-ACADEMIC-2026-09-10-EXTRA-8af43493861b-002',
                  'kind': 'full_text_intro',
                  'sourceLabel': 'University of Chicago Law Review / Chicago Unbound full-text article located with Parallel Search',
                  'sourceUrl': 'https://chicagounbound.uchicago.edu/cgi/viewcontent.cgi?article=5018&context=uclrev',
                  'synopsis': 'The article develops an institutional account of organised crime as private ordering and tests it with extensive evidence from Japan. It argues that organised criminal groups supply protection and property-rights enforcement where formal legal institutions are inefficient and that their organisation and activities respond systematically to state law and enforcement structures.',
                  'checkedAt': '2026-09-13',
                  'note': "Parallel Search fetched the Chicago Unbound full text and institutional landing page, matching Curtis J. Milhaupt, Mark D. West, the exact title and University of Chicago Law Review 67(1), 2000. Evidence basis: full_text. The CandidateRecord's currently blank authors/year are not silently rewritten by this retrieval-only lane; metadata reconciliation remains separate. No private full-text ingestion, eligibility or canonical-identity decision is claimed."
              },
          ]

          missing = [row['candidateId'] for row in additions if row['candidateId'] not in queue_ids]
          if missing:
              raise SystemExit(f'batch13 candidates missing from current queue: {missing}')

          payload = json.loads(override_path.read_text(encoding='utf-8'))
          records = payload['records']
          by_id = {row['candidateId']: row for row in records}
          for row in additions:
              existing = by_id.get(row['candidateId'])
              if existing is None:
                  records.append(row)
              elif existing != row:
                  raise SystemExit(f"conflicting existing override for {row['candidateId']}")

          override_path.write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

          cat > tests/test_parallel_search_selected_paper_lane_batch13.py <<'PY'
          import csv
          import json
          import unittest
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]


          class ParallelSearchSelectedPaperLaneBatch13Tests(unittest.TestCase):
              def test_batch13_adds_three_existing_full_text_candidates_without_scientific_decisions(self) -> None:
                  payload = json.loads(
                      (ROOT / "data/curation/reading_aid_overrides.json").read_text(encoding="utf-8")
                  )
                  records = {row["candidateId"]: row for row in payload["records"]}
                  with (ROOT / "data/curation/review_queue.csv").open(
                      encoding="utf-8", newline=""
                  ) as handle:
                      queue_ids = {row["candidate_id"] for row in csv.DictReader(handle)}

                  anac = "CAND-ACADEMIC-2026-09-10-EXTRA-65282d1dbeff-003"
                  suppa = "CAND-ACADEMIC-2026-09-10-EXTRA-65282d1dbeff-004"
                  private_ordering = "CAND-ACADEMIC-2026-09-10-EXTRA-8af43493861b-002"

                  for candidate in (anac, suppa, private_ordering):
                      self.assertIn(candidate, queue_ids)
                      row = records[candidate]
                      self.assertEqual(row["kind"], "full_text_intro")
                      self.assertTrue(row["sourceUrl"].startswith("https://"))
                      self.assertNotIn("parallel-search", row["sourceUrl"].lower())
                      self.assertLess(len(row["synopsis"]), 900)
                      self.assertIn("Parallel Search", row["note"])
                      self.assertIn("Evidence basis: full_text", row["note"])
                      self.assertNotIn("eligible_", row["note"])

                  self.assertIn("anticorruzione.it", records[anac]["sourceUrl"])
                  self.assertIn("MPRA_paper_9138.pdf", records[suppa]["sourceUrl"])
                  self.assertIn("chicagounbound.uchicago.edu/cgi/viewcontent.cgi", records[private_ordering]["sourceUrl"])
                  self.assertIn("blank authors/year", records[private_ordering]["note"])
                  self.assertIn("metadata reconciliation", records[private_ordering]["note"])


          if __name__ == "__main__":
              unittest.main()
          PY

      - name: Run full mandatory validation
        shell: bash
        run: |
          python3 scripts/validation/validate_repository.py
          python3 scripts/ontology/validate_ontology.py
          python3 scripts/ontology/build_model_browser.py
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 scripts/build_archive.py
          python3 scripts/build_secondary_collections.py
          python3 scripts/curation/build_curator_stats.py
          python3 scripts/curation/build_curator_options.py
          python3 scripts/validation/validate_archive.py
          python3 scripts/validation/validate_site.py
          node --check site/app.js
          node --check site/aml.js
          node --check site/stats.js
          node --check site/curator.js
          node --check site/curator-config.js
          node --check site/curator-guided.js
          node --check site/model.js
          node --check site/review-v2.js
          node --check curator-app/src/index.js
          node --check curator-app/src/worker.js
          node --test curator-app/test/*.test.js
          python3 scripts/report_saturation.py

      - name: Persist reconciled batch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-batch13-reconcile.yml
          git add data/curation/reading_aid_overrides.json tests/test_parallel_search_selected_paper_lane_batch13.py
          git commit -m "Reconcile thirteenth Parallel Search reading-support batch"
          git push origin HEAD:${GITHUB_REF_NAME}
