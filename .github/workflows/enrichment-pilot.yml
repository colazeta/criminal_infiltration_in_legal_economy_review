name: Private paper extraction pilot
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Deploy curator Worker]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: private-paper-extraction-pilot
  cancel-in-progress: false
jobs:
  pilot:
    if: >-
      github.repository == 'colazeta/criminal_infiltration_in_legal_economy_review' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    environment: curator-production
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed deployed code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Set up Node for the native schema validator
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify contracts before private access
        run: |
          python3 scripts/validation/validate_repository.py
          python3 scripts/ontology/validate_ontology.py
          python3 -m unittest tests.test_enrichment_pilot tests.test_enrichment_pilot_summary tests.test_enrichment_service tests.test_enrichment_schedule_contract
          node --test curator-app/test/sealed-audit.test.js
      - name: Refuse a stale deployment before model work
        env:
          EXPECTED_DEPLOYMENT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          python3 - <<'PY'
          import os
          from scripts.enrichment.service_client import current_commit
          if current_commit() != os.environ['EXPECTED_DEPLOYMENT_SHA']:
              raise SystemExit('pilot_deployment_changed')
          PY
      - name: Run at most one unvalidated abstract pilot
        env:
          CURATOR_SESSION_SECRET: ${{ secrets.CURATOR_SESSION_SECRET }}
        run: python3 -m scripts.enrichment.pilot --submit --audit-output "$RUNNER_TEMP/pilot-audit.sealed.json"
      - name: Retain only recipient-encrypted audit ciphertext
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recipient-encrypted-pilot-audit
          path: ${{ runner.temp }}/pilot-audit.sealed.json
          if-no-files-found: ignore
          retention-days: 1
      - name: Record aggregate state without private contents
        if: always()
        env:
          CURATOR_SESSION_SECRET: ${{ secrets.CURATOR_SESSION_SECRET }}
        run: |
          python3 - <<'PY'
          from scripts.enrichment.service_client import call,current_commit
          import json
          status=call('status',expected_commit=current_commit())
          print(json.dumps({'enabled':status.get('enabled'),'counts':status.get('counts'),'scientific_extraction':status.get('scientific_extraction'),'scheduling':status.get('scheduling')}))
          PY
