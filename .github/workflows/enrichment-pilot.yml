name: Private paper extraction pilot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/enrichment/pilot.py, .github/workflows/enrichment-pilot.yml]
permissions:
  contents: read
concurrency:
  group: private-paper-extraction-pilot
  cancel-in-progress: false
jobs:
  pilot:
    if: github.repository == 'colazeta/criminal_infiltration_in_legal_economy_review' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: curator-production
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed public code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Node for the native schema validator
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify ontology and synthetic conversion tests before private access
        run: |
          python3 scripts/validation/validate_repository.py
          python3 scripts/ontology/validate_ontology.py
          python3 -m unittest tests.test_enrichment_pilot tests.test_enrichment_service
      - name: Run at most one abstract through the isolated local model
        env:
          CURATOR_SESSION_SECRET: ${{ secrets.CURATOR_SESSION_SECRET }}
        run: python3 -m scripts.enrichment.pilot --submit
      - name: Record aggregate state without private source or proposal contents
        if: always()
        env:
          CURATOR_SESSION_SECRET: ${{ secrets.CURATOR_SESSION_SECRET }}
        run: |
          python3 - <<'PY'
          from scripts.enrichment.service_client import call,current_commit
          import json
          status=call('status',expected_commit=current_commit())
          print(json.dumps({'enabled':status.get('enabled'),'counts':status.get('counts'),'scientific_extraction':status.get('scientific_extraction')}))
          PY
