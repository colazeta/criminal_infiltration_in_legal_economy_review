name: Audit invalid surveillance terminals

on:
  push:
    branches:
      - maintenance/audit-ledger-invalids-20260912

permissions:
  contents: read
  issues: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Audit every v3 ledger terminal independently
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request
          sys.path.insert(0, 'scripts/metrics')
          import fetch_surveillance_ledger as base
          import fetch_surveillance_ledger_quarantine as q

          repo = os.environ['REPOSITORY']
          token = os.environ['GH_TOKEN']
          url = f'https://api.github.com/repos/{repo}/issues/30/comments?per_page=100'
          req = urllib.request.Request(url, headers={
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          })
          with urllib.request.urlopen(req, timeout=30) as r:
              comments = json.load(r)

          invalid = []
          valid = 0
          quarantined = 0
          for c in comments:
              body = c.get('body') or ''
              if '<!-- surveillance-run:v3 -->' not in body:
                  continue
              cid = c.get('id')
              if cid in q.QUARANTINED_LEDGER_COMMENTS:
                  quarantined += 1
                  continue
              summary = body.splitlines()[0] if body.splitlines() else ''
              try:
                  base.extract_run(body)
                  valid += 1
              except Exception as exc:
                  invalid.append((cid, summary, type(exc).__name__, str(exc)))

          print(f'VALID_V3={valid}')
          print(f'QUARANTINED_V3={quarantined}')
          print(f'INVALID_V3={len(invalid)}')
          for cid, summary, typ, msg in invalid:
              print(f'INVALID id={cid} summary={summary!r} error={typ}: {msg}')
          if invalid:
              raise SystemExit(2)
          PY
