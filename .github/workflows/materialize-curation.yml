name: Materialize curator queue

on:
  push:
    branches: [main]
    paths:
      - data/curation/review_queue.csv
      - data/curation/retrieval_coverage.csv
      - scripts/curation/materialize_queue_issues.py
      - scripts/curation/sync_issue_candidate_record.py
      - scripts/retrieval/sync_issue_retrieval.py
      - tests/test_sync_issue_candidate_record.py
      - .github/workflows/materialize-curation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: materialize-curator-queue
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event_name == 'push' || github.actor == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout governed queue
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Verify deterministic legacy queue
        run: python scripts/curation/build_legacy_queue.py --check

      - name: Verify retrieval coverage when materialised
        run: |
          if [ -s data/curation/retrieval_coverage.csv ] && [ "$(wc -l < data/curation/retrieval_coverage.csv)" -gt 1 ]; then
            python scripts/retrieval/resolve_queue.py --check
          fi

      - name: Create or reconcile candidate issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/curation/materialize_queue_issues.py \
            --repository "$GITHUB_REPOSITORY"

      - name: Synchronise queue-owned candidate records and stage labels
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m scripts.curation.sync_issue_candidate_record \
            --repository "$GITHUB_REPOSITORY"

      - name: Synchronise paper retrieval metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/retrieval/sync_issue_retrieval.py \
            --repository "$GITHUB_REPOSITORY"
