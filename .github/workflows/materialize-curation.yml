name: Materialize curator queue

on:
  push:
    branches: [main]
    paths:
      - data/curation/review_queue.csv
      - data/curation/retrieval_coverage.csv
      - data/curation/reading_aids.json
      - data/curation/reading_aid_overrides.json
      - data/curation/residual_abstract_resolution.json
      - scripts/curation/materialize_queue_issues.py
      - scripts/curation/sync_issue_candidate_record.py
      - scripts/curation/sync_issue_review_support.py
      - scripts/curation/sync_issue_abstract_resolution.py
      - scripts/retrieval/sync_issue_retrieval.py
      - tests/test_sync_issue_candidate_record.py
      - tests/test_review_support.py
      - tests/test_reading_aid_overrides.py
      - tests/test_residual_abstract_resolution.py
      - tests/test_sync_issue_abstract_resolution.py
      - .github/workflows/materialize-curation.yml
  workflow_dispatch:

permissions:
  contents: read

# Share the same mutation lane as selected-paper support persistence so two
# independent workflow snapshots cannot create or reconcile curator issues at once.
concurrency:
  group: curator-support-persistence
  cancel-in-progress: false
  queue: max

jobs:
  materialize:
    if: github.event_name == 'push' || github.actor == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout governed queue
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Refresh and pin current main before issue mutation
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          current_main="$(git rev-parse origin/main)"
          git checkout --detach "$current_main"
          python3 scripts/validation/validate_repository.py
          echo "Curator issue reconciliation pinned to current main: $current_main" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify deterministic legacy queue
        run: python scripts/curation/build_legacy_queue.py --check

      - name: Verify retrieval coverage when materialised
        run: |
          if [ -s data/curation/retrieval_coverage.csv ] && [ "$(wc -l < data/curation/retrieval_coverage.csv)" -gt 1 ]; then
            python scripts/retrieval/resolve_queue.py --check
          fi

      - name: Create or reconcile candidate issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/curation/materialize_queue_issues.py \
            --repository "$GITHUB_REPOSITORY"

      - name: Synchronise queue-owned candidate records and stage labels
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m scripts.curation.sync_issue_candidate_record \
            --repository "$GITHUB_REPOSITORY"

      - name: Synchronise paper retrieval metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/retrieval/sync_issue_retrieval.py \
            --repository "$GITHUB_REPOSITORY"

      - name: Synchronise reading aids and review guidance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/curation/sync_issue_review_support.py \
            --repository "$GITHUB_REPOSITORY"

      - name: Synchronise assisted abstract resolution
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m scripts.curation.sync_issue_abstract_resolution \
            --repository "$GITHUB_REPOSITORY"
