name: Verify live private enrichment
on:
  push:
    branches: [fix/enrichment-live-readback]
    paths: [.github/workflows/enrichment-live-check.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    environment: curator-production
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate Python service syntax
        run: python3 -m py_compile scripts/enrichment/service_client.py
      - name: Verify exact deployed private storage before activation
        env:
          CURATOR_SESSION_SECRET: ${{ secrets.CURATOR_SESSION_SECRET }}
        run: |
          python3 - <<'PY'
          from scripts.enrichment.service_client import call, current_commit
          import json
          commit=current_commit()
          if commit!='659dc8718832c9df7411473639208d2a49a70dd2': raise SystemExit('Deployment moved; inspect before activation')
          receipt=call('verify',expected_commit=commit)
          if receipt.get('verified') is not True: raise SystemExit('Private readback not verified')
          print(json.dumps({'operation':'verify','receipt':receipt}))
          print(json.dumps({'operation':'activate','receipt':call('activate',expected_commit=commit)}))
          for _ in range(4):
              print(json.dumps({'operation':'run','receipt':call('run',expected_commit=commit)}))
          print(json.dumps({'operation':'status','receipt':call('status',expected_commit=commit)}))
          PY
