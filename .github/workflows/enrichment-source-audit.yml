name: Enrichment source audit
on:
  push:
    branches: [maintenance/enrichment-completion-20260911]
    paths: [.github/workflows/enrichment-source-audit.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout public source without retained credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Archive tracked public files only
        run: git archive HEAD -o "$RUNNER_TEMP/source.tar"
      - name: Retain public source for the local test environment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: enrichment-source-audit
          path: ${{ runner.temp }}/source.tar
          retention-days: 1
