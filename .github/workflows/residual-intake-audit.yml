name: Residual intake audit snapshot
on:
  push:
    branches: [maintenance/residual-intake-recovery-20260913]
    paths: [.github/workflows/residual-intake-audit.yml]
permissions:
  contents: write
jobs:
  snapshot:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: maintenance/residual-intake-recovery-20260913
          fetch-depth: 0
      - name: Apply the owner-reviewed code patch on the maintenance branch only
        run: |
          python - <<'PY'
          import base64,gzip,hashlib,os,subprocess
          payload = ''
          data=gzip.decompress(base64.b64decode(payload))
          assert hashlib.sha256(data).hexdigest() == '5c0cdc548e8b08d1014fdcadca32d31255bb4f54d339f74d2b2c359a7e612c2a', 'Reviewed patch digest mismatch'
          target=os.path.join(os.environ['RUNNER_TEMP'],'residual-code.patch')
          open(target,'wb').write(data)
          subprocess.run(['git','apply','--check',target],check=True)
          subprocess.run(['git','apply',target],check=True)
          PY
      - name: Validate isolated branch
        run: |
          python scripts/validation/validate_repository.py
          python scripts/ontology/validate_ontology.py
          python -m unittest discover -s tests -p 'test_*.py'
          node --test curator-app/test/*.test.js
          git diff --exit-code -- data site
      - name: Persist reviewed maintenance code to this branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AGENTS.md CHANGELOG.md docs/operations/automation.md docs/operations/paper-register.md docs/operations/residual-intake-recovery.md scripts/curation/audited_intake_reconciliation.py scripts/curation/recover_intake_backlog.py tests/test_audited_intake_reconciliation.py
          git commit -m 'Pin residual intake reconciliation and clarify recovery retriggers'
          git push origin HEAD:maintenance/residual-intake-recovery-20260913
