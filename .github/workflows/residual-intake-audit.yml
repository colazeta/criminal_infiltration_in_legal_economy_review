name: Residual intake audit snapshot
on:
  push:
    branches: [maintenance/residual-intake-recovery-20260913]
    paths: [.github/workflows/residual-intake-audit.yml]
permissions:
  contents: write
jobs:
  snapshot:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: maintenance/residual-intake-recovery-20260913
          fetch-depth: 0
      - name: Apply exact reviewed edits to the isolated maintenance branch
        run: |
          python - <<'PY'
          from pathlib import Path
          def replace(path, old, new):
              p=Path(path);t=p.read_text();assert t.count(old)==1,(path,'context changed');p.write_text(t.replace(old,new))
          def append(path, text):
              p=Path(path);p.write_text(p.read_text()+text)
          expr=lambda name: chr(36)+'{{ '+name+' }}'
          replace('scripts/curation/recover_intake_backlog.py',
              'from scripts.curation.import_intake_issue import parse_intake_issue, read_queue  # noqa: E402',
              'from scripts.curation.import_intake_issue import parse_intake_issue, read_queue  # noqa: E402\nfrom scripts.curation.audited_intake_reconciliation import audited_occurrences  # noqa: E402')
          replace('scripts/curation/recover_intake_backlog.py',
              '    novel, skipped = reconcile_candidates_stable_first(\n        root, queue, list(manifest["candidates"])\n    )',
              '    remaining, audited = audited_occurrences(issue, queue, list(manifest["candidates"]))\n    novel, skipped = reconcile_candidates_stable_first(root, queue, remaining)\n    skipped.extend(audited)')
          replace('docs/operations/paper-register.md',
              'New discovery uses operational protocol CILE-DAILY-v4, run and both intake manifests version 3, Exa only, with the',
              'New discovery uses operational protocol CILE-DAILY-v5, run and both intake manifests version 3, Exa primary with the governed full Parallel Search fallback after an evidenced provider limit, and the')
          replace('docs/operations/paper-register.md',
              'by completion of `Stage daily intake in curator queue` on main.',
              'by completion of `Recover intake backlog` on main or its explicit archive dispatch.')
          p=Path('docs/operations/automation.md');t=p.read_text();start=t.index('This boundary applies to the external surveillance task.');end=t.index('\n## Batch contract',start)
          t=t[:start]+'''This boundary applies to the external surveillance task. After that task has
          persisted a valid intake and authenticated terminal, the repository-owned
          `recover-intake-backlog.yml` is the sole automatic CandidateRecord writer. The
          issue-open `intake-to-curation.yml` path is read-only. Recovery mechanically
          persists the queue, minimal coverage and closed public projection together;
          optional network enrichment is downstream and cannot withhold preservation.
          This technical persistence is not scientific approval or canonical publication.
          For owner-directed repair, use the authenticated `/recover-intake` comment on
          canonical maintenance issue #362 after checking actual active recovery runs.
          An open issue alone is not a lease. See [residual recovery](residual-intake-recovery.md).
          '''+t[end:];p.write_text(t.replace('ontology profile 0.3.0','ontology profile 0.4.1'))
          append('AGENTS.md','''
          ## Maintenance retrigger clarification — 2026-09-13

          The canonical recovery request is issue #362. When recovery is needed and no
          actual recovery job is queued or in progress, the owner may comment exactly
          `/recover-intake` on that issue to activate the existing sole writer. Do not treat
          an open maintenance issue as an active lease or create a duplicate request.
          See docs/operations/residual-intake-recovery.md. Evidence-pinned historical
          occurrence reconciliation cannot create candidates or fabricate a run terminal.
          ''')
          append('CHANGELOG.md','''
          ### Fixed — 2026-09-13, residual intake recovery

          - Re-enable the existing hourly :40 discovery task; no duplicate scheduler.
          - Add an exact owner-only `/recover-intake` command on canonical request #362 so
            a stale open issue cannot suppress a real retry; retain structured recovery receipts.
          - Reconcile only two evidence-pinned #225 occurrences to existing CandidateRecords,
            preserving the original body, author variant and absent-terminal history.
          - Independently reacquire the missing #225 article through real validated intake
            #579; do not whitelist it away or infer scientific acceptance.
          - Correct outdated writer/provider instructions and add fail-closed regression tests.
          ''')
          p=Path('.github/workflows/recover-intake-backlog.yml');t=p.read_text()
          old="      (github.event_name == 'issue_comment' &&\n       github.event.issue.number == 30 &&"
          new="      (github.event_name == 'issue_comment' &&\n       github.actor == github.repository_owner &&\n       github.event.comment.user.login == github.repository_owner &&\n       github.event.issue.user.login == github.repository_owner &&\n       github.event.issue.number == 362 &&\n       github.event.issue.title == '[MAINTENANCE][INTAKE-RECOVERY]' &&\n       github.event.comment.body == '/recover-intake') ||\n"+old
          assert t.count(old)==1;t=t.replace(old,new)
          old='          TRIGGER_ISSUE: '+expr('github.event.issue.number')+'\n          VERIFIED:'
          new='          TRIGGER_ISSUE: '+expr('github.event.issue.number')+'\n          TRIGGER_TITLE: '+expr('github.event.issue.title')+'\n          VERIFIED:'
          assert t.count(old)==1;t=t.replace(old,new)
          old='          if [ "$EVENT_NAME" = "issues" ] && [ -n "$TRIGGER_ISSUE" ]; then'
          new='          if { [ "$EVENT_NAME" = "issues" ] || [ "$EVENT_NAME" = "issue_comment" ]; } && [ "$TRIGGER_TITLE" = "[MAINTENANCE][INTAKE-RECOVERY]" ] && [ -n "$TRIGGER_ISSUE" ]; then'
          assert t.count(old)==1;t=t.replace(old,new)
          old='      - name: Enforce candidate-conservation invariant'
          new='      - name: Retain candidate-conservation receipt\n        if: always()\n        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4\n        with:\n          name: candidate-conservation-'+expr('github.run_id')+'-'+expr('github.run_attempt')+'\n          path: '+expr('runner.temp')+'/intake-recovery.json\n          if-no-files-found: warn\n          retention-days: 30\n\n'+old
          assert t.count(old)==1;p.write_text(t.replace(old,new))
          PY
      - name: Validate isolated branch
        run: |
          python scripts/validation/validate_repository.py
          python scripts/ontology/validate_ontology.py
          python -m unittest discover -s tests -p 'test_*.py'
          node --test curator-app/test/*.test.js
          git diff --exit-code -- data site
      - name: Persist maintenance code and export an unreferenced workflow blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AGENTS.md CHANGELOG.md docs/operations/automation.md docs/operations/paper-register.md scripts/curation/recover_intake_backlog.py
          git commit -m 'Wire evidence-pinned reconciliation and clarify recovery instructions'
          git push origin HEAD:maintenance/residual-intake-recovery-20260913
          mkdir -p "$RUNNER_TEMP/residual-repair-receipt"
          git rev-parse HEAD > "$RUNNER_TEMP/residual-repair-receipt/branch-head.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/residual-repair-receipt/branch-tree.txt"
          python - <<'PY'
          import json,os
          from pathlib import Path
          data=Path('.github/workflows/recover-intake-backlog.yml').read_text()
          Path(os.environ['RUNNER_TEMP'],'workflow-blob-input.json').write_text(json.dumps({'encoding':'utf-8','content':data}))
          PY
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input "$RUNNER_TEMP/workflow-blob-input.json" --jq .sha > "$RUNNER_TEMP/residual-repair-receipt/workflow-blob.txt"
          cp .github/workflows/recover-intake-backlog.yml "$RUNNER_TEMP/residual-repair-receipt/recover-intake-backlog.yml"
          git archive --format=tar HEAD > "$RUNNER_TEMP/residual-repair-receipt/branch.tar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: residual-repair-receipt
          path: ${{ runner.temp }}/residual-repair-receipt
          retention-days: 1
