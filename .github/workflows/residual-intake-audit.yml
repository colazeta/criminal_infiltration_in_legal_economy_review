name: Residual intake audit snapshot
on:
  push:
    branches: [maintenance/residual-intake-recovery-20260913]
    paths: [.github/workflows/residual-intake-audit.yml]
permissions:
  contents: write
jobs:
  snapshot:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout isolated maintenance branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: maintenance/residual-intake-recovery-20260913
          fetch-depth: 0
      - name: Apply and validate the immutable reviewed preparation scripts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import re,subprocess,textwrap
          source=subprocess.check_output(['git','show','1dd4fed56bd1443a264ebd1518dda1b7434c3779:.github/workflows/residual-intake-audit.yml'],text=True)
          scripts=re.findall(r'^        run: \|\n((?:(?:          .*|)\n)*)',source,re.M)
          assert len(scripts)==3, 'Unexpected reviewed preparation structure'
          for script in scripts:
              subprocess.run(['bash','-e','-o','pipefail','-c',textwrap.dedent(script)],check=True)
          PY
      - name: Export validation receipt and workflow blob identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: residual-repair-receipt
          path: ${{ runner.temp }}/residual-repair-receipt
          retention-days: 1
