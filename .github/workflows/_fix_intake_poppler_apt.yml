name: Fix intake poppler apt resilience

on:
  push:
    branches:
      - fix/intake-poppler-apt-retry

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/intake-poppler-apt-retry
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Apply workflow fix and remove temporary maintenance files
        run: |
          python3 scripts/maintenance/fix_intake_poppler_apt.py
          rm scripts/maintenance/fix_intake_poppler_apt.py
          rm .github/workflows/_fix_intake_poppler_apt.yml
      - name: Validate repository workflow guards
        run: python3 scripts/validation/validate_repository.py
      - name: Commit workflow fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden intake poppler installation"
          git push origin HEAD:fix/intake-poppler-apt-retry
