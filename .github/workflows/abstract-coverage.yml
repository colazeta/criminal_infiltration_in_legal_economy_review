name: Backfill curator abstract coverage

on:
  push:
    branches: [main]
    paths:
      - data/curation/review_queue.csv
      - data/curation/retrieval_coverage.csv
      - data/curation/reading_aids.json
      - data/curation/reading_aid_overrides.json
      - curator-app/src/enrichment.js
      - curator-app/src/scholarly-providers.js
      - curator-app/src/resolved-abstract.js
      - scripts/abstracts/backfill_coverage.mjs
      - scripts/abstracts/promote_verified_sources.mjs
      - scripts/abstracts/sync_issue_coverage.py
      - scripts/retrieval/selected_paper_delivery.py
      - scripts/retrieval/persist_selected_support.sh
      - .github/workflows/abstract-coverage.yml
  schedule:
    - cron: "50 5 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: curator-support-persistence
  cancel-in-progress: false
  queue: max

jobs:
  backfill:
    if: github.event_name != 'workflow_dispatch' || github.actor == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
      checks: read
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Distinguish local source support from full queue refresh
        id: refresh
        run: echo "mode=$(python3 scripts/retrieval/selected_paper_delivery.py --refresh-mode)" >> "$GITHUB_OUTPUT"

      - name: Ensure local PDF text extractor
        if: steps.refresh.outputs.mode == 'full'
        run: |
          if ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends poppler-utils
          fi
          pdftotext -v 2>&1 | head -n 1

      - name: Backfill every queue candidate
        if: steps.refresh.outputs.mode == 'full'
        env:
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          CORE_API_KEY: ${{ secrets.CORE_API_KEY }}
          UNPAYWALL_EMAIL: ${{ secrets.UNPAYWALL_EMAIL }}
        run: |
          export ABSTRACT_COVERAGE_DATE="$(date -u +%F)"
          node scripts/abstracts/backfill_coverage.mjs \
            --summary "$RUNNER_TEMP/abstract-coverage-summary.json"

      - name: Validate governed repository
        run: |
          python3 scripts/retrieval/selected_paper_delivery.py --prepare --validate \
            --summary "$RUNNER_TEMP/selected-support-summary.json"
          python scripts/curation/build_legacy_queue.py --check
          node scripts/abstracts/backfill_coverage.mjs --check
          python scripts/retrieval/apply_verified_reading_locators.py --check
          node --check scripts/abstracts/backfill_coverage.mjs
          node --check scripts/abstracts/promote_verified_sources.mjs
          node --check curator-app/src/enrichment.js
          node --check curator-app/src/scholarly-providers.js
          node --check curator-app/src/resolved-abstract.js
          bash -n scripts/retrieval/persist_selected_support.sh

      - name: Persist validated abstract coverage
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/retrieval/persist_selected_support.sh

      - name: Reconcile issue metadata after confirmed persistence or unchanged coverage
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/abstracts/sync_issue_coverage.py --repository "$GITHUB_REPOSITORY"
          python scripts/retrieval/sync_issue_retrieval.py --repository "$GITHUB_REPOSITORY"
          cat "$RUNNER_TEMP/selected-support-summary.json" >> "$GITHUB_STEP_SUMMARY"
