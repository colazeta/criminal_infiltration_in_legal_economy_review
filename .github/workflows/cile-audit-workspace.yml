name: CILE audit workspace snapshot
on:
  push:
    branches: [maintenance/cile-audit-closure-20260914]
    paths: [.github/workflows/cile-audit-workspace.yml]
permissions:
  contents: write
jobs:
  materialise:
    if: github.repository == 'colazeta/criminal_infiltration_in_legal_economy_review' && github.ref == 'refs/heads/maintenance/cile-audit-closure-20260914'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Recover exact patch and preserve current main
        run: |
          python3 - <<'PY'
          import base64,hashlib,lzma,os,pathlib,subprocess
          expected={'0':'7d9a8ad8da55bd437eedbe9d312ad036d856a51589bcd37b54ba5657666e91fd','1':'733de56515f32beb74a356e8d6906247102532b146b5d7bab645b5b87823f842','2a':'ffcaa6fd7886f315e974be368f19ddad366a1070f5772bc5378dbbc27c25f9e2','2b':'64e0b916301247ab93861db5df64adc93b75def6e672f571befa1ea3685093cf','3':'557cea5bb6cd82996812a5fb5439b67e209c5758864bf9d22cd9ad98b5d503a8'}
          chunks=[]
          for key,digest in expected.items():
              value=pathlib.Path('.cile-audit-transfer-'+key+'.b64').read_text().strip()
              assert hashlib.sha256(value.encode()).hexdigest()==digest
              chunks.append(value)
          decoder=lzma.LZMADecompressor(memlimit=256*1024*1024)
          patch=decoder.decompress(base64.b64decode(''.join(chunks),validate=True),max_length=1000000)
          assert decoder.eof and not decoder.unused_data and len(patch)==231147
          assert hashlib.sha256(patch).hexdigest()=='266ef02124fb312556b4eb04436a8eef337fe9a7b586033ec81a9bef42a09a0a'
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'audit-recovery';out.mkdir()
          (out/'original-audited.diff').write_bytes(patch)
          subprocess.run(['git','apply','--check',str(out/'original-audited.diff')],check=True)
          subprocess.run(['git','apply',str(out/'original-audited.diff')],check=True)
          for key in expected:pathlib.Path('.cile-audit-transfer-'+key+'.b64').unlink()
          pathlib.Path('.github/workflows/cile-audit-workspace.yml').unlink()
          subprocess.run(['git','config','user.name','CILE maintenance recovery'],check=True)
          subprocess.run(['git','config','user.email','maintenance@invalid.example'],check=True)
          subprocess.run(['git','add','-A'],check=True)
          subprocess.run(['git','commit','-m','Recover existing audit implementation locally for inspection'],check=True)
          subprocess.run(['git','merge','--no-edit','origin/main'],check=True)
          subprocess.run(['git','archive','--format=tar','-o',str(out/'workspace.tar'),'HEAD'],check=True)
          (out/'final.diff').write_bytes(subprocess.check_output(['git','diff','origin/main','HEAD']))
          (out/'changed-files.txt').write_bytes(subprocess.check_output(['git','diff','--name-status','origin/main','HEAD']))
          PY
      - name: Validate recovered maintenance tree
        run: |
          set -euo pipefail
          python3 scripts/validation/validate_repository.py
          python3 scripts/ontology/validate_ontology.py
          python3 scripts/ontology/build_model_browser.py
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 scripts/build_archive.py
          python3 scripts/build_secondary_collections.py
          python3 scripts/curation/build_curator_stats.py
          python3 scripts/curation/build_curator_options.py
          python3 scripts/validation/validate_archive.py
          python3 scripts/validation/validate_site.py
          for file in site/app.js site/aml.js site/stats.js site/curator.js site/curator-config.js site/curator-guided.js site/model.js site/review-v2.js curator-app/src/index.js curator-app/src/worker.js site/paper-register.js site/paper-sheet-research.js site/enrichment.js site/enrichment-statistics.js curator-app/src/enrichment-assets.js; do node --check "$file"; done
          node --test curator-app/test/*.test.js
          python3 scripts/report_saturation.py
          python3 scripts/retrieval/selected_paper_delivery.py --check
          git diff --exit-code
      - name: Stage source-only tree without changing any branch or workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess,urllib.request,urllib.error
          def git(*a):return subprocess.check_output(['git',*a]).decode().strip()
          repo=os.environ['GITHUB_REPOSITORY'];assert repo=='colazeta/criminal_infiltration_in_legal_economy_review'
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'audit-recovery'
          base=git('rev-parse','origin/main');base_tree=git('rev-parse','origin/main^{tree}')
          changes=[line.split('\t') for line in git('diff','--name-status','origin/main','HEAD').splitlines()]
          assert 1<=len(changes)<=80
          entries=[];deferred=[]
          for status,path in changes:
              assert status in ('A','M') and not path.startswith('data/')
              if path.startswith('.github/workflows/'):
                  assert path=='.github/workflows/deploy-curator-worker.yml';deferred.append(path);continue
              assert path in ('AGENTS.md','README.md','config/verified-document-seed.json') or path.startswith(('curator-app/','docs/operations/','ontology/modules/','schema/','scripts/','site/','tests/'))
              data=pathlib.Path(path).read_bytes();assert len(data)<1000000
              entries.append({'path':path,'mode':'100644','type':'blob','content':data.decode('utf-8')})
          body=json.dumps({'base_tree':base_tree,'tree':entries}).encode()
          request=urllib.request.Request('https://api.github.com/repos/'+repo+'/git/trees',data=body,method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','User-Agent':'cile-source-only-staging'})
          try:
              with urllib.request.urlopen(request,timeout=60) as response:result=json.load(response)
          except urllib.error.HTTPError as error:
              print('Source-only staging refused:',error.code,error.read(1000).decode('utf-8','replace'));raise SystemExit(1)
          receipt={'base_commit':base,'base_tree':base_tree,'source_tree':result['sha'],'trigger_head':os.environ['GITHUB_SHA'],'deferred_workflow_paths':deferred,'branch_updated':False,'scientific_acceptance':False,'files':{e['path']:hashlib.sha256(e['content'].encode()).hexdigest() for e in entries}}
          (out/'source-tree-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps({k:v for k,v in receipt.items() if k!='files'},indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cile-audit-recovery-workspace
          path: ${{ runner.temp }}/audit-recovery
          retention-days: 3
          if-no-files-found: error
