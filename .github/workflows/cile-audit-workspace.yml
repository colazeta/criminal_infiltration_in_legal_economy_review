name: CILE audit workspace snapshot
on:
  push:
    branches: [maintenance/cile-audit-closure-20260914]
    paths: [.github/workflows/cile-audit-workspace.yml, .cile-audit-review-fix.py]
permissions:
  contents: write
jobs:
  materialise:
    if: github.repository == 'colazeta/criminal_infiltration_in_legal_economy_review' && github.ref == 'refs/heads/maintenance/cile-audit-closure-20260914'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Apply the reviewed corrections locally
        run: |
          python3 .cile-audit-review-fix.py
          rm .cile-audit-review-fix.py .github/workflows/cile-audit-workspace.yml
          git diff --check
          python3 scripts/ontology/validate_ontology.py
          python3 -m unittest discover -s tests -p 'test_*.py'
          node --test curator-app/test/*.test.js
      - name: Stage source blobs only, never a branch or workflow change
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,urllib.request
          repo=os.environ['GITHUB_REPOSITORY'];assert repo=='colazeta/criminal_infiltration_in_legal_economy_review'
          paths=['curator-app/src/completion-policy.js','curator-app/src/enrichment-adjudication.js','curator-app/test/enrichment-adjudication.test.js','ontology/modules/completion-policy.json','scripts/query_checkpoint.py','tests/test_query_checkpoint.py','tests/test_delivery_contracts.py','docs/operations/two-lane-delivery.md','.github/workflows/deploy-curator-worker.yml']
          def api(path,payload):
              req=urllib.request.Request('https://api.github.com/repos/'+repo+path,data=json.dumps(payload).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/json','Accept':'application/vnd.github+json','User-Agent':'cile-review-source-staging'})
              with urllib.request.urlopen(req,timeout=30) as response:return json.load(response)
          entries=[];blobs={};hashes={}
          for path in paths:
              raw=pathlib.Path(path).read_bytes();hashes[path]=hashlib.sha256(raw).hexdigest()
              blob=api('/git/blobs',{'content':raw.decode(),'encoding':'utf-8'})['sha'];blobs[path]=blob
              if not path.startswith('.github/workflows/'):
                  entries.append({'path':path,'mode':'100644','type':'blob','sha':blob})
          tree=api('/git/trees',{'base_tree':'9bada89d34abb66b6fb0dba68e606acee3d1d482','tree':entries})['sha']
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'review-staging';out.mkdir()
          (out/'receipt.json').write_text(json.dumps({'source_tree':tree,'blobs':blobs,'hashes':hashes,'trigger_head':os.environ['GITHUB_SHA'],'branch_updated':False,'scientific_acceptance':False},indent=2)+'\n')
          print('SOURCE_TREE='+tree)
          print('WORKFLOW_BLOB='+blobs['.github/workflows/deploy-curator-worker.yml'])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cile-reviewed-source-staging
          path: ${{ runner.temp }}/review-staging
          retention-days: 3
          if-no-files-found: error
