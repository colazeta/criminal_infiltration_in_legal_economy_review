name: Validate paper enrichment
on:
  pull_request:
    paths: ["curator-app/**", "schema/paper-enrichment.schema.json", "ontology/**", "site/enrichment*", "scripts/enrichment/**", ".github/workflows/paper-enrichment.yml"]
  push:
    branches: [main]
    paths: ["curator-app/**", "schema/paper-enrichment.schema.json", "ontology/**", "site/enrichment*", "scripts/enrichment/**", ".github/workflows/paper-enrichment.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
      - name: Validate contracts and regression tests without provider calls
        run: |
          python3 scripts/validation/validate_repository.py
          python3 scripts/ontology/validate_ontology.py
          python3 scripts/ontology/build_model_browser.py
          git diff --exit-code -- site/vocab/review-v2-model.json
          python3 -m unittest discover -s tests -p 'test_*.py'
          node --test curator-app/test/*.test.js
          node --check site/enrichment.js
