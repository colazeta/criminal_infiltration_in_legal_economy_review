name: Validate paper enrichment
on:
  pull_request:
    paths: ["curator-app/**", "schema/paper-enrichment.schema.json", "ontology/**", "site/enrichment*", "scripts/enrichment/**", "scripts/reading/**", "site/reading-snapshot*", ".github/workflows/paper-enrichment.yml"]
  push:
    branches: [main]
    paths: ["curator-app/**", "schema/paper-enrichment.schema.json", "ontology/**", "site/enrichment*", "scripts/enrichment/**", "scripts/reading/**", "site/reading-snapshot*", ".github/workflows/paper-enrichment.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
      - name: Validate contracts and regression tests without provider calls
        run: |
          python3 scripts/validation/validate_repository.py
          python3 scripts/ontology/validate_ontology.py
          python3 scripts/ontology/build_model_browser.py
          git diff --exit-code -- site/vocab/review-v2-model.json
          python3 -m unittest discover -s tests -p 'test_*.py'
          node --test curator-app/test/*.test.js
          node --check site/enrichment.js
  reading_preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
    steps:
      - name: Checkout public source without retained credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
      - name: Build existing public support
        run: python3 scripts/curation/build_curator_stats.py
      - name: Compile a read-only preview from existing public research
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/reading/build-public-snapshot.mjs "$RUNNER_TEMP/reading-preview/reading-snapshot.json"
      - name: Preserve the exact public source used by the preview
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/reading-preview"
          tar --exclude=.git --exclude=node_modules -czf "$RUNNER_TEMP/reading-preview/public-source.tar.gz" .
      - name: Upload public preview and mechanical reconciliation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reading-preview
          path: ${{ runner.temp }}/reading-preview
          retention-days: 7
          if-no-files-found: error
