name: Paper enrichment
on:
  push:
    branches: [implementation/paper-enrichment-20260911]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Baseline checks
        run: |
          python3 scripts/validation/validate_repository.py
          python3 scripts/ontology/validate_ontology.py
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Package tracked public source for implementation audit
        if: always()
        run: git archive HEAD -o "$RUNNER_TEMP/public-source.tar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: enrichment-public-source
          path: ${{ runner.temp }}/public-source.tar
          retention-days: 1
