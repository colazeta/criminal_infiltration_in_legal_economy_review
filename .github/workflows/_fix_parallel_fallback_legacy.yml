name: Fix Parallel Search fallback legacy compatibility

on:
  push:
    branches:
      - method/exa-parallel-search-fallback

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: method/exa-parallel-search-fallback
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Apply compatibility fix and remove temporary maintenance files
        run: |
          python3 scripts/maintenance/fix_parallel_fallback_legacy.py
          rm scripts/maintenance/fix_parallel_fallback_legacy.py
          rm .github/workflows/_fix_parallel_fallback_legacy.yml
      - name: Run targeted surveillance tests
        run: |
          python3 -m unittest tests.test_parallel_search_fallback
          python3 -m unittest tests.test_surveillance_metrics
          python3 -m unittest tests.test_intake_open_access
      - name: Commit compatibility fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preserve legacy surveillance provenance"
          git push origin HEAD:method/exa-parallel-search-fallback
