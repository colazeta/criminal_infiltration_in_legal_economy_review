name: Build archive

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: archive-${{ github.ref }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Validate repository and tests
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          python scripts/validation/validate_repository.py
          python scripts/validation/validate_archive.py
          python scripts/validation/validate_site.py
          node --check scripts/abstracts/backfill_coverage.mjs
          node --check scripts/expansion/citation_frontier.mjs
          node --check site/app.js
          node --check site/aml.js
          node --check site/stats.js
          node --check site/bibliometrics.js
          node --check site/curator.js
          node --check site/curator-config.js
          node --check site/curator-guided.js
          node --check site/model.js
          node --check site/review-v2.js
          node --check site/curator-consensus.js
          node --check site/curator-reading.js
          node --check site/curator-assisted-resolution.js
          node --check site/curator-queue.js
          node --check site/curator-resolved-link.js
          node --check curator-app/src/index.js
          node --check curator-app/src/enrichment.js
          node --check curator-app/src/scholarly-providers.js
          node --check curator-app/src/open-scholarly-providers.js
          node --check curator-app/src/metadata-reconciliation.js
          node --check curator-app/src/citation-chasing.js
          node --check curator-app/src/provider-budget.js
          node --check curator-app/src/provider-readiness.js
          node --check curator-app/src/web-capability-resolver.js
          node --check curator-app/src/free-web-search.js
          node --check curator-app/src/resolved-abstract.js
          node --check curator-app/src/worker.js
          node --test curator-app/test/*.test.js

      - name: Verify deterministic committed export
        run: |
          tmp_dir="$(mktemp -d)"
          cp -R site/data "$tmp_dir/site-data-before"
          python scripts/archive/build_archive.py
          python scripts/archive/build_access_coverage.py
          python scripts/archive/build_abstract_coverage.py
          python scripts/archive/build_retrieval_coverage.py
          diff -ru "$tmp_dir/site-data-before" site/data
          git diff --exit-code -- data/curation/retrieval_coverage.csv data/curation/abstract_coverage.csv site/data

      - name: Audit selected-paper delivery state without inferring scientific approval
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            python3 scripts/retrieval/selected_paper_delivery.py --prepare \
              --summary "$RUNNER_TEMP/selected-support-pr-audit.json"
            prepared="$(git diff --name-only)"
            unexpected="$(printf '%s\n' "$prepared" | grep -Ev '^(data/curation/(retrieval_coverage|abstract_coverage)\.csv|site/data/)$' || true)"
            if [ -n "$unexpected" ]; then
              echo "::error::Selected-paper preparation changed unexpected paths"
              printf '%s\n' "$unexpected"
              exit 1
            fi
            if [ -n "$prepared" ]; then
              echo "::error::Selected-paper projections are not committed on this head"
              printf '%s\n' "$prepared"
              echo "Materialise the deterministic support projections and rerun quality on the resulting head."
              exit 1
            fi
          else
            python3 scripts/retrieval/selected_paper_delivery.py --check
          fi

  deploy:
    concurrency:
      group: archive-pages
      cancel-in-progress: false
      queue: max
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb75 # v4
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
