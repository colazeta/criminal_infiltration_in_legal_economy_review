name: Validate and publish archive

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: archive-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Validate repository and tests
        run: |
          python scripts/validation/validate_repository.py
          python -m unittest discover -s tests -p 'test_*.py'
          python scripts/report_saturation.py

      - name: Verify deterministic committed export
        run: |
          python scripts/build_archive.py --output-dir "$RUNNER_TEMP/archive"
          python scripts/metrics/build_research_stats.py --output "$RUNNER_TEMP/archive/research-stats.json"
          python scripts/curation/build_curator_stats.py --output "$RUNNER_TEMP/archive/curator-stats.json"
          diff -ru "$RUNNER_TEMP/archive" site/data
          python scripts/validation/validate_archive.py
          python scripts/validation/validate_site.py
          node --check site/app.js
          node --check site/stats.js
          node --check site/curator.js

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Fetch validated daily research metrics
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LEDGER_AUTHOR: ${{ github.repository_owner }}
        run: |
          python scripts/metrics/fetch_surveillance_ledger.py \
            --repository "$GITHUB_REPOSITORY" \
            --issue 30 \
            --allowed-author "$LEDGER_AUTHOR" \
            --output "$RUNNER_TEMP/surveillance-ledger.json"

      - name: Build release artifact
        run: |
          python scripts/build_archive.py
          python scripts/metrics/build_research_stats.py \
            --input "$RUNNER_TEMP/surveillance-ledger.json"
          python scripts/curation/build_curator_stats.py
          python scripts/validation/validate_archive.py
          python scripts/validation/validate_site.py
          node --check site/app.js
          node --check site/stats.js
          node --check site/curator.js

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
