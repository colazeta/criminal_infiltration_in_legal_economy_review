name: Validate and publish archive

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:
  issue_comment:
    types: [created]
  workflow_run:
    workflows: ["Stage daily intake in curator queue"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: archive-${{ github.workflow }}-${{ github.event_name == 'issue_comment' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    if: >-
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository)) &&
      (github.event_name != 'issue_comment' ||
      (github.event.issue.number == 30 &&
       github.event.comment.user.login == github.repository_owner &&
       startsWith(github.event.comment.body, 'Daily surveillance batch ACADEMIC-')))
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0


      - name: Validate immutable intake history
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          base="HEAD"
          if [ "$EVENT_NAME" = "pull_request" ]; then base="$PR_BASE"; fi
          if [ "$EVENT_NAME" = "push" ]; then base="$PUSH_BASE"; fi
          python3 scripts/validation/validate_intake_history.py --base "$base"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Validate repository and tests
        run: |
          python scripts/validation/validate_repository.py
          python scripts/ontology/validate_ontology.py
          python scripts/ontology/build_model_browser.py
          git diff --exit-code -- site/vocab/review-v2-model.json
          python -m unittest discover -s tests -p 'test_*.py'
          python scripts/report_saturation.py

      - name: Verify deterministic committed export
        run: |
          python scripts/build_archive.py --output-dir "$RUNNER_TEMP/archive"
          python scripts/build_secondary_collections.py --output-dir "$RUNNER_TEMP/archive"
          python scripts/metrics/build_research_stats.py --output "$RUNNER_TEMP/archive/research-stats.json"
          python scripts/curation/build_curator_stats.py --output "$RUNNER_TEMP/archive/curator-stats.json"
          python scripts/curation/build_curator_options.py --output "$RUNNER_TEMP/archive/curator-options.json"
          diff -ru "$RUNNER_TEMP/archive" site/data
          python scripts/validation/validate_archive.py
          python scripts/validation/validate_site.py
          node --check scripts/abstracts/backfill_coverage.mjs
          node --check scripts/expansion/citation_frontier.mjs
          node --check site/app.js
          node --check site/aml.js
          node --check site/stats.js
          node --check site/bibliometrics.js
          node --check site/curator.js
          node --check site/curator-config.js
          node --check site/curator-consensus.js
          node --check site/curator-reading.js
          node --check site/curator-assisted-resolution.js
          node --check site/curator-queue.js
          node --check site/curator-resolved-link.js
          node --check curator-app/src/index.js
          node --check curator-app/src/enrichment.js
          node --check curator-app/src/scholarly-providers.js
          node --check curator-app/src/open-scholarly-providers.js
          node --check curator-app/src/metadata-reconciliation.js
          node --check curator-app/src/citation-chasing.js
          node --check curator-app/src/provider-budget.js
          node --check curator-app/src/provider-readiness.js
          node --check curator-app/src/web-capability-resolver.js
          node --check curator-app/src/free-web-search.js
          node --check curator-app/src/resolved-abstract.js
          node --check curator-app/src/worker.js
          node --test curator-app/test/*.test.js

  deploy:
    concurrency:
      group: archive-pages
      cancel-in-progress: false
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Fetch validated daily research metrics
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LEDGER_AUTHOR: ${{ github.repository_owner }}
        run: |
          # Canonical validation remains delegated to scripts/metrics/fetch_surveillance_ledger.py.
          # The wrapper removes only the explicitly quarantined immutable #317 terminal first.
          python scripts/metrics/fetch_surveillance_ledger_quarantine.py \
            --repository "$GITHUB_REPOSITORY" \
            --issue 30 \
            --allowed-author "$LEDGER_AUTHOR" \
            --output "$RUNNER_TEMP/surveillance-ledger.json"

      - name: Build release artifact
        run: |
          python scripts/build_archive.py
          python scripts/build_secondary_collections.py
          python scripts/metrics/build_research_stats.py \
            --input "$RUNNER_TEMP/surveillance-ledger.json" \
            --as-of "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python scripts/curation/build_curator_stats.py
          python scripts/curation/build_paper_register.py
          python scripts/curation/build_curator_options.py
          python scripts/validation/validate_archive.py
          python scripts/validation/validate_site.py
          node --check scripts/abstracts/backfill_coverage.mjs
          node --check scripts/expansion/citation_frontier.mjs
          node --check site/app.js
          node --check site/aml.js
          node --check site/stats.js
          node --check site/bibliometrics.js
          node --check site/curator.js
          node --check site/curator-config.js
          node --check site/curator-consensus.js
          node --check site/curator-reading.js
          node --check site/curator-assisted-resolution.js
          node --check site/curator-queue.js
          node --check site/curator-resolved-link.js
          node --check curator-app/src/index.js
          node --check curator-app/src/enrichment.js
          node --check curator-app/src/scholarly-providers.js
          node --check curator-app/src/open-scholarly-providers.js
          node --check curator-app/src/metadata-reconciliation.js
          node --check curator-app/src/citation-chasing.js
          node --check curator-app/src/provider-budget.js
          node --check curator-app/src/provider-readiness.js
          node --check curator-app/src/web-capability-resolver.js
          node --check curator-app/src/free-web-search.js
          node --check curator-app/src/resolved-abstract.js
          node --check curator-app/src/worker.js
          node --test curator-app/test/*.test.js

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
