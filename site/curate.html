<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Console curatoriale per lo screening della systematic review Criminal Infiltration."
    />
    <title>Curator · Criminal Infiltration</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>◫</text></svg>" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./curator-config.js" defer></script>
    <script src="./curator.js" defer></script>
  </head>
  <body class="curator-page">
    <a class="skip-link" href="#editorial-console">Vai alla coda</a>

    <main id="main-content">
      <section class="curator-workspace" id="curator-workflow" aria-labelledby="page-title">
        <section class="editorial-app" id="editorial-app" aria-labelledby="page-title">
          <div class="curator-titlebar">
            <h1 id="page-title">CURATOR</h1>
            <span>CRIMINAL INFILTRATION REVIEW</span>
          </div>

          <div class="curator-app-message" id="curator-app-message" role="status" aria-live="polite" hidden></div>

          <div class="curator-app-unavailable" id="curator-app-unavailable" hidden>
            <strong id="curator-unavailable-title">Console sicura richiesta</strong>
            <span id="curator-unavailable-copy">Apri l’origine autenticata del curatore.</span>
            <a class="classic-button" id="curator-secure-app" hidden>APRI CONSOLE</a>
          </div>

          <div class="curator-login-panel" id="curator-login-panel" hidden>
            <span>ACCESSO CURATORE</span>
            <a class="classic-button" id="curator-login" href="#editorial-app">LOGIN GITHUB</a>
          </div>

          <div class="curator-session-panel" id="curator-session-panel" hidden>
            <span>USER: <strong id="curator-login-name">—</strong></span>
            <button class="classic-button" id="curator-logout" type="button">LOGOUT</button>
          </div>

          <div class="editorial-console" id="editorial-console" hidden>
            <aside class="candidate-browser" aria-labelledby="candidate-browser-title">
              <div class="candidate-browser-heading">
                <h2 id="candidate-browser-title">QUEUE</h2>
                <span id="candidate-result-count">—</span>
              </div>

              <div class="candidate-controls">
                <label>
                  <span>SEARCH</span>
                  <input
                    id="candidate-search"
                    type="search"
                    placeholder="titolo / autore / DOI / ID"
                    autocomplete="off"
                  />
                </label>
                <label>
                  <span>FILTER</span>
                  <select id="candidate-lane-filter">
                    <option value="">TUTTI</option>
                    <option value="metadata_fix">METADATI</option>
                    <option value="manual_review">MANUALE</option>
                    <option value="abstract_full_text_review">TESTO</option>
                    <option value="legacy_rejection_review">LEGACY</option>
                  </select>
                </label>
              </div>

              <div class="candidate-list" id="candidate-list" aria-live="polite"></div>
              <p class="candidate-list-empty" id="candidate-list-empty" hidden>NESSUN RECORD</p>
            </aside>

            <section class="candidate-decision-panel" aria-labelledby="candidate-decision-title">
              <div class="candidate-empty-state" id="candidate-empty-state">
                <h2 id="candidate-decision-title">SELEZIONA UN RECORD</h2>
              </div>

              <article class="candidate-detail" id="candidate-detail" hidden>
                <div class="candidate-detail-heading">
                  <div>
                    <code id="selected-candidate-id">—</code>
                    <h2 id="selected-candidate-title">—</h2>
                  </div>
                  <a id="selected-candidate-issue" href="https://github.com" hidden>AUDIT</a>
                </div>

                <dl class="candidate-metadata">
                  <div><dt>AUTORI</dt><dd id="selected-candidate-authors">—</dd></div>
                  <div><dt>ANNO</dt><dd id="selected-candidate-year">—</dd></div>
                  <div><dt>SEDE</dt><dd id="selected-candidate-venue">—</dd></div>
                  <div>
                    <dt>DOI</dt>
                    <dd>
                      <span id="selected-candidate-doi">—</span>
                      <a id="selected-candidate-doi-link" href="https://doi.org" hidden>↗</a>
                    </dd>
                  </div>
                  <div><dt>FONTE</dt><dd id="selected-candidate-source">—</dd></div>
                  <div><dt>STAGE</dt><dd id="selected-candidate-stage">—</dd></div>
                </dl>

                <div class="curator-internal-data" hidden>
                  <span id="selected-provenance-kind">—</span>
                  <dl id="candidate-provenance"></dl>
                </div>
              </article>

              <form class="decision-form" id="decision-form" autocomplete="off" hidden>
                <div class="decision-form-heading">
                  <strong>SCREENING</strong>
                  <code id="form-candidate-id">—</code>
                </div>

                <div class="decision-fields">
                  <label>
                    <span>STAGE</span>
                    <select id="screening-stage" required></select>
                  </label>
                  <label>
                    <span>DECISIONE</span>
                    <select id="decision" required></select>
                  </label>
                  <label>
                    <span>CONFIDENZA</span>
                    <select id="confidence" required></select>
                  </label>

                  <label id="exclusion-field" hidden>
                    <span>ESCLUSIONE</span>
                    <select id="exclusion-reason"></select>
                  </label>
                  <label id="topic-field" hidden>
                    <span>TEMA</span>
                    <select id="topic-code"></select>
                  </label>
                  <label id="duplicate-field" hidden>
                    <span>DUPLICATO DI</span>
                    <input id="duplicate-target" type="text" maxlength="60" />
                  </label>
                  <label id="secondary-collection-field" hidden>
                    <span>RACCOLTA SECONDARIA</span>
                    <select id="secondary-collection"></select>
                  </label>
                  <label class="wide-field" id="secondary-rationale-field" hidden>
                    <span>NOTA RACCOLTA SECONDARIA</span>
                    <textarea id="secondary-rationale" rows="2" maxlength="2000"></textarea>
                  </label>

                  <label class="wide-field">
                    <span>EVIDENZA ESAMINATA</span>
                    <textarea
                      id="evidence-basis"
                      rows="2"
                      maxlength="2000"
                      required
                      placeholder="abstract / sintesi / sezione / pagina / fonte"
                    ></textarea>
                  </label>
                  <label class="wide-field">
                    <span>MOTIVAZIONE</span>
                    <textarea
                      id="decision-rationale"
                      rows="3"
                      maxlength="2000"
                      required
                    ></textarea>
                  </label>
                </div>

                <div class="decision-submit-row">
                  <label class="explicit-confirmation">
                    <input id="explicit-confirmation" type="checkbox" required />
                    <span>CONFERMO LA DECISIONE</span>
                  </label>
                  <button class="classic-button" id="submit-decision" type="submit">SALVA</button>
                </div>
                <div class="decision-result" id="decision-result" role="status" aria-live="polite" hidden></div>
              </form>
            </section>
          </div>

          <!-- Aggregate compatibility data stays non-visual; the operating page no longer renders a dashboard. -->
          <div class="curator-aggregate-data" hidden aria-hidden="true">
            <span id="curator-actions"></span>
            <span id="queue-total"></span>
            <span id="queue-metadata"></span>
            <span id="queue-manual"></span>
            <span id="queue-abstract"></span>
            <span id="queue-legacy-rejected"></span>
            <span id="queue-secondary-aml"></span>
            <span id="queue-origin-summary"></span>
            <span id="last-run-status"></span>
          </div>
        </section>
      </section>
    </main>
  </body>
</html>
