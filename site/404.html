<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found · Criminal Infiltration Literature Archive</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./classic-site.css" />
    <link rel="stylesheet" href="./application.css" />
  </head>
  <body class="classic-site classic-404">
    <main>
      <section class="error-window" role="alert" aria-labelledby="error-title">
        <div class="error-titlebar">CRIMINAL INFILTRATION · ERROR 404</div>
        <div class="error-body">
          <p class="eyebrow">HTTP 404</p>
          <h1 id="error-title">Page not found</h1>
          <p>The requested resource is not available in this archive.</p>
          <p><a id="home-link" href="/">Return to the publication archive</a>.</p>
        </div>
      </section>
    </main>
    <script>
      const root = location.hostname.endsWith("github.io")
        ? "/criminal_infiltration_in_legal_economy_review/"
        : "/";
      document.querySelector("#home-link").href = root;
    </script>
  </body>
</html>
